// Blatt 1: eine Zeile je Ausgabe. Blatt 2: eine Zeile je Kongress-Eintrag.
// Die Spalten folgen dem Inhaltsfilter – sind nur Berichte gewaehlt, taucht
// keine Auslagen-Spalte auf, damit die Datei nicht mehr behauptet als der Kopf.
// Fuer die Spalte "Themenschwerpunkte" gilt dasselbe: ohne gewaehlte
// Themenschwerpunkte faellt sie weg, weil sie dann auch am Bildschirm
// ausgeblendet sind.
function excelBlaetter(q){
  const items  = collect(q);
  const zeigeA = zeigtA();
  const zeigeB = zeigtB();
  const zeigeT = zeigeThema();

  // Spalte "Jahrgang" fuehrt die Tabelle an: dieses Blatt ist zugleich der Weg
  // zurueck ins Werkzeug, und dort muss stehen, zu welchem Jahr die Zeilen
  // gehoeren. Die Spaltenfolge darf nicht vertauscht werden – gelesen wird
  // allerdings ueber die Ueberschriften, nicht ueber die Position.
  const kopf1=['Jahrgang','Titel','Heft','Erscheinungstermin (ET)','Anzeigenschluss (AS)',
    'Druckunterlagen (DU)','Ein-/Durchhefter und Beilagen (EH)','Auflage'];
  const breiten1=[9,40,7,13,13,13,16,9];
  if(zeigeT){ kopf1.push('Themenschwerpunkte'); breiten1.push(46); }
  const zeigeR = zeigeRubrik() && hatRubriken();
  if(zeigeR){ kopf1.push('Weitere Rubriken'); breiten1.push(46); }
  if(zeigeA){ kopf1.push('Kongresse'); breiten1.push(46); }
  if(zeigeB){ kopf1.push('Kongressberichte'); breiten1.push(46); }

  const zeilen1=items.map(({j,iss})=>{
    const z=[{w:jahrgang()},{w:j.short},{w:iss.heft},
      {w:excelDatum(iss.et),t:'n',s:2},{w:excelDatum(iss.as),t:'n',s:2},
      {w:excelDatum(iss.du),t:'n',s:2},{w:excelDatum(iss.eh),t:'n',s:2},
      {w:j.auflage,t:'n'}];
    if(zeigeT) z.push({w:themaText(iss),s:3});
    if(zeigeR) z.push({w:rubrikEintraege(iss).map(e=>e.name+': '+e.text).join('\n'),s:3});
    if(zeigeA) z.push({w:iss.a.map(kongressText).join('\n'),s:3});
    if(zeigeB) z.push({w:iss.b.map(kongressText).join('\n'),s:3});
    return z;
  });

  const eintraege=[];
  items.forEach(({j,iss})=>{
    if(zeigeA) iss.a.forEach(n=>{const k=KONG.get(n); if(!k) return;
      eintraege.push({name:kongName(k.lang),art:'Auslage',j,iss,k});});
    if(zeigeB) iss.b.forEach(n=>{const k=KONG.get(n); if(!k) return;
      eintraege.push({name:kongName(k.lang),art:'Bericht',j,iss,k});});
  });
  const rubrik=n=>n.startsWith('»')?1:0;
  eintraege.sort((a,b)=>rubrik(a.name)-rubrik(b.name)
    || a.name.localeCompare(b.name,'de') || a.iss.et.localeCompare(b.iss.et));

  // Kongress, Zeitraum und Ort stehen in eigenen Spalten - anders als am
  // Bildschirm, wo der zusammengesetzte Wortlaut steht. In einer Tabelle
  // nuetzt getrennt mehr: sie laesst sich nach Ort oder Zeitraum filtern.
  const kopf2=['Kongress','Zeitraum','Ort','Titel','Heft',
    'Erscheinungstermin (ET)','Anzeigenschluss (AS)','Druckunterlagen (DU)',
    'Ein-/Durchhefter und Beilagen (EH)','Auflage'];
  const breiten2=[52,15,20,40,7,13,13,13,16,9];
  if(zeigeT){ kopf2.push('Themenschwerpunkte'); breiten2.push(44); }
  const zeilen2=eintraege.map(e=>{
    const z=[{w:e.k.lang},{w:kongressZeitraum(e.k)},{w:e.k.ort||''},
      {w:e.j.short},{w:e.iss.heft},
      {w:excelDatum(e.iss.et),t:'n',s:2},{w:excelDatum(e.iss.as),t:'n',s:2},
      {w:excelDatum(e.iss.du),t:'n',s:2},{w:excelDatum(e.iss.eh),t:'n',s:2},
      {w:e.j.auflage,t:'n'}];
    if(zeigeT) z.push({w:themaText(e.iss),s:3});
    return z;
  });

  const zahlen = eingeschraenkt(q) ? `${items.length} von ${GESAMT} Ausgaben`
                                   : `${GESAMT} Ausgaben`;
  const vorspann=[
    [`Jahresvorschau ${fachKopf()} ${jahrgang()}`,4],
    [nurText(kopfZeile(q,zahlen)),0],
    [`Stand der Heftplanung ${standText()}`,5]
  ];

  return {
    blatt1:   blattXml(breiten1,vorspann,kopf1,zeilen1),
    blatt2:   null,
    ausgaben: items.length,
    eintraege:eintraege.length
  };
}

      `<Relationship Id="rId9" Type="${NS}/styles" Target="styles.xml"/>`+
      `</Relationships>`},
    {name:'xl/styles.xml', text:XLSX_STYLES},
    {name:'xl/worksheets/sheet1.xml', text:b.blatt1}
  ];
  if(zwei) teile.push({name:'xl/worksheets/sheet2.xml', text:b.blatt2});

  const enc=new TextEncoder();
  return zipBauen(teile.map(t=>({name:t.name,bytes:enc.encode(t.text)})));
}

// ─── Ausgabe fuer die Datenpflege ──────────────────────────────────────────
// Die Kongresse stehen doppelt: hier vollstaendig mit langem Namen und
// getrennt nach Auslage/Bericht, in der Datenpflege der Angebotswerkzeuge kurz
// und in einer Zelle je Ausgabe. Dieser Weg erzeugt die Zelle - kein zweiter
// Datenbankschluessel, kein Schreibzugriff ueber Projektgrenzen: das Ergebnis
// wird abgelegt und von Hand uebernommen.
//
// Ein Kongress ohne Termin traegt kein Datum, das sich in die Zeile setzen
// liesse - er faellt hier aus und zaehlt im Bericht mit.
function dpZeile(k, art){
  if(!k || (!k.von && !k.unscharf)) return null;
  const teile = [`${k.kurz||k.lang} (${art})`, kongressZeitraum(k)];
  if(k.ort) teile.push(k.ort);
  return teile.join(', ');
}

function dpKongressText(iss){
  const zeilen = [];
  (iss.a||[]).forEach(id=>{ const z=dpZeile(KONG.get(id),'Auslage'); if(z) zeilen.push(z); });
  (iss.b||[]).forEach(id=>{ const z=dpZeile(KONG.get(id),'Bericht'); if(z) zeilen.push(z); });
  return zeilen.join('\n');
}

// TT.MM., ohne Jahr - wie in Angebotsdaten.xlsx, ausser der Termin liegt
// ausserhalb des Jahrgangs: dann traegt er die zweistellige Jahreszahl.
function dpTermin(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return y===jahr ? `${d}.${m}.` : `${d}.${m}.${y.slice(2)}`;
}

function dpMonat(iso){
  if(!iso) return '';
  return MONATE[Number(iso.slice(5,7))-1] || '';
}

// Ein Blatt aus einer einzigen Spalte Text, vor "Termine". Bis zum 18.09.2026
// stand hier eine Abschreibanleitung: Die Datenpflege wies jede Datei ohne
// Preiszeilen ab, die Kongresse mussten mit Hilfsspalte und zwei Verweisformeln
// in den Abzug uebertragen werden. Seit sie Ergaenzungsdateien annimmt, bleibt
// der kurze Weg - das Blatt sagt nur noch, wo er beginnt.
function dpHinweisZeilen(){
  const F=(w,s)=>({w,s});
  return [
    F(`Kongresse für die Datenpflege — Jahrgang ${jahr}`,4),
    F(`Erzeugt aus der Jahresvorschau, Stand ${standText()}`,5),
    F('',0),
    F('So werden die Angaben übernommen',6),
    F('In der Datenpflege der Angebotswerkzeuge „Aus Excel laden …" und diese Datei wählen.',0),
    F('Die Datenpflege erkennt an der Datei selbst, dass sie eine Ergänzung ist, und zeigt vor',0),
    F('der Übernahme, welche Ausgaben sich ändern. Übernommen wird allein die Spalte',0),
    F('„Kongresse"; Preise, Termine und Themenschwerpunkte bleiben unangetastet.',0),
    F('',0),
    F('Zugeordnet wird über Jahrgang, Titel und Heft — die drei ersten Spalten. Eine Ausgabe,',0),
    F('die es in der Datenpflege nicht gibt, wird übergangen und im Bericht genannt.',0),
    F('',0),
    F('Die übrigen Spalten stehen nur zur Orientierung dabei: Sie zeigen, welche Ausgabe',5),
    F('gemeint ist, und werden beim Einlesen nicht ausgewertet.',5),
    F('',0),
    F('Die Kongresszeile selbst steht in der Schreibweise der Angebotswerkzeuge:',5),
    F('Kurzname (Auslage), Zeitraum, Ort — je Kongress eine eigene Zeile.',5)
  ];
}

// Eine Spalte, eine Zeile je Textzeile: kein Kopf, kein Filter, keine Fixierung.
function hinweisBlattXml(zeilen){
  const aus=zeilen.map((z,i)=>`<row r="${i+1}">`+zelle('A'+(i+1),z.w,'s',z.s)+`</row>`);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
    `<cols><col min="1" max="1" width="104" customWidth="1"/></cols>`+
    `<sheetData>`+aus.join('')+`</sheetData></worksheet>`;
}

// Die Spalte "Themenschwerpunkte" fehlt mit Absicht: Die Datenpflege uebernimmt
// jede Inhaltsspalte, die in der Datei steht. Die Themen werden aber dort
// gefuehrt, nicht hier - stuenden sie in der Datei, schriebe dieser Weg sie
// stillschweigend zurueck.
function datenpflegeBlatt(){
  const kopf = ['Jahrgang','Titel','Heft','Monat','ET','AS','DU-Schluss','EH-Termin','Kongresse'];
  const breiten = [9,40,7,10,9,9,10,10,60];
  const zeilen = [];
  let mitKongress=0, ohneTermin=0;
  JOURNALS.forEach(t=>t.issues.forEach(iss=>{
    const text = dpKongressText(iss);
    if(text) mitKongress++;
    [...(iss.a||[]),...(iss.b||[])].forEach(id=>{
      const k=KONG.get(id); if(k && !k.von && !k.unscharf) ohneTermin++;
    });
    zeilen.push([{w:jahr},{w:t.short},{w:iss.heft},{w:dpMonat(iss.et)},
      {w:dpTermin(iss.et)},{w:dpTermin(iss.as)},{w:dpTermin(iss.du)},{w:dpTermin(iss.eh)},
      {w:text}]);
  }));
  const vorspann=[
    [`Kongresse für die Datenpflege — Jahrgang ${jahr}`,4],
    [`Ergänzung für die Angebotswerkzeuge — dort über „Aus Excel laden …" einlesen`,0],
    [`Erzeugt aus der Jahresvorschau, Stand ${standText()}`,5]
  ];
  return {xml: blattXml(breiten,vorspann,kopf,zeilen),
    hinweis: hinweisBlattXml(dpHinweisZeilen()),
    ausgaben:zeilen.length, mitKongress, ohneTermin};
}

// Eigene, schlanke Zip-Verpackung statt baueXlsx wiederzuverwenden: zwei feste
// Blaetter, keine Bedingungen - so bleibt der geprüfte Excel-Export unangetastet.
// „Hinweise" steht vorn, damit der Weg beim Öffnen zuerst dasteht.
function baueDatenpflegeXlsx(hinweisXmlText, blattXmlText){
  const NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const teile=[
    {name:'[Content_Types].xml', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
      `<Default Extension="xml" ContentType="application/xml"/>`+
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`+
      `</Types>`},
    {name:'_rels/.rels', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${NS}/officeDocument" Target="xl/workbook.xml"/>`+
      `</Relationships>`},
    {name:'xl/workbook.xml', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${NS}">`+
      `<sheets><sheet name="Hinweise" sheetId="1" r:id="rId1"/>`+
      `<sheet name="Termine" sheetId="2" r:id="rId2"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${NS}/worksheet" Target="worksheets/sheet1.xml"/>`+
      `<Relationship Id="rId2" Type="${NS}/worksheet" Target="worksheets/sheet2.xml"/>`+
      `<Relationship Id="rId9" Type="${NS}/styles" Target="styles.xml"/>`+
      `</Relationships>`},
    {name:'xl/styles.xml', text:XLSX_STYLES},
    {name:'xl/worksheets/sheet1.xml', text:hinweisXmlText},
    {name:'xl/worksheets/sheet2.xml', text:blattXmlText}
  ];
  const enc=new TextEncoder();
  return zipBauen(teile.map(t=>({name:t.name,bytes:enc.encode(t.text)})));
}

    'Schließen');

// Zwischenablage fuer die gerade bearbeitete Ausgabe - der schnellere Weg,
// wenn nur eine einzelne Zeile gebraucht wird.
async function dpZeileKopieren(){
  if(!bearbAuswahl || bearbAuswahl.art!=='ausgabe' || bearbAuswahl.neu) return;
  const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
  const iss = t && t.issues[bearbAuswahl.index];
  if(!iss) return;
  const text = dpKongressText(iss);
  if(!text) return bearbStand('Diese Ausgabe führt keinen Kongress mit Termin.', 'schlecht');
  try{
    await navigator.clipboard.writeText(text);
    bearbStand('In die Zwischenablage kopiert', 'gut');
  }catch(fehler){
    bearbStand('Kopieren nicht möglich - der Browser hat es verweigert.', 'schlecht');
  }
}

// ─── Render ────────────────────────────────────────────────────────────────
function render(){
  // Steht am Anfang, weil die Titel-Schalter bei jedem Jahrgangswechsel neu
  // entstehen und sonst wieder bedienbar waeren.
  bearbAnzeige();
  // Eine leere Datei zeigt bei jedem Zeichnen die Startseite, auch nach
  // einem Klick auf die Schalter oben - sonst verschwaende sie ohne Rueckweg.
  if(DATEN && !Object.keys(DATEN).length) return leerAnsicht();
  inhaltsArtenPruefen();
  const q = document.getElementById('q').value.trim();
  const res = document.getElementById('results');
  const sts = document.getElementById('stats');
  const jCount = activeJ.size||JOURNALS.length;
  const suchInfo = q?` &middot; Suche: <strong>&raquo;${q}&laquo;</strong>`:'';

  if(bearbOffen){
    // Die Liste links wird bei jedem Zeichnen mitsamt ihrem Kasten neu
    // aufgebaut, und ein frisches Element steht oben. Ohne dieses Merken
    // spraenge die Liste bei jeder Auswahl an den Anfang zurueck - wer weiter
    // unten arbeitet, muesste sich jedes Mal neu herunterrollen.
    const alteListe = res.querySelector('.bearb-liste');
    const listeStand = alteListe ? alteListe.scrollTop : 0;
    // Dasselbe fuer das Rollfeld der Kongressmatrix, seit die Tabelle in sich
    // rollt: ohne dieses Merken staende sie nach jedem Klick wieder am Anfang -
    // schlechter als vorher, wo die Seite rollte und stehen blieb. Waagerecht
    // ebenso, sonst spraenge auf schmalem Schirm die Spaltenwahl zurueck.
    // Die rechte Spalte behaelt ihren Stand, solange dieselbe Ausgabe offen
    // bleibt (Speichern, Kongress zuordnen). Eine neue Auswahl beginnt oben.
    const alteRechts = res.querySelector('.bearb-rechts');
    const rechtsStand = (alteRechts
      && alteRechts.dataset.wahl === JSON.stringify(bearbAuswahl||null))
      ? alteRechts.scrollTop : 0;
    const alteMx = res.querySelector('.mx-scroll');
    const mxStand = (alteMx && !mxRollZurueck)
      ? {y:alteMx.scrollTop, x:alteMx.scrollLeft} : null;
    mxRollZurueck = false;
    res.className='bearbansicht';
    res.innerHTML=renderBearbeiten();
    // Vor dem Zurueckstellen der Rollstaende: erst die endgueltige Hoehe,
    // sonst schnitte ein zu kleines Feld den gemerkten Stand ab.
    rollfelderAnpassen();
    if(listeStand){
      const neueListe = res.querySelector('.bearb-liste');
      if(neueListe) neueListe.scrollTop = listeStand;
    }
    if(rechtsStand){
      const neueRechts = res.querySelector('.bearb-rechts');
      if(neueRechts) neueRechts.scrollTop = rechtsStand;
    }
    if(mxStand && (mxStand.y || mxStand.x)){
      const neueMx = res.querySelector('.mx-scroll');
      if(neueMx){ neueMx.scrollTop = mxStand.y; neueMx.scrollLeft = mxStand.x; }
    }
    // Keine Statuszeile in der Arbeitsansicht: dass hier bearbeitet wird, sagt
    // das Etikett hinter dem Jahrgang im Kopf (.bm-etikett), den Jahrgang der
    // Titel. Die leere Zeile blendet body.bearbmodus .stats aus.
    sts.innerHTML='';
    bearbStand(bearbStandText,bearbStandArt);
    return;
  }

  if(view==='kongress'){
    res.className='konglist';
    if(!zeigtA() && !zeigtB()){
      res.innerHTML=`<div class="empty"><h3>Keine Kongresse in dieser Auswahl</h3><p>Der Inhaltsfilter &raquo;Themenschwerpunkte&laquo; blendet Auslagen und Berichte aus. Für die Kongressansicht bitte zusätzlich Auslagen oder Berichte wählen.</p></div>`;
      sts.innerHTML=`<strong>0</strong> Kongresse &middot; ${jCount} Titel${suchInfo}`;
      setzeExportKopf(q,'0 Kongresse');
      return;
    }
    const k=renderKongress(q);
    res.innerHTML = k.anzahl ? k.html : leer(q);
    sts.innerHTML=`<strong>${k.anzahl}</strong> Kongress${k.anzahl!==1?'e':''} &middot; ${k.eintraege} Eintr${k.eintraege!==1?'äge':'ag'} &middot; ${jCount} Titel${suchInfo}`;
    setzeExportKopf(q,`${k.anzahl} Kongress${k.anzahl!==1?'e':''} &middot; ${k.eintraege} Eintr${k.eintraege!==1?'äge':'ag'}`);
    return;
  }

  const items = collect(q);
  const n = items.length;
  setzeExportKopf(q, eingeschraenkt(q) ? `${n} von ${GESAMT} Ausgaben`
                                       : `${GESAMT} Ausgaben`);
  sts.innerHTML=`<strong>${n}</strong> Ausgabe${n!==1?'n':''} &middot; ${jCount} Titel${suchInfo}`;

  if(view==='matrix'){
    res.className='matrixview';
    res.innerHTML = n ? renderMatrix(items,q) : leer(q);
    return;
  }
  if(!n){
    res.className='grid';
    res.innerHTML=leer(q);
    return;
  }
  if(view==='liste'){ res.className='liste'; res.innerHTML=renderListe(items,q); return; }
  if(view==='tabelle'){ res.className='tabelleview'; res.innerHTML=renderTabelle(items,q); return; }
  res.className='grid';
  res.innerHTML=renderCards(items,q);
}

// Der Stand wandert beim Verlassen des Feldes in die Datenbank. Einen eigenen
// Speichern-Knopf gibt es im Kopf nicht - ein Wert, der nur auf dem Schirm
// steht, waere beim naechsten Laden wieder fort. Unveraenderter Text loest
// nichts aus.
async function standSpeichern(){
  const y = jahrgang(), neu = standText();
  if(!bearbOffen || !DATEN[y] || neu === DATEN[y].stand) return;
  bearbStand('Der Stand wird gespeichert \u2026', '');
  try{
    await dbAnfrage('/rest/v1/jahrgang?jahr=eq.' + encodeURIComponent(y),
      {method:'PATCH', headers:{Prefer:'return=minimal'},
       body: JSON.stringify({stand: neu})});
    DATEN[y].stand = neu;
    bearbStand('Der Stand wurde gespeichert', 'gut');
  }catch(fehler){
    bearbStand(fehlertext(fehler), 'schlecht');
  }
}

// Stand-Feld: Startwert setzen und die Eingabe auf reinen Text festhalten. In
// einer Kopie steht der Wert schon im Dokument und ist nicht mehr aenderbar.
(function(){
  const f=document.getElementById('standFeld');
  if(!f) return;
  if(!f.textContent.trim()) f.textContent = standStart();
  if(f.getAttribute('contenteditable')==='false') return;
  // "plaintext-only" kennt nicht jeder Browser – notfalls hier normalisieren
  f.addEventListener('blur',()=>{
    const t=f.textContent.replace(/\s+/g,' ').trim();
    f.textContent = t || standStart();
    render();                       // Kopf und kommende Exporte nachziehen
    standSpeichern();
  });
  f.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); f.blur(); }
  });
})();

// ─── Bearbeiten ─────────────────────────────────────────────────────────────
// Eine eigene Ansicht. Die fuenf uebrigen sind zugleich Druckvorlage und
// bleiben unberuehrt.
//
// Gearbeitet wird auf einer Arbeitskopie der gewaehlten Ausgabe ("entwurf").
// Erst das Speichern schreibt sie in die Datenbank und danach in den
// angezeigten Jahrgang. Dadurch ueberlebt eine angefangene Aenderung jedes
// Neuzeichnen, und ein Abbruch laesst den gezeigten Stand unangetastet.

// bearbAuswahl sagt, woran gearbeitet wird:
//   {art:'ausgabe', titelId, index}          eine vorhandene Ausgabe
//   {art:'ausgabe', titelId, neu:true}       eine noch nicht angelegte
//   {art:'titel',   titelId}                 die Stammdaten eines Titels
//   {art:'titel',   neu:true}                ein noch nicht angelegter Titel
let bearbAuswahl = null;
let entwurf      = null;       // Arbeitskopie der gewaehlten Ausgabe
let entwurfRein  = null;       // derselbe Stand beim Oeffnen, zum Vergleich
let bearbStandText = '';
let bearbStandArt  = '';
let sicherungen    = [];
let sicherungenFehler = '';
let sicherungenLaeuft = false;   // leer, solange der letzte Abruf gelang

const TERMINE = [
  ['et','Erscheinungstermin'], ['as','Anzeigenschluss'],
  ['du','Druckunterlagen'],    ['eh','Anlieferung']
];

// esc() deckt Textinhalte ab; in einem Attribut muss zusaetzlich das
// Anfuehrungszeichen weichen.
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }

function entwurfGeaendert(){
  return !!entwurf && JSON.stringify(entwurf) !== entwurfRein;
}

function bearbStand(text, art){
  bearbStandText = text || '';
  bearbStandArt  = art  || '';
  // Steht ein Formular mit Fuss da, gehoert die Rueckmeldung dorthin, neben
  // Speichern: seit die rechte Spalte in sich rollt, laege die Zeile unter dem
  // Formular oft ausserhalb des Sichtbaren. Ohne Formular (keine Auswahl,
  // Kongressansicht) bleibt es bei der Zeile #bearbStand.
  const fuss = document.getElementById('bearbStandFuss');
  const zeile = document.getElementById('bearbStand');
  const e = fuss || zeile;
  if(fuss && zeile){ zeile.textContent = ''; zeile.className = 'bearb-stand'; }
  if(e){ e.textContent = bearbStandText; e.className = 'bearb-stand ' + bearbStandArt; }
  const s = document.getElementById('bearbSpeichern');
  const v = document.getElementById('bearbVerwerfen');
  if(s) s.disabled = !speicherbar();
  if(v) v.disabled = !entwurfGeaendert();
}

// Rueckfragefenster, an der Stelle von confirm(). Der Vorteil liegt weniger in
// der Optik als in der Beschriftung: der Browser konnte nur „OK" und
// „Abbrechen" anbieten, hier steht auf dem Knopf, was er tut.
//
// Anders als dialogZeigen belegt es nicht den vorhandenen Dialog, sondern legt
// ein eigenes Blatt an und raeumt es wieder weg - zwei der Rueckfragen kommen
// aus einem offenen Dialog heraus. Die Klasse daten-dialog wird mitgenommen,
// damit die Regeln fuer Druck und HTML-Kopie greifen, die es dort ausblenden
// bzw. entfernen; der hoehere z-Wert legt die Rueckfrage darueber.
//
// Zurueck kommt ein Versprechen mit true (bestaetigt) oder false (abgelehnt).
// Abgelehnt wird auch durch Escape - wie bei confirm(), wo Escape „Abbrechen"
// entsprach. Der Fokus liegt auf dem abweisenden Knopf: die Rueckfrage steht
// vor einer Handlung, die etwas verwirft, und die Eingabetaste soll dann nichts
// ausloesen, was nicht ausdruecklich gewollt ist.
function frage(titel, html, jaText, neinText='Abbrechen'){
  return new Promise(res=>{
    const back = document.createElement('div');
    back.className = 'daten-dialog offen';
    back.style.zIndex = '500';
    back.setAttribute('role','dialog');
    back.setAttribute('aria-modal','true');
    back.innerHTML =
      '<div class="dlg-blatt">' +
        '<h3 class="dlg-kopf"></h3><div class="dlg-inhalt"></div>' +
        '<div class="dlg-fuss">' +
          '<button class="dlg-btn" data-w="nein"></button>' +
          '<button class="dlg-btn dlg-ok dlg-warnung" data-w="ja"></button>' +
        '</div>' +
      '</div>';
    back.querySelector('.dlg-kopf').textContent = titel;
    back.querySelector('.dlg-inhalt').innerHTML = html;
    const bJa = back.querySelector('[data-w="ja"]'), bNein = back.querySelector('[data-w="nein"]');
    bJa.textContent = jaText;
    bNein.textContent = neinText;
    const zu = w => {
      document.removeEventListener('keydown', escFrage, true);
      back.remove();
      res(w);
    };
    function escFrage(e){ if(e.key === 'Escape'){ e.stopPropagation(); zu(false); } }
    bJa.onclick = () => zu(true);
    bNein.onclick = () => zu(false);
    document.addEventListener('keydown', escFrage, true);
    document.body.appendChild(back);
    bNein.focus();
  });
}

// Eingabefenster, an der Stelle von prompt(). Aufbau wie frage(), nur mit einem
// Textfeld zwischen Erklaerung und Knoepfen. Zurueck kommt der eingetippte Text
// oder null, wenn abgebrochen wurde - genau wie bei prompt(). Leer ist erlaubt
// und nicht dasselbe wie abgebrochen.
// Die Eingabetaste im Feld bestaetigt, Escape bricht ab. Anders als bei der
// Rueckfrage liegt der Fokus im Feld: hier wird etwas angelegt, nichts
// verworfen, und der vorgeschlagene Text steht zum Ueberschreiben bereit.
function eingabe(titel, erklaerung, beschriftung, vorgabe, jaText){
  return new Promise(res=>{
    const back = document.createElement('div');
    back.className = 'daten-dialog offen';
    back.style.zIndex = '500';
    back.setAttribute('role','dialog');
    back.setAttribute('aria-modal','true');
    back.innerHTML =
      '<div class="dlg-blatt">' +
        '<h3 class="dlg-kopf"></h3>' +
        '<div class="dlg-inhalt"><p class="dlg-erklaerung"></p>' +
          '<label class="dlg-feld"><span></span><input type="text"></label></div>' +
        '<div class="dlg-fuss">' +
          '<button class="dlg-btn" data-w="nein">Abbrechen</button>' +
          '<button class="dlg-btn dlg-ok" data-w="ja"></button>' +
        '</div>' +
      '</div>';
    back.querySelector('.dlg-kopf').textContent = titel;
    back.querySelector('.dlg-inhalt p').textContent = erklaerung;
    back.querySelector('.dlg-feld span').textContent = beschriftung;
    const feld = back.querySelector('input');
    feld.value = vorgabe || '';
    const bJa = back.querySelector('[data-w="ja"]'), bNein = back.querySelector('[data-w="nein"]');
    bJa.textContent = jaText;
    const zu = w => {
      document.removeEventListener('keydown', escEingabe, true);
      back.remove();
      res(w);
    };
    function escEingabe(e){ if(e.key === 'Escape'){ e.stopPropagation(); zu(null); } }
    feld.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); zu(feld.value); } };
    bJa.onclick = () => zu(feld.value);
    bNein.onclick = () => zu(null);
    document.addEventListener('keydown', escEingabe, true);
    document.body.appendChild(back);
    feld.focus();
    feld.select();
  });
}

// Vor jedem Wechsel: eine angefangene Aenderung wird nicht stillschweigend
// fallengelassen. Auch der Excel-Eingang und das Entfernen eines Jahrgangs
// fragen hier nach.
async function bearbFrei(){
  return !entwurfGeaendert() ||
    await frage('Begonnene Änderung verwerfen?',
      '<p>Die begonnene Änderung ist noch nicht gespeichert. Beim Wechseln geht sie verloren.</p>',
      'Verwerfen');
}

function bearbBeginn(auswahl, roh, still){
  bearbAuswahl = auswahl;
  entwurf = roh;
  entwurfRein = JSON.stringify(entwurf);
  bearbStandText = ''; bearbStandArt = '';
  // "still" nur fuer den Jahrgangswechsel: der zeichnet ohnehin gleich neu.
  if(!still) render();
}

function kongUmgestellt(){ return !!(DATEN[jahr] && DATEN[jahr].umgestellt); }

function kongAusIssue(liste){
  return kongUmgestellt() ? (liste||[]).slice() : (liste||[]).map(kongressText);
}

// Das Oeffnen steht fuer sich, ohne Rueckfrage: beim Jahrgangswechsel ist der
// Entwurf schon verfallen, dort waere sie ein zweites Mal gestellt.
function bearbOeffneAusgabe(titelId, index, still){
  const t = JOURNALS.find(j=>j.id===titelId);
  const iss = t && t.issues[index];
  if(!iss) return;
  // Umgestellt fuehrt der Entwurf die Kennungen der Kongresse, nicht ihren
  // Wortlaut: gewaehlt wird aus den Saetzen des Jahrgangs, und ein Wortlaut,
  // den es zurueckzurechnen gaebe, entsteht gar nicht erst. Nicht umgestellt
  // bleibt es beim Freitext.
  bearbBeginn({ art:'ausgabe', titelId, index },
    { id: iss.id, heft: iss.heft, et: iss.et||'', as: iss.as||'',
      du: iss.du||'', eh: iss.eh||'', t: (iss.t||[]).slice(),
      a: kongAusIssue(iss.a), b: kongAusIssue(iss.b), r: Object.assign({}, iss.r||{}) }, still);
}

async function bearbWaehle(titelId, index){
  if(!await bearbFrei()) return;
  bearbOeffneAusgabe(titelId, index);
}

// Eine neue Ausgabe ist zunaechst nur ein leerer Entwurf. Angelegt wird sie
// erst mit »Anlegen« - wie jede andere Aenderung auch.
async function bearbNeueAusgabe(titelId){
  if(!await bearbFrei()) return;
  if(!JOURNALS.some(j=>j.id===titelId)) return;
  bearbBeginn({ art:'ausgabe', titelId, neu:true },
    { id:null, heft:'', et:'', as:'', du:'', eh:'', t:[], a:[], b:[], r:{} });
}

function bearbOeffneTitel(titelId, still){
  const t = JOURNALS.find(j=>j.id===titelId);
  if(!t) return;
  // auflage bleibt hier Text: der Entwurf wird zum Vergleich als JSON
  // geschrieben, und eine Zahl neben einer Zeichenkette gaelte sonst als
  // Aenderung, obwohl dasselbe dasteht.
  bearbBeginn({ art:'titel', titelId },
    { id:t.id, short:t.short||'', full:t.full||'',
      auflage:String(t.auflage||0), hex:t.hex||'#00285a', cover:t.cover||'',
      rubriken:(t.rubriken||[]).map(r=>({id:r.id, name:r.name})) }, still);
}

async function bearbWaehleTitel(titelId){
  if(!await bearbFrei()) return;
  bearbOeffneTitel(titelId);
}

// ─── Dieselbe Stelle nach einem Jahrgangswechsel ───────────────────────────
// Gemerkt wird die Titelnummer und, bei einer Ausgabe, die Heftnummer. Der
// Listenplatz taugt dafuer nicht: ein Jahrgang kann mehr oder weniger Hefte
// fuehren, und Heft 3 stuende dann auf einmal an der Stelle von Heft 4. Die
// Titelnummer ist ueber alle Jahrgaenge dieselbe (siehe schema.sql).
// Ein angefangener Entwurf wird nicht mitgenommen - er gehoert zum vorigen
// Jahrgang. Fehlt die Stelle drueben, bleibt es beim bisherigen Verhalten:
// keine Auswahl.
function bearbMerken(){
  if(!bearbAuswahl || bearbAuswahl.neu) return null;
  if(bearbAuswahl.art!=='ausgabe') return { art:bearbAuswahl.art, titelId:bearbAuswahl.titelId };
  const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
  const iss = t && t.issues[bearbAuswahl.index];
  return iss ? { art:'ausgabe', titelId:bearbAuswahl.titelId, heft:iss.heft } : null;
}

function bearbWiederholen(merk){
  if(!merk) return;
  const t = JOURNALS.find(j=>j.id===merk.titelId);
  if(!t) return;
  if(merk.art==='titel') return bearbOeffneTitel(t.id, true);
  const i = t.issues.findIndex(iss=>String(iss.heft)===String(merk.heft));
  if(i>=0) bearbOeffneAusgabe(t.id, i, true);
}

async function bearbNeuerTitel(){
  if(!await bearbFrei()) return;
  // Die Nummer bestimmt die Reihenfolge und wird ueber alle Jahrgaenge hinweg
  // vergeben - derselbe Titel traegt in 2026 und 2027 dieselbe.
  bearbBeginn({ art:'titel', neu:true },
    { id:naechsteTitelId(), short:'', full:'', auflage:'0', hex:farbeFuer(naechsteTitelId()), cover:'', rubriken:[] });
}

// Texteingaben zeichnen bewusst nicht neu – sonst spraenge die Schreibmarke
// bei jedem Anschlag an das Feldende.
function bearbFeld(name, wert){
  if(!entwurf) return;
  entwurf[name] = wert;
  bearbStand('Nicht gespeichert', '');
}
function bearbListe(art, i, wert){
  if(!entwurf) return;
  entwurf[art][i] = wert;
  bearbStand('Nicht gespeichert', '');
}
function bearbZeileZu(art){
  if(!entwurf) return;
  entwurf[art].push('');
  bearbFormNeu();
  const felder = document.querySelectorAll('.bearb-zeile input[data-art="'+art+'"]');
  const letztes = felder[felder.length-1];
  if(letztes) letztes.focus();
}
function bearbZeileWeg(art, i){
  if(!entwurf) return;
  entwurf[art].splice(i,1);
  bearbFormNeu();
}

// Einsortiert wird gleich nach Zeitraum, nicht angehaengt: sonst stuende der
// eben gewaehlte Kongress bis zum naechsten Laden an anderer Stelle als danach.
function bearbKongZu(art, id){
  if(!entwurf || !id || entwurf[art].includes(id)) return bearbFormNeu();
  entwurf[art].push(id);
  entwurf[art].sort((x,z)=>
    kongVergleich(kongSchluessel(KONG.get(x)), kongSchluessel(KONG.get(z))));
  bearbStand('Nicht gespeichert', '');
  bearbFormNeu();
}

function bearbKongWeg(art, i){
  if(!entwurf) return;
  entwurf[art].splice(i,1);
  bearbStand('Nicht gespeichert', '');
  bearbFormNeu();
}
async function bearbVerwerfen(){
  if(!entwurf || !bearbAuswahl) return;
  if(!await frage('Begonnene Änderung verwerfen?',
    '<p>Die begonnene Änderung wird verworfen und der zuletzt gespeicherte Stand wieder angezeigt.</p>',
    'Verwerfen')) return;
  const a = bearbAuswahl;
  entwurf = null; entwurfRein = null; bearbAuswahl = null;
  if(a.neu){ bearbStandText=''; bearbStandArt=''; render(); return; }
  if(a.art==='titel') await bearbWaehleTitel(a.titelId);
  else                await bearbWaehle(a.titelId, a.index);
}

// Gespeichert werden kann nur, was sich geaendert hat und vollstaendig genug
// ist: eine Ausgabe braucht eine Heftnummer, ein Titel beide Namen.
function speicherbar(){
  if(!entwurf || !bearbAuswahl || !entwurfGeaendert()) return false;
  if(bearbAuswahl.art==='titel')
    return !!entwurf.short.trim();
  return !!String(entwurf.heft).trim();
}

// ── Speichern ───────────────────────────────────────────────────────────────

// Ein Knopf, vier Wege: Ausgabe aendern oder anlegen, Titel aendern oder
// anlegen. Welcher gilt, steht in bearbAuswahl.
async function bearbSpeichern(){
  if(!speicherbar()) return;
  if(bearbAuswahl.art==='titel') return titelSpeichern();
  return bearbAuswahl.neu ? ausgabeAnlegen() : ausgabeAendern();
}

function kongAlsText(liste){
  return kongUmgestellt() ? (liste||[]).map(kongressText)
                          : (liste||[]).map(x=>x.trim()).filter(Boolean);
}

// Die Spaltennamen der Datenbank stehen nur hier. Leere Termine werden zu
// null: ein leerer Text waere fuer eine Datumsspalte kein gueltiger Wert.
function ausgabeAusEntwurf(){
  const leerZuNull = w => (w && w.trim()) ? w : null;
  return {
    heft: entwurf.heft,
    erscheinung:     leerZuNull(entwurf.et),
    anzeigenschluss: leerZuNull(entwurf.as),
    druckunterlagen: leerZuNull(entwurf.du),
    anlieferung:     leerZuNull(entwurf.eh),
    // Die zwei Themenspalten sind Platz eins und zwei derselben Liste;
    // sonderthema fuehrt. Die beiden Kongress-Alttextspalten werden weiter
    // mitgeschrieben; umgestellt steht im Entwurf aber eine Kennung, kein
    // Wortlaut.
    sonderthema: entwurf.t[0] || '',
    thema:       entwurf.t[1] || '',
    auslagen: kongAlsText(entwurf.a),
    berichte: kongAlsText(entwurf.b),
    inhalte: rubrikInhalte(entwurf.r)
  };
}

// Den bestaetigten Entwurf in die angezeigte Ausgabe uebernehmen. Erst hier,
// nie vorher - sonst zeigte das Werkzeug einen Stand, den es in der Datenbank
// nicht gibt.
function entwurfInAusgabe(iss){
  iss.heft = entwurf.heft;
  iss.et = entwurf.et; iss.as = entwurf.as;
  iss.du = entwurf.du; iss.eh = entwurf.eh;
  iss.t = entwurf.t.map(w=>w.trim()).filter(Boolean);
  iss.r = rubrikInhalte(entwurf.r);
  if(kongUmgestellt()){
    // Kein Weg ueber kongressEintragen: aus dem Ausgabenformular heraus soll
    // kein Kongress entstehen koennen. Gewaehlt wurde aus den Saetzen des
    // Jahrgangs, die Kennungen wandern unveraendert weiter.
    iss.a = entwurf.a.slice(); iss.b = entwurf.b.slice();
  }else{
    iss.a = kongressKennungen(entwurf.a);
    iss.b = kongressKennungen(entwurf.b);
    kongresseAufraeumen();
    entwurf.a = iss.a.map(kongressText); entwurf.b = iss.b.map(kongressText);
  }
  entwurfRein = JSON.stringify(entwurf);
}

function bearbArbeitet(text){
  const knopf = document.getElementById('bearbSpeichern');
  if(knopf) knopf.disabled = true;
  bearbStand(text, '');
}

async function ausgabeAendern(){
  bearbArbeitet('Wird gespeichert …');
  try{
    entwurf.heft = String(entwurf.heft).trim();
    await dbAnfrage('/rest/v1/ausgabe?id=eq.' + encodeURIComponent(entwurf.id), {
      method: 'PATCH', headers: { Prefer: 'return=minimal' },
      body: JSON.stringify(ausgabeAusEntwurf())
    });
    const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
    const iss = t.issues[bearbAuswahl.index];
    entwurfInAusgabe(iss);
    await zuordnungSchreiben(iss);
    render();
    bearbStand('Gespeichert', 'gut');
  }catch(fehler){
    bearbStand(fehlertext(fehler), 'schlecht');
  }
}

async function ausgabeAnlegen(){
  bearbArbeitet('Wird angelegt …');
  try{
    const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
    if(!t) throw new Error('Der Titel ist nicht mehr vorhanden.');
    entwurf.heft = String(entwurf.heft).trim();
    // Die Zeilenkennung vergibt die Datenbank. Ohne sie liesse sich die neue
    // Ausgabe anschliessend nicht mehr aendern, deshalb wird die angelegte
    // Zeile zurueckverlangt.
    const antwort = await dbAnfrage('/rest/v1/ausgabe', {
      method:'POST', headers:{ Prefer:'return=representation' },
      body: JSON.stringify(Object.assign(
        { jahr: jahrgang(), titel_id: t.id, reihenfolge: naechsteReihenfolge(t) },
        ausgabeAusEntwurf()))
    });
    const zeile = Array.isArray(antwort) ? antwort[0] : antwort;
    // Bleibt die Kennung aus, ist die Zeile trotzdem angelegt - sie liesse
    // sich hier nur nicht weiter ansprechen. Dann wird der Bestand neu geholt
    // statt eine Ausgabe ohne Kennung im Werkzeug zu fuehren.
    if(!zeile || !zeile.id){
      const y = jahrgang();
      DATEN = await datenHolen();
      entwurf=null; entwurfRein=null; bearbAuswahl=null;
      waehleJahrgang(y);
      bearbStand('Angelegt', 'gut');
      return;
    }

    const iss = { id: zeile.id, reihenfolge: zeile.reihenfolge };
    t.issues.push(iss);
    entwurfInAusgabe(iss);
    await zuordnungSchreiben(iss);
    GESAMT = JOURNALS.reduce((n,j)=>n+j.issues.length,0);
    await reihenfolgeOrdnen(t);
    const platz = t.issues.indexOf(iss);
    bearbAuswahl = { art:'ausgabe', titelId:t.id, index:platz };
    render();
    bearbStand(platz < t.issues.length-1
      ? 'Angelegt und nach dem Erscheinungstermin eingeordnet'
      : 'Angelegt', 'gut');
  }catch(fehler){
    bearbStand(fehlertext(fehler), 'schlecht');
  }
}

function naechsteReihenfolge(t){
  return t.issues.reduce((m,iss)=>Math.max(m, iss.reihenfolge||0), 0) + 1;
}

// Die Ausgaben eines Titels stehen in der Datenbank in der Reihenfolge ihres
// Erscheinens. Wird eine dazwischen angelegt, ruecken die spaeteren nach.
// Geschrieben wird nur, wo die Nummer nicht schon stimmt - der Regelfall, die
// naechste Ausgabe hinten anfuegen, kostet keine einzige weitere Anfrage.
// Nebenbei zieht das Luecken zusammen, die ein Entfernen hinterlassen hat.
async function reihenfolgeOrdnen(t){
  t.issues.sort((x,y)=>
    (x.et||'9999-99-99').localeCompare(y.et||'9999-99-99'));
  let geschrieben = 0;
  for(let i=0;i<t.issues.length;i++){
    const iss = t.issues[i];
    if(iss.reihenfolge === i+1) continue;
    await dbAnfrage('/rest/v1/ausgabe?id=eq.'+encodeURIComponent(iss.id),
      { method:'PATCH', headers:{ Prefer:'return=minimal' },
        body: JSON.stringify({ reihenfolge: i+1 }) });
    iss.reihenfolge = i+1;
    geschrieben++;
  }
  return geschrieben;
}

async function ausgabeEntfernen(){
  if(!bearbAuswahl || bearbAuswahl.art!=='ausgabe' || bearbAuswahl.neu) return;
  const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
  const iss = t && t.issues[bearbAuswahl.index];
  if(!iss) return;
  if(!await frage('Ausgabe entfernen?',
    '<p>' + esc(heftText(iss.heft) || 'Diese Ausgabe') + ' von ' + esc(t.short) + ' wird entfernt.</p>' +
    '<p>Termine, Themen und Kongresseinträge dieser Ausgabe gehen dabei verloren.</p>',
    'Entfernen')) return;
  bearbArbeitet('Wird entfernt …');
  try{
    await dbAnfrage('/rest/v1/ausgabe?id=eq.'+encodeURIComponent(iss.id),
      { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    t.issues.splice(bearbAuswahl.index,1);
    kongresseAufraeumen();
    GESAMT = JOURNALS.reduce((n,j)=>n+j.issues.length,0);
    entwurf=null; entwurfRein=null; bearbAuswahl=null;
    mxSel.clear();
    render();
    bearbStand('Die Ausgabe wurde entfernt', 'gut');
  }catch(fehler){ bearbStand(fehlertext(fehler), 'schlecht'); }
}

// ── Titel ───────────────────────────────────────────────────────────────────
// Stammdaten gehoeren zum Jahrgang: die Auflage unterscheidet sich von Jahr zu
// Jahr, und ein Titel kann in einem Jahrgang gefuehrt werden und im naechsten
// nicht mehr. Geaendert wird deshalb immer nur der gezeigte Jahrgang.

async function titelSpeichern(){
  const warNeu = !!bearbAuswahl.neu;
  const rubriken = entwurf.rubriken.map(r=>({id:r.id, name:r.name.trim()})).filter(r=>r.name);
  const vorher = warNeu ? null : JOURNALS.find(x=>x.id===entwurf.id);
  const bleibt = new Set(rubriken.map(r=>r.id));
  const weg = vorher ? (vorher.rubriken||[]).filter(r=>!bleibt.has(r.id)) : [];
  const betroffen = vorher ? vorher.issues.filter(iss=>
    weg.some(r=>String((iss.r||{})[r.id]||'').trim())) : [];
  if(betroffen.length && !await frage('Rubrik entfernen?',
    '<p>' + weg.map(r=>'»'+esc(r.name)+'«').join(', ') + ' hat Einträge in <b>' +
    betroffen.length + '</b> Ausgabe' + (betroffen.length===1?'':'n') +
    '. Sie werden mit entfernt.</p>', 'Entfernen')) return;
  bearbArbeitet(warNeu ? 'Wird angelegt …' : 'Wird gespeichert …');
  try{
    const j = jahrgang();
    const feld = { kurz: entwurf.short.trim(), voll: entwurf.short.trim(),
                   auflage: Number(entwurf.auflage)||0, hex: entwurf.hex, cover: entwurf.cover||'', rubriken };
    if(warNeu){
      if(JOURNALS.some(x=>x.id===entwurf.id))
        throw new Error('Die Nummer ' + entwurf.id + ' ist in diesem Jahrgang schon vergeben.');
      await dbAnfrage('/rest/v1/titel', { method:'POST',
        headers:{ Prefer:'return=minimal' },
        body: JSON.stringify(Object.assign({ jahr:j, id:entwurf.id }, feld)) });
      JOURNALS.push({ id:entwurf.id, short:feld.kurz, full:feld.voll,
        auflage:feld.auflage, color:'var(--j'+entwurf.id+')', hex:feld.hex,
        rubriken:feld.rubriken, cover:feld.cover, issues:[] });
      JOURNALS.sort((a,b)=>a.id-b.id);
      bearbAuswahl = { art:'titel', titelId:entwurf.id };
    } else {
      await dbAnfrage('/rest/v1/titel?jahr=eq.'+encodeURIComponent(j)
        +'&id=eq.'+encodeURIComponent(entwurf.id),
        { method:'PATCH', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify(feld) });
      const t = JOURNALS.find(x=>x.id===entwurf.id);
      t.short=feld.kurz; t.full=feld.voll; t.auflage=feld.auflage; t.hex=feld.hex;
      t.rubriken=feld.rubriken; t.cover=feld.cover;
      for(const iss of betroffen){
        const r = Object.assign({}, iss.r||{});
        weg.forEach(x=>delete r[x.id]);
        await dbAnfrage('/rest/v1/ausgabe?id=eq.' + encodeURIComponent(iss.id),
          { method:'PATCH', headers:{ Prefer:'return=minimal' },
            body: JSON.stringify({ inhalte: r }) });
        iss.r = r;
      }
    }
    entwurf.short=feld.kurz; entwurf.full=feld.voll;
    entwurf.rubriken=feld.rubriken.map(r=>({id:r.id, name:r.name}));
    entwurf.auflage=String(feld.auflage);
    entwurfRein = JSON.stringify(entwurf);
    baueChips();
    render();
    bearbStand(warNeu ? 'Der Titel wurde angelegt' : 'Gespeichert', 'gut');
  }catch(fehler){ bearbStand(fehlertext(fehler), 'schlecht'); }
}

async function titelEntfernen(){
  if(!bearbAuswahl || bearbAuswahl.art!=='titel' || bearbAuswahl.neu) return;
  const t = JOURNALS.find(x=>x.id===bearbAuswahl.titelId);
  if(!t) return;
  if(JOURNALS.length<2){
    bearbStand('Der letzte Titel eines Jahrgangs lässt sich nicht entfernen.', 'schlecht');
    return;
  }
  const n = t.issues.length;
  if(!await frage('Titel entfernen?',
    '<p>' + esc(t.short) + ' wird aus dem Jahrgang ' + esc(jahrgang()) + ' entfernt, mit <b>' +
    n + '</b> Ausgabe' + (n===1?'':'n') + '.</p>' +
    '<p>Andere Jahrgänge bleiben unberührt.</p>',
    'Entfernen')) return;
  bearbArbeitet('Wird entfernt …');
  try{
    // Den Titel zu loeschen nimmt ueber den Fremdschluessel seine Ausgaben mit.
    await dbAnfrage('/rest/v1/titel?jahr=eq.'+encodeURIComponent(jahrgang())
      +'&id=eq.'+encodeURIComponent(t.id),
      { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    JOURNALS.splice(JOURNALS.indexOf(t),1);
    kongresseAufraeumen();
    GESAMT = JOURNALS.reduce((x,j)=>x+j.issues.length,0);
    activeJ.delete(t.id);
    mxSel.clear();
    entwurf=null; entwurfRein=null; bearbAuswahl=null;
    baueChips();
    render();
    bearbStand('Der Titel wurde entfernt', 'gut');
  }catch(fehler){ bearbStand(fehlertext(fehler), 'schlecht'); }
}

// ── Sicherungspunkte ────────────────────────────────────────────────────────
// Ein Schnappschuss haelt den ganzen Jahrgang fest, in der Form, die das
// Werkzeug innen ohnehin verwendet.

// Ohne Angabe der gezeigte Jahrgang. Vor dem Excel-Eingang wird auch ein
// Jahrgang gesichert, der gerade nicht auf dem Schirm steht.
// Sicherungspunkte, die vor September 2026 entstanden sind, fuehren die Themen
// noch als zwei benannte Felder. Beim Zuruecksetzen muss ein solcher Punkt
// weiter lesbar sein - sonst stuende der Jahrgang danach ohne Themen da.
function themenAusSatz(iss){
  if(Array.isArray(iss.t)) return iss.t.slice();
  return [iss.sw, iss.top].map(w=>(w||'').trim()).filter(Boolean);
}

function jahrgangAlsBlock(y, daten){
  const jetzt = !daten && (!y || y===jahrgang());
  const d = daten || DATEN[y];
  const stand = jetzt ? standText() : ((d && d.stand) || '');
  const titel = jetzt ? JOURNALS   : ((d && d.titel) || []);
  return { stand: stand, titel: titel.map(j=>({
    id:j.id, kurz:j.short, voll:j.full, auflage:j.auflage, hex:j.hex, rubriken:j.rubriken||[],
    issues: j.issues.map(iss=>({
      heft:iss.heft, et:iss.et, as:iss.as, du:iss.du, eh:iss.eh,
      t:themenAusSatz(iss),
      a:iss.a.map(kongressText), b:iss.b.map(kongressText), r:iss.r||{} }))
  })) };
}

// Geholt wird beim Oeffnen der Arbeitsansicht, beim Jahrgangswechsel und nach
// jedem Schreibvorgang. Frueher geschah es ein einziges Mal beim Anmelden: ging
// der Abruf dabei schief, blieb die Liste den ganzen Besuch ueber leer, und der
// Fehlschlag war von "noch nichts angelegt" nicht zu unterscheiden.
async function sicherungenHolen(){
  sicherungenLaeuft = true;
  sicherungenFehler = '';
  const kasten = document.getElementById('bearbSicherungen');
  if(kasten) kasten.innerHTML = sicherungListeHtml();
  try{
    // Wie jeder andere Zugriff: erst die Sitzung auffrischen. Steht das
    // Werkzeug lange offen, ist sie sonst alt, wenn die Arbeitsansicht
    // geoeffnet wird - und der Abruf scheitert an ihr statt an den Daten.
    sicherungen = await dbAnfrage('/rest/v1/sicherung?jahr=eq.' +
      encodeURIComponent(jahrgang()) +
      '&select=id,bezeichnung,erstellt_am&order=erstellt_am.desc&limit=25') || [];
    sicherungenFehler = '';
  }catch(fehler){ sicherungen = []; sicherungenFehler = fehlertext(fehler); }
  sicherungenLaeuft = false;
  const b = document.getElementById('bearbSicherungen');
  if(b) b.innerHTML = sicherungListeHtml();
  const z = document.getElementById('bearbSichZahl');
  if(z) z.textContent = sicherungZahl();
}

// Die Zahl im Knopf steht nur, solange sie stimmt: waehrend des Abrufs und nach
// einem Fehlschlag bleibt sie weg, statt eine alte oder eine falsche Null zu
// zeigen.
function sicherungZahl(){
  return (sicherungenLaeuft || sicherungenFehler) ? '' : String(sicherungen.length);
}

// Meldungen der Sicherungspunkte gehen in den Dialog, solange er offen ist -
// die Zeile unter dem Formular laege dahinter.
function sichMeldung(text, art){
  const e = document.getElementById('sichStand');
  if(e){ e.textContent = text; e.className = 'dlg-stand' + (art ? ' ' + art : ''); }
  else bearbStand(text, art);
}

// Der Dialog mit der Liste. Gebaut wie frage(): ein eigenes Blatt, das wieder
// verschwindet. Sein z-Wert liegt unter dem der Rueckfragen, die aus ihm heraus
// kommen (Anlegen, Zuruecksetzen, Entfernen), und ueber dem der Seite.
// Die Liste darin traegt dieselbe Kennung wie frueher der Kasten unter dem
// Formular; sicherungenHolen() frischt sie deshalb unveraendert auf.
// Escape schliesst ihn - aber nicht, solange eine Rueckfrage darueber steht:
// die faengt Escape vorher ab.
function sicherungenZeigen(){
  if(document.getElementById('sichDialog')) return;
  const back = document.createElement('div');
  back.className = 'daten-dialog offen';
  back.id = 'sichDialog';
  back.style.zIndex = '450';
  back.setAttribute('role','dialog');
  back.setAttribute('aria-modal','true');
  back.setAttribute('aria-labelledby','sichKopf');
  back.innerHTML =
    '<div class="dlg-blatt">' +
      '<h3 class="dlg-kopf" id="sichKopf">Sicherungspunkte · Jahrgang ' + esc(jahrgang()) + '</h3>' +
      '<div class="dlg-inhalt">' +
        '<p class="sich-erkl">Ein Sicherungspunkt hält den ganzen Jahrgang fest. ' +
        'Zurücksetzen ersetzt den Jahrgang durch den gesicherten Stand.</p>' +
        '<div id="bearbSicherungen">' + sicherungListeHtml() + '</div>' +
      '</div>' +
      '<div class="dlg-fuss">' +
        '<span class="dlg-stand" id="sichStand"></span>' +
        '<button class="dlg-btn" data-w="zu">Schließen</button>' +
        '<button class="dlg-btn dlg-ok" data-w="neu">Sicherungspunkt anlegen</button>' +
      '</div>' +
    '</div>';
  const zu = () => {
    document.removeEventListener('keydown', escSich);
    back.remove();
  };
  function escSich(e){ if(e.key === 'Escape') zu(); }
  back.querySelector('[data-w="zu"]').onclick = zu;
  back.querySelector('[data-w="neu"]').onclick = sicherungAnlegen;
  document.addEventListener('keydown', escSich);
  document.body.appendChild(back);
  back.querySelector('[data-w="zu"]').focus();
}

async function sicherungSchreiben(y, wie){
  await dbAnfrage('/rest/v1/sicherung', {
    method:'POST', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({ jahr: y, bezeichnung: wie,
                           inhalt: jahrgangAlsBlock(y) })
  });
}

async function sicherungAnlegen(){
  const wie = await eingabe('Sicherungspunkt anlegen',
    'Der Sicherungspunkt hält den heutigen Stand des Jahrgangs ' + jahrgang() + ' fest.',
    'Bezeichnung', 'Stand ' + heute(new Date().toISOString().slice(0,10)), 'Anlegen');
  if(wie === null) return;
  try{
    await sicherungSchreiben(jahrgang(), wie.trim());
    await sicherungenHolen();
    sichMeldung('Sicherungspunkt angelegt', 'gut');
  }catch(fehler){ sichMeldung(fehlertext(fehler), 'schlecht'); }
}

async function sicherungZurueck(id, wie){
  if(!await frage('Jahrgang zurücksetzen?',
    '<p>Der Jahrgang ' + esc(jahrgang()) + ' wird auf den Stand »' + esc(wie) + '« zurückgesetzt.</p>' +
    '<p>Alle seither vorgenommenen Änderungen gehen dabei verloren.</p>',
    'Zurücksetzen')) return;
  try{
    sichMeldung('Wird zurückgesetzt …', '');
    const treffer = await dbAnfrage('/rest/v1/sicherung?id=eq.' +
      encodeURIComponent(id) + '&select=inhalt');
    const block = treffer && treffer[0] && treffer[0].inhalt;
    if(!block) throw new Error('Der Sicherungspunkt ist nicht lesbar.');

    const j = jahrgang();
    // Denselben Weg nimmt der Excel-Eingang: der Jahrgang wird im Ganzen
    // ersetzt. Ein Sicherungspunkt fuehrt die Namen anders als das Werkzeug
    // innen, deshalb die Umbenennung.
    await jahrgangSchreiben(j, block.stand || '', block.titel.map(t=>({
      id:t.id, short:t.kurz, full:t.voll, auflage:t.auflage, hex:t.hex, rubriken:t.rubriken||[],
      issues:t.issues.map(iss=>({...iss, t:themenAusSatz(iss)})) })));

    entwurf = null; entwurfRein = null; bearbAuswahl = null;
    DATEN = await datenHolen();
    if(KONG_TABELLEN) await kongresseUebernehmen(j);
    waehleJahrgang(j);
    await sicherungenHolen();
    sichMeldung('Auf den gesicherten Stand zurückgesetzt', 'gut');
  }catch(fehler){ sichMeldung(fehlertext(fehler), 'schlecht'); }
}

// Ein Sicherungspunkt verfaellt nicht von selbst und wird auch nicht still
// ausgeduennt - ein bewusst gesetzter Punkt soll nicht hinter der Liste
// verschwinden. Aufgeraeumt wird deshalb von Hand.
async function sicherungEntfernen(id, wie){
  if(!await frage('Sicherungspunkt entfernen?',
    '<p>Der Sicherungspunkt »' + esc(wie) + '« wird entfernt.</p>' +
    '<p>Der darin gesicherte Stand ist danach nicht mehr zu erreichen.</p>',
    'Entfernen')) return;
  try{
    await dbAnfrage('/rest/v1/sicherung?id=eq.' + encodeURIComponent(id),
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    await sicherungenHolen();
    sichMeldung('Der Sicherungspunkt wurde entfernt', 'gut');
  }catch(fehler){ sichMeldung(fehlertext(fehler), 'schlecht'); }
}

// ── Darstellung ─────────────────────────────────────────────────────────────

function bearbFormNeu(){
  const f = document.getElementById('bearbForm');
  if(f) f.innerHTML = formInhaltHtml();
  bearbStand(bearbStandText, bearbStandArt);
}

function kongVorschlaege(){
  const namen = new Set();
  Object.values(DATEN).forEach(j=>(j.kongresse||[]).forEach(k=>{
    const t = kongressAus(k); if(t) namen.add(t);
  }));
  return [...namen].sort((a,b)=>a.localeCompare(b,'de'));
}

// Zwei Aufbauten, ein Rahmen. Umgestellt wird nur noch aus den Kongressen des
// Jahrgangs gewaehlt; der Freitext bleibt allein fuer einen Jahrgang stehen,
// der seine Kongresse noch als Text an der Ausgabe fuehrt.
// Die Themen einer Ausgabe stehen in einer Gruppe untereinander, nicht in
// zwei benannten Feldern: sie sind gleichrangig. Zwei ist die Obergrenze -
// mehr kann die Datenbank nicht halten, und mehr kommt auch nicht vor.
function themenGruppe(){
  const zeilen = entwurf.t.map((wert,i)=>
    `<div class="bearb-zeile">
       <input type="text" data-art="t" value="${escA(wert)}"
              placeholder="Thema dieser Ausgabe"
              oninput="bearbListe('t',${i},this.value)">
       <button type="button" class="bearb-weg" title="Zeile entfernen"
               onclick="bearbZeileWeg('t',${i})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
     </div>`).join('');
  return `<div class="bearb-gruppe">
    <span class="bearb-feld">Themenschwerpunkte
      <span class="hinweis">H&ouml;chstens zwei Eintr&auml;ge</span></span>
    ${zeilen || '<p class="bearb-leerhinweis">Keine Einträge.</p>'}
    ${entwurf.t.length < 2 ? `<button type="button" class="bearb-zu"
        onclick="bearbZeileZu('t')">Zeile hinzufügen</button>` : ''}
  </div>`;
}

// Je Rubrik des Titels ein Feld. Ein Titel ohne Rubriken zeigt hier nichts.
function rubrikGruppe(){
  const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
  const liste = (t && t.rubriken) || [];
  if(!liste.length) return '';
  return `<div class="bearb-gruppe">
    <span class="bearb-feld">Weitere Rubriken
      <span class="hinweis">Festgelegt am Titel; ein leeres Feld erscheint nirgends</span></span>
    ${liste.map(r=>`<label class="bearb-feld">${esc(r.name)}
       <input type="text" value="${escA((entwurf.r||{})[r.id]||'')}"
              oninput="bearbRubrikText('${r.id}',this.value)"></label>`).join('')}
  </div>`;
}
function bearbRubrikText(id, wert){
  if(!entwurf) return;
  if(!entwurf.r) entwurf.r = {};
  if(wert) entwurf.r[id] = wert; else delete entwurf.r[id];
  bearbStand('Nicht gespeichert', '');
}

function titelRubrikenGruppe(){
  const zeilen = entwurf.rubriken.map((r,i)=>
    `<div class="bearb-zeile">
       <input type="text" data-art="rubriken" value="${escA(r.name)}"
              placeholder="Name der Rubrik, etwa CME-Beitrag"
              oninput="bearbRubrikName(${i},this.value)">
       <button type="button" class="bearb-weg" title="Rubrik entfernen"
               onclick="bearbRubrikWeg(${i})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
     </div>`).join('');
  return `<div class="bearb-gruppe">
    <span class="bearb-feld">Weitere Rubriken
      <span class="hinweis">Inhalte je Ausgabe neben den Themenschwerpunkten,
        etwa CME-Beiträge. Jede Rubrik erhält im Formular der Ausgaben ein
        eigenes Feld und erscheint unter ihrem Namen in den Ansichten, im Druck
        und in Excel</span></span>
    ${zeilen || '<p class="bearb-leerhinweis">Keine Rubriken.</p>'}
    <button type="button" class="bearb-zu" onclick="bearbRubrikZu()">Rubrik hinzufügen</button>
  </div>`;
}
function bearbRubrikName(i, wert){
  if(!entwurf || !entwurf.rubriken[i]) return;
  entwurf.rubriken[i].name = wert;
  bearbStand('Nicht gespeichert', '');
}
function bearbRubrikZu(){
  if(!entwurf) return;
  entwurf.rubriken.push({id:neueRubrikId(), name:''});
  bearbFormNeu();
  const felder = document.querySelectorAll('.bearb-zeile input[data-art="rubriken"]');
  const letztes = felder[felder.length-1];
  if(letztes) letztes.focus();
}
function bearbRubrikWeg(i){
  if(!entwurf) return;
  entwurf.rubriken.splice(i,1);
  bearbFormNeu();
}

function zeilenGruppe(art, beschriftung, hinweis){
  return `<div class="bearb-gruppe">
    <span class="bearb-feld">${beschriftung}
      <span class="hinweis">${hinweis}${kongUmgestellt()
        ? ' &middot; angelegt werden Kongresse in der Ansicht &raquo;Nach Kongress&laquo;' : ''}</span></span>
    ${kongUmgestellt() ? kongWahlHtml(art) : freitextHtml(art)}
  </div>`;
}

function freitextHtml(art){
  const zeilen = entwurf[art].map((wert,i)=>
    `<div class="bearb-zeile">
       <input type="text" list="kongVorschlag" data-art="${art}"
              value="${escA(wert)}" placeholder="Kongress"
              oninput="bearbListe('${art}',${i},this.value)">
       <button type="button" class="bearb-weg" title="Zeile entfernen"
               onclick="bearbZeileWeg('${art}',${i})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
     </div>`).join('');
  return `${zeilen || '<p class="bearb-leerhinweis">Keine Einträge.</p>'}
    <button type="button" class="bearb-zu" onclick="bearbZeileZu('${art}')">
      Zeile hinzufügen</button>`;
}

// Das Zugeordnete steht als Text da, nicht als Eingabefeld: geaendert wird ein
// Kongress in der Kongressansicht, hier wird er nur zugeordnet und wieder
// weggenommen. Darunter ein einziges Auswahlfeld statt einer Zeile je Eintrag -
// so kann weder eine leere Zeile stehenbleiben noch derselbe Kongress zweimal
// gewaehlt werden.
function kongWahlHtml(art){
  const zeilen = entwurf[art].map((id,i)=>
    `<div class="bearb-zeile">
       <span class="bearb-fest">${esc(kongressText(id))}</span>
       <button type="button" class="bearb-weg" title="Zuordnung entfernen"
               onclick="bearbKongWeg('${art}',${i})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
     </div>`).join('');

  const {ohne, mit} = mxZeilen();
  const drin = new Set(entwurf[art]);
  const frei = k => !drin.has(k.id);
  const gruppe = (name, liste) => liste.filter(frei).length
    ? `<optgroup label="${name}">${liste.filter(frei).map(k=>
        `<option value="${escA(k.id)}">${esc(kongressAus(k))}</option>`).join('')}</optgroup>`
    : '';

  let wahl;
  if(!ohne.length && !mit.length)
    wahl = `<p class="bearb-leerhinweis">Der Jahrgang führt noch keinen Kongress.</p>
      <button type="button" class="bearb-zu" onclick="bearbAnsichtSetzen('kongress')">
        Zur Kongressansicht</button>`;
  else if(!ohne.concat(mit).some(frei))
    wahl = `<p class="bearb-leerhinweis">Alle Kongresse des Jahrgangs sind dieser
      Ausgabe bereits zugeordnet.</p>`;
  else
    wahl = `<select class="bearb-wahl" onchange="bearbKongZu('${art}',this.value)">
      <option value="">Kongress hinzufügen &hellip;</option>
      ${gruppe('Termin fehlt', ohne)}${gruppe('Nach Zeitraum', mit)}
    </select>`;

  // Fuehrt der Jahrgang gar keinen Kongress, sagt der Hinweis darunter schon
  // alles; ein vorangestelltes "Keine Zuordnung." verdoppelte es nur.
  const leer = (ohne.length || mit.length)
    ? '<p class="bearb-leerhinweis">Keine Zuordnung.</p>' : '';
  return `${zeilen || leer}${wahl}`;
}

// Der Fuss ist bei Ausgaben und Titeln derselbe; nur die Beschriftung des
// ersten Knopfes und der Loeschweg unterscheiden sich.
function bearbFussHtml(speichern, loeschen){
  return `<div class="bearb-fuss">
      <button type="button" class="bearb-speichern" id="bearbSpeichern"
              onclick="bearbSpeichern()" disabled>${speichern}</button>
      <button type="button" class="bearb-verwerfen" id="bearbVerwerfen"
              onclick="bearbVerwerfen()" disabled>Verwerfen</button>
      <span class="bearb-stand" id="bearbStandFuss"></span>
      ${loeschen || ''}
    </div>`;
}

function formInhaltHtml(){
  if(!entwurf || !bearbAuswahl)
    return `<p class="bearb-unterkopf">Links eine Ausgabe oder einen Titel wählen.</p>`;
  return bearbAuswahl.art==='titel' ? formTitelHtml() : formAusgabeHtml();
}

function formAusgabeHtml(){
  const neu = !!bearbAuswahl.neu;
  const t = JOURNALS.find(j=>j.id===bearbAuswahl.titelId);
  const termine = TERMINE.map(([k,beschriftung])=>
    `<label class="bearb-feld">${beschriftung}

  if(sicherungenLaeuft)

// ─── Bearbeiten: Umschalter nach Ausgabe / nach Kongress ───────────────────
async function bearbAnsichtSetzen(v){
  if(bearbAnsicht===v) return;

  bearbAnsicht = v;
  bearbAuswahl = null; entwurf = null; entwurfRein = null;
  mxAuswahl = null;
  bearbStandText=''; bearbStandArt='';
  render();
}

// Der aeussere Umschalter oben unterscheidet den Blickwinkel, dieser hier die
// Art der Zuordnung - zwei Achsen, darum zwei Umschalter statt einer Reihe aus
// drei Knoepfen. Keine Rueckfrage noetig: anders als auf der Ausgabenseite
// gibt es in der Matrix keinen Entwurf, mxToggle schreibt sofort.
function mxArtSetzen(v){
  if(mxArt===v) return;
  mxArt = v;
  mxAuswahl = null;
  bearbStandText=''; bearbStandArt='';
  mxRollZurueck = true;
  render();
}
