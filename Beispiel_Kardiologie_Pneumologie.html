function toggleJ(id){
  if(id===0){
    activeJ.clear();
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    document.querySelector('.chip[data-j="0"]').classList.add('active');
  } else {
    document.querySelector('.chip[data-j="0"]').classList.remove('active');
    activeJ.has(id)?activeJ.delete(id):activeJ.add(id);
    document.querySelector(`.chip[data-j="${id}"]`).classList.toggle('active', activeJ.has(id));
    if(activeJ.size===0) document.querySelector('.chip[data-j="0"]').classList.add('active');
  }
  render();
}

// ─── Helpers ───────────────────────────────────────────────────────────────
// Ein Termin, der in der Heftplanung noch fehlt, wird als Gedankenstrich
// gezeigt – sonst stuende in Kachel, Liste, Tabelle und Druck "undefined".
function fmt(s){if(!s)return'–';const[y,m,d]=s.split('-');return`${d}.${m}.${y}`}

// Vor eine Heftnummer gehoert das Wort "Heft", vor eine Bezeichnung nicht: ein
// Sonderheft heisst "Sonderheft" oder "Supplement", nicht "Heft Sonderheft".
// Als Nummer gilt eine Zahl, auch mit Buchstaben dahinter ("4a"), und eine
// Spanne aus zweien, gleich mit welchem Strich ("1-2", "1–2", "1/2"). Alles
// andere ist frei eingetragen und benennt sich selbst.
function istHeftnummer(heft){
  return /^\d+[a-zA-Z]?(\s*[–—/-]\s*\d+[a-zA-Z]?)?$/.test(String(heft==null?'':heft).trim());
}
// Das Wort und die Nummer bleiben zusammen: schmales geschuetztes Leerzeichen,
// wie es im ganzen Werkzeug davor steht. In der Jahresmatrix ist jede Kachel
// schmal, dort steht die Nummer als "H 4"; eine Bezeichnung ist in beiden
// Formen dieselbe.
function heftText(heft,kurz){
  const h=String(heft==null?'':heft).trim();
  if(!h) return '';
  return istHeftnummer(h) ? (kurz?'H':'Heft')+'\u202f'+h : h;
}

// Taggenauer Vergleich auf der ISO-Zeichenkette: kein Zeitanteil, keine
// Zeitzonenfalle. Ein Anzeigenschluss am heutigen Tag gilt noch nicht als
// verstrichen. heute() ist hochgezogen und daher hier schon verfuegbar.
const HEUTE_ISO = heute(true);
// Ohne eingetragenen Anzeigenschluss gilt eine Ausgabe nie als verstrichen –
// ein leeres Feld waere sonst kleiner als jedes Datum und die Ausgabe
// verschwaende, sobald der Schalter gesetzt ist.
function verstrichen(iss){ return !!iss.as && iss.as < HEUTE_ISO; }

// Der Text stammt aus der Heftplanung und kommt seit dem Excel-Import von
// aussen. Erst maskieren, dann die Fundstelle auszeichnen – sonst verschluckt
// der Browser alles, was wie ein HTML-Tag aussieht ("<Onkologie>"). Der
// Suchbegriff wird gleich behandelt, damit auch "&" und "<" gefunden werden.
function hl(txt,q){
  const t=esc(txt==null?'':txt);
  if(!q)return t;
  const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp(`(${qe})`, 'gi'),'<mark>$1</mark>');
}

// Zeigt die aktuelle Auswahl Auslagen, Berichte und Themenschwerpunkte?
// Die drei Fragen gelten für Anzeige, Suche und Export gleichermassen. Der
// Inhaltsfilter fasst die Themenschwerpunkte als eigene Inhaltsart auf.
function zeigtA(){ return modus.size===0 || modus.has('auslage'); }
function zeigtB(){ return false; }   // Print: Berichte stehen mit im Feld "Kongresse"
function zeigeThema(){ return modus.size===0 || modus.has('thema'); }
function zeigeRubrik(){ return modus.size===0 || modus.has('rubrik'); }

// ── Weitere Rubriken (Print-Fassung) ──
// Ein Titel fuehrt eine eigene Liste von Rubriken {id, name}, etwa
// "CME-Beitrag"; die Ausgabe haelt je Kennung ihren Text (iss.r). Angezeigt
// wird, was einen Text hat, unter dem Namen der Rubrik.
function titelVon(iss){ return JOURNALS.find(j=>j.issues.includes(iss)); }
function rubrikEintraege(iss){
  const j = titelVon(iss);
  if(!j) return [];
  const r = iss.r || {};
  return (j.rubriken||[]).map(x=>({name:x.name, text:String(r[x.id]||'').trim()}))
                         .filter(e=>e.text);
}
function neueRubrikId(){
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function rubrikInhalte(r){
  const aus = {};
  Object.entries(r||{}).forEach(([k,w])=>{ const t=String(w||'').trim(); if(t) aus[k]=t; });
  return aus;
}
function rubrikBloecke(iss,q){
  return rubrikEintraege(iss).map(e=>`<div class="thema"><div class="tlbl">${esc(e.name)}</div>`
    + `<div class="ttxt">${hl(e.text,q)}</div></div>`).join('');
}

// Weitere Rubriken stehen im Inhaltsfilter nur, wenn der Jahrgang welche
// fuehrt: ein Schalter, der immer ins Leere fuehrt, saehe aus wie ein Fehler.
// Eine Art, die wegfaellt, faellt auch aus der Auswahl.
function hatRubriken(){ return JOURNALS.some(j=>j.issues.some(iss=>rubrikEintraege(iss).length)); }
function sichtbareArten(){
  return [...document.querySelectorAll('.mode-btn')]
    .filter(b=>b.dataset.mode!=='all' && !b.hidden).map(b=>b.dataset.mode);
}
function inhaltsArtenPruefen(){
  const da = {rubrik:hatRubriken()};
  document.querySelectorAll('.mode-btn').forEach(b=>{
    const k=b.dataset.mode;
    if(!(k in da)) return;
    b.hidden = !da[k];
    if(!da[k]) modus.delete(k);
  });
  if(modus.size && modus.size===sichtbareArten().length) modus.clear();
  document.querySelectorAll('.mode-btn').forEach(b=>{
    const k=b.dataset.mode;
    b.classList.toggle('active', k==='all' ? modus.size===0 : modus.has(k));
  });
}

// Felder, die in der aktuellen Auswahl auf der Kachel tatsächlich sichtbar sind.
// Ausgeblendete Arten dürfen nicht durchsucht werden, sonst entstuenden Treffer
// ohne sichtbaren Grund.
function sichtbareFelder(iss){
  const f=[];
  if(zeigtA())     f.push(...iss.a.map(kongressText));
  if(zeigtB())     f.push(...iss.b.map(kongressText));
  if(zeigeThema()) f.push(...iss.t);
  if(zeigeRubrik()) f.push(...rubrikEintraege(iss).map(e=>e.text));
  return f;
}

function matches(iss,q){
  if(!q)return true;
  const corpus=sichtbareFelder(iss).join(' ').toLowerCase();
  return corpus.includes(q.toLowerCase());
}

// ─── Auswahl: alle Ausgaben, die Filter, Modus und Suche erfüllen ──────────
// Eine einzige Regel, die Bildschirmansicht und HTML-Export gemeinsam nutzen –
// sonst koennte der Export einen anderen Ausschnitt liefern als die Anzeige.
function passt(iss,q){
  if(ohneVerstrichene && verstrichen(iss)) return false;
  // Eine Ausgabe bleibt stehen, sobald sie mindestens eine der gewaehlten Arten
  // fuehrt. Ohne Auswahl ("Alle Inhalte") wird nichts verlangt – ein Jahrgang,
  // in dem erst die Termine stehen, bliebe sonst vollstaendig leer.
  if(modus.size>0){
    const hat = (modus.has('auslage') && iss.a.length>0)
             || (modus.has('bericht') && iss.b.length>0)
             || (modus.has('thema')   && iss.t.length>0)
             || (modus.has('rubrik')  && rubrikEintraege(iss).length>0);
    if(!hat) return false;
  }
  return matches(iss,q);
}

function collect(q){
  const out=[];
  JOURNALS.forEach(j=>{
    if(activeJ.size>0&&!activeJ.has(j.id))return;
    j.issues.forEach(iss=>{ if(passt(iss,q)) out.push({j,iss}); });
  });
  out.sort((a,b)=>a.iss.et.localeCompare(b.iss.et));
  return out;
}

// ─── Bausteine, die mehrere Ansichten gemeinsam nutzen ─────────────────────
const DATUMSFELDER=[['ET','Erscheinungstermin','et'],['AS','Anzeigenschluss','as'],
  ['DU','Druckunterlagen','du'],['EH','Anliefertermin für Ein-/Durchhefter und Beilagen','eh']];

function datesHtml(iss,cls){
  return DATUMSFELDER.map(([k,t,f])=>
    `<div class="${cls}"><div class="dk" title="${t}">${k}</div><div class="dv">${fmt(iss[f])}</div></div>`).join('');
}

function kongBlock(liste,q){
  if(!liste.length) return '';
  const wort = liste.length>1 ? 'Kongresse' : 'Kongress';
  return `<div class="thema"><div class="tlbl">${wort}</div>`
    + liste.map(t=>`<div class="ttxt">${hl(t,q)}</div>`).join('')
    + '</div>';
}

// Eine Beschriftung ueber der ganzen Liste, nicht eine je Eintrag: die
// Eintraege sind gleichrangig. Nur die Zahl geht mit - bei einem Eintrag
// verspraeche der Plural mehr, als dort steht.
function themaBlock(iss,q){
  if(!iss.t.length) return '';
  const wort = iss.t.length>1 ? 'Themenschwerpunkte' : 'Themenschwerpunkt';
  return `<div class="thema"><div class="tlbl">${wort}</div>`
    + iss.t.map(w=>`<div class="ttxt">${hl(w,q)}</div>`).join('')
    + '</div>';
}

// Eine Zelle, ein Eintrag je Zeile - dieselbe Form, die Kongressauslagen und
// -berichte schon nutzen und die ausListenZelle wieder auseinandernimmt.
function themaText(iss){          // Excel: eine Zelle mit Zeilenumbruch
  return iss.t.join('\n');
}

function themaZelle(iss,q){       // Tabellenansicht
  return iss.t.map(w=>`<div>${hl(w,q)}</div>`).join('') || '&ndash;';
}

function inhaltBloecke(iss,q){
  const a = zeigtA() ? kongBlock(iss.a.map(kongressText),q,'auslage') : '';
  const b = zeigtB() ? kongBlock(iss.b.map(kongressText),q,'bericht') : '';
  return a+b+(zeigeThema() ? themaBlock(iss,q) : '')+(zeigeRubrik() ? rubrikBloecke(iss,q) : '');
}

function cardHtml(j,iss,q){
  return`<div class="card" style="--jcol:${j.hex}">
    <div class="card-top">
      <span class="badge" style="background:${j.hex}22;color:${j.hex};border:1px solid ${j.hex}44">${esc(j.short)}</span>
      <span class="heft-info"><span class="heft-num">${esc(heftText(iss.heft))}</span><br>${j.auflage.toLocaleString('de-DE')} Expl.</span>
    </div>
    <div class="dates">${datesHtml(iss,'date-col')}</div>
    ${inhaltBloecke(iss,q)}
  </div>`;
}

function leer(q,zusatz){
  return`<div class="empty"><h3>Keine Treffer${q?` für &raquo;${q}&laquo;`:''}</h3><p>${zusatz||'Suchbegriff anpassen oder Filter zurücksetzen.'}</p></div>`;
}

// ─── Ansicht: Kacheln ──────────────────────────────────────────────────────
function renderCards(items,q){
  return items.map(({j,iss})=>cardHtml(j,iss,q)).join('');
}

// ─── Ansicht: Liste nach Monaten ───────────────────────────────────────────
// Gruppiert wird nach dem Monat des Erscheinungstermins. Fehlt er - der
// Excel-Eingang laesst das nicht zu, der Bearbeiten-Dialog schon -, gaebe der
// Schluessel nichts her und die Ueberschrift hiesse "undefined". Solche
// Ausgaben sammeln sich deshalb unter einem eigenen Kopf und stehen hinten.
const OHNE_ET='ohne-et';
function renderListe(items,q){
  const monate={};
  items.forEach(it=>{const k=it.iss.et?it.iss.et.slice(0,7):OHNE_ET;(monate[k]=monate[k]||[]).push(it);});
  return Object.keys(monate).sort((a,b)=>
      a===OHNE_ET ? 1 : b===OHNE_ET ? -1 : a.localeCompare(b)).map(k=>{
    const [y,m]=k.split('-'), arr=monate[k];
    const kopf = k===OHNE_ET ? 'Erscheinungstermin offen' : `${MONATE[+m-1]} ${y}`;
    const zeilen=arr.map(({j,iss})=>{
      const thema=zeigeThema() ? iss.t.join(' · ') : '';
      return`<details class="lrow" style="--jcol:${j.hex}"${q?' open':''}>
        <summary>
          <span class="ltitle">${esc(j.short)}</span>
          <span class="lheft">${esc(heftText(iss.heft))}<small>${j.auflage.toLocaleString('de-DE')} Expl.</small></span>
          ${datesHtml(iss,'ldate')}
          <span class="lthema">${hl(thema,q)}</span>
          <span class="lchev">&#9654;</span>
        </summary>
        <div class="ldetail">${inhaltBloecke(iss,q)}</div>
      </details>`;
    }).join('');
    return`<section class="mgroup"><div class="mhead">${esc(kopf)}<span class="mcount">${arr.length} Ausgabe${arr.length!==1?'n':''}</span></div>${zeilen}</section>`;
  }).join('');
}

// ─── Ansicht: Jahresmatrix ─────────────────────────────────────────────────
function renderMatrix(items,q){
  const titel = JOURNALS.filter(j=>activeJ.size===0||activeJ.has(j.id));
  const raster={};
  items.forEach(({j,iss})=>{
    const m=+iss.et.slice(5,7)-1;
    (raster[j.id]=raster[j.id]||{});
    (raster[j.id][m]=raster[j.id][m]||[]).push(iss);
  });

  let h='<div class="matrixwrap"><table class="matrix"><thead><tr><th class="mx-corner">Titel</th>';
  MON_KURZ.forEach(m=>h+=`<th class="mx-month">${m}</th>`);
  h+='</tr></thead><tbody>';
  titel.forEach(j=>{
    h+=`<tr><th class="mx-title" style="--jcol:${j.hex};border-left:3px solid ${j.hex}">${esc(j.short)}</th>`;
    for(let m=0;m<12;m++){
      const arr=(raster[j.id]||{})[m]||[];
      h+='<td class="mx-cell">';
      if(!arr.length){h+='<span class="mx-empty">&ndash;</span>';}
      arr.forEach(iss=>{
        const key=j.id+'|'+iss.heft;
        h+=`<button class="mx-chip${q?' hit':''}${mxSel.has(key)?' sel':''}" style="--jcol:${j.hex}" onclick="mxPick('${key}')" title="ET ${fmt(iss.et)} &middot; AS ${fmt(iss.as)}">${esc(heftText(iss.heft,true))}<small>${iss.et.slice(8)}.${iss.et.slice(5,7)}.</small></button>`;
      });
      h+='</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';

  // Aufgeschlagen werden alle gewaehlten Ausgaben, in der Reihenfolge des
  // Jahrgangs. Was durch Suche oder Filter aus der Matrix gefallen ist, wird
  // dabei still aus der Auswahl genommen – sonst blieben unsichtbare Reste.
  const gewaehlt=items.filter(it=>mxSel.has(it.j.id+'|'+it.iss.heft));
  [...mxSel].forEach(k=>{
    if(!gewaehlt.some(it=>(it.j.id+'|'+it.iss.heft)===k)) mxSel.delete(k);
  });

  if(!gewaehlt.length)
    return h+'<div class="mx-hint">Ausgaben anklicken, um Termine, Kongresse und Themen zu sehen. '
      +'Mehrere Ausgaben lassen sich gleichzeitig aufschlagen.</div>';

  const kopf=`<div class="mx-detail-kopf"><span>${gewaehlt.length} Ausgabe${gewaehlt.length!==1?'n':''} aufgeschlagen</span>`
    +`<button class="mx-leeren" onclick="mxLeeren()">Auswahl aufheben</button></div>`;
  const karten=gewaehlt.map(({j,iss})=>cardHtml(j,iss,q)).join('');
  return h+kopf+`<div class="mx-detail">${karten}</div>`;
}

// ─── Ansicht: Tabelle ──────────────────────────────────────────────────────
const TAB_SPALTEN=[
  {k:'titel',  t:'Titel'},      {k:'heft',t:'Heft'},
  {k:'et',     t:'ET'},         {k:'as',  t:'AS'},
  {k:'du',     t:'DU'},         {k:'eh',  t:'EH'},
  {k:'auflage',t:'Auflage'},
  {k:'t',      t:'Themenschwerpunkte'},
  {k:'r',      t:'Weitere Rubriken'},
  {k:'kong',   t:'Kongresse', nosort:true}
];

function sortWert(it,k){
  if(k==='titel')  return it.j.short;
  if(k==='auflage')return it.j.auflage;
  if(k==='heft')   return it.iss.heft;
  // Die Themen sind eine Liste; sortiert wird nach dem ersten Eintrag, so wie
  // die Spalte ihn auch zuerst zeigt.
  if(k==='t')      return it.iss.t.join(' ');
  if(k==='r')      return rubrikEintraege(it.iss).map(e=>e.text).join(' ');
  return it.iss[k]||'';
}

// Die Spalten folgen dem Inhaltsfilter, damit die Tabelle nicht mehr behauptet
// als der Kopf: ohne Thema faellt "Themenschwerpunkte" weg, ohne Auslagen und Berichte
// die Spalte "Kongresse" – sie stuende dort sonst als reine Strichspalte.
function tabSpalten(){
  return TAB_SPALTEN.filter(s=>{
    if(s.k==='t')    return zeigeThema();
    if(s.k==='r')    return zeigeRubrik() && hatRubriken();
    if(s.k==='kong') return zeigtA() || zeigtB();
    return true;
  });
}

function tabZelle(s,j,iss,q){
  switch(s.k){
    case 'titel':   return`<td class="t-titel" style="color:${j.hex}">${esc(j.short)}</td>`;
    case 'heft':    return`<td class="t-num">${esc(iss.heft)}</td>`;
    case 'auflage': return`<td class="t-num">${j.auflage.toLocaleString('de-DE')}</td>`;
    case 't':       return`<td class="t-thema">${themaZelle(iss,q)}</td>`;
    case 'r': {
      // Rubrikname links, Text rechts an einer gemeinsamen Kante je Zelle:
      // die Namen sind verschieden lang, ein fester Einzug passte nur zu einem.
      const re = rubrikEintraege(iss);
      return`<td class="t-kong">${re.length ? `<div class="kr">${re.map(e=>
        `<b>${esc(e.name)}</b><span>${hl(e.text,q)}</span>`).join('')}</div>` : '–'}</td>`;
    }
    case 'kong': {
      // Jeder Kongress steht in einer eigenen Zeile. Im Fliesstext waren die
      // Eintraege nur durch Semikolon getrennt – weil die Namen selbst Kommas,
      // Schraegstriche und Klammern enthalten, war die Grenze nicht erkennbar.
      const zeile=(n,cls,lbl)=>`<div class="ke"><b class="${cls}">${lbl}</b> ${hl(n,q)}</div>`;
      let kong='';
      if(zeigtA()) kong+=iss.a.map(n=>`<div>${hl(kongressText(n),q)}</div>`).join('');
      if(zeigtB()) kong+=iss.b.map(n=>zeile(kongressText(n),'','Bericht')).join('');
      return`<td class="t-kong">${kong||'–'}</td>`;
    }
    default:        return`<td class="t-num dv">${fmt(iss[s.k])}</td>`;   // ET/AS/DU/EH
  }
}

function renderTabelle(items,q){
  const spalten=tabSpalten();
  // Steht die Sortierung auf einer ausgeblendeten Spalte, wird ersatzweise nach
  // Erscheinungstermin sortiert. sortKey bleibt dabei stehen, damit die gewaehlte
  // Sortierung zurueckkehrt, sobald die Spalte wieder da ist.
  const sKey = spalten.some(s=>s.k===sortKey) ? sortKey : 'et';

  const zeilen=[...items].sort((a,b)=>{
    const x=sortWert(a,sKey), y=sortWert(b,sKey);
    const c = (typeof x==='number') ? x-y : String(x).localeCompare(String(y),'de');
    return c!==0 ? c*sortDir : a.iss.et.localeCompare(b.iss.et);
  });

  // Der Spaltenkopf traegt einen echten Knopf statt eines klickbaren <th>:
  // nur so ist die Sortierung mit der Tastatur erreichbar und bekommt den
  // Fokusrahmen des Blattes. aria-sort gehoert dagegen an die Zelle selbst -
  // dort sucht die Vorlesesoftware danach, nicht am Knopf.
  const kopf=spalten.map(s=>{
    if(s.nosort)return`<th>${s.t}</th>`;
    const pfeil = sortKey===s.k ? `<span class="sar">${sortDir>0?'▲':'▼'}</span>` : '';
    const richtung = sortKey!==s.k ? 'none' : (sortDir>0 ? 'ascending' : 'descending');
    const wohin = sortKey!==s.k ? 'aufsteigend' : (sortDir>0 ? 'absteigend' : 'aufsteigend');
    return`<th class="sortable" aria-sort="${richtung}"><button type="button" class="sort-knopf" data-sort="${s.k}" onclick="setSort('${
      s.k}')" title="Nach ${escA(s.t)} ${wohin} sortieren">${s.t} ${pfeil}</button></th>`;
  }).join('');

  const koerper=zeilen.map(({j,iss})=>
    `<tr>${spalten.map(s=>tabZelle(s,j,iss,q)).join('')}</tr>`).join('');

  const tx = spalten.filter(s=>s.k==='t'||s.k==='r'||s.k==='kong').length;
  return`<div class="tabwrap"><table class="tab${tx>1?' tx'+tx:''}"><thead><tr>${kopf}</tr></thead><tbody>${koerper}</tbody><tfoot><tr><td class="t-fuss" colspan="${spalten.length}"></td></tr></tfoot></table></div>`;
}

// ─── Ansicht: Kongresse ────────────────────────────────────────────────────
// Gruppiert nicht nach Ausgabe, sondern nach Kongress: Welche Titel liegen
// dort aus bzw. berichten darüber – mit den zugehörigen Terminen.
function sammleKongresse(q){
  const ql=q.toLowerCase(), gruppen=new Map();
  JOURNALS.forEach(j=>{
    if(activeJ.size>0&&!activeJ.has(j.id))return;
    j.issues.forEach(iss=>{
      // Der Schalter gilt hier genauso wie in den uebrigen Ansichten: eine
      // Ausgabe mit verstrichenem Anzeigenschluss faellt samt ihren
      // Kongresseintraegen heraus.
      if(ohneVerstrichene && verstrichen(iss)) return;
      const eintraege=[];
      // Die Kennung wandert mit: der Kasten wird zwar ueber den Wortlaut
      // gebildet, seinen Platz in der Liste gibt aber der Zeitraum, und der
      // steht am Kongresssatz, nicht im Text.
      if(zeigtA()) iss.a.forEach(n=>eintraege.push([kongressText(n),'auslage',n]));
      if(zeigtB()) iss.b.forEach(n=>eintraege.push([kongressText(n),'bericht',n]));
      // Nur wenn das Thema in diesem Modus ueberhaupt angezeigt wird, darf es
      // Eintraege durch die Suche lassen – sonst staenden hier Kongresse ohne
      // erkennbaren Bezug zum Suchbegriff.
      const themaTreffer = ql && zeigeThema()
        && iss.t.join(' ').toLowerCase().includes(ql);
      eintraege.forEach(([n,art,kid])=>{
        if(ql && !n.toLowerCase().includes(ql) && !themaTreffer) return;
        const name=kongName(n);
        if(!gruppen.has(name)) gruppen.set(name,[]);
        gruppen.get(name).push({j,iss,art,roh:n,kid});
      });
    });
  });
  return gruppen;
}

// Beschriftung des Kastens: der Wortlaut aus der Heftplanung, damit dort dasselbe
// steht wie in den uebrigen Ansichten und ein Suchbegriff immer sichtbar ist.
// Gruppiert wird weiterhin ueber den Namen der Zuordnungsliste, sortiert
// dagegen ueber den Zeitraum – der Name entscheidet nur noch, was ein Kasten
// ist, nicht mehr, wo er steht. Sollten in der Heftplanung doch einmal zwei
// Schreibweisen auftauchen, gewinnt die haeufigere; bei Gleichstand die
// alphabetisch erste.
function kastenName(name,arr){
  if(name.startsWith('»')) return name;   // feste Rubrik behaelt ihre Beschriftung
  const zaehl=new Map();
  arr.forEach(e=>zaehl.set(e.roh,(zaehl.get(e.roh)||0)+1));
  return [...zaehl.keys()].sort((a,b)=>zaehl.get(b)-zaehl.get(a)||a.localeCompare(b,'de'))[0]||name;
}

function renderKongress(q){
  const gruppen=sammleKongresse(q);
  // Nach dem Kongresstermin, nicht nach dem Namen: die Liste liest sich damit
  // wie das Jahr selbst, und der Zeitraum steht ohnehin in jeder Ueberschrift.
  // Ein Kasten kann mehrere Saetze buendeln - die Zuordnungsliste fuehrt
  // verschiedene Schreibweisen auf einen Namen zusammen -, dann zaehlt der
  // frueheste Beginn. Ein nur als Monat bekannter Zeitraum ("September 2027")
  // steht am Ende seines Monats (siehe kongRang) - bis 19.09.2026 stand er
  // hinter dem ganzen Jahr, weil er kein Datum traegt.
  const termine=new Map();
  const termin=name=>{
    if(!termine.has(name)) termine.set(name, gruppen.get(name).reduce((frueh,e)=>{
      const von=kongRang(KONG.get(e.kid));
      return von && (!frueh || von<frueh) ? von : frueh;
    },''));
    return termine.get(name);
  };
  // Drei Stufen: feste Rubriken (kein echter Kongress) ganz ans Ende, davor die
  // Kongresse ohne Datum, und vorn der Jahreslauf. Bei gleichem Beginn - im
  // Bestand kommt das vor - bleibt es beim Namen.
  const rubrik=n=>n.startsWith('»')?1:0;
  const namen=[...gruppen.keys()].sort((a,b)=>{
    const r=rubrik(a)-rubrik(b); if(r) return r;
    const ta=termin(a), tb=termin(b);
    if(ta!==tb) return !ta ? 1 : !tb ? -1 : (ta<tb ? -1 : 1);
    return a.localeCompare(b,'de');
  });
  const html=namen.map(name=>{
    const arr=gruppen.get(name).sort((a,b)=>a.iss.et.localeCompare(b.iss.et));
    const hefte=new Set(arr.map(e=>e.j.id+'|'+e.iss.heft)).size;
    const zeilen=arr.map(({j,iss,art})=>{
      const thema=zeigeThema() ? iss.t.join(' · ') : '';
      return`<div class="kentry" style="--jcol:${j.hex}">
        <span class="ktitel">${esc(j.short)}</span>
        <span class="kheft">${esc(heftText(iss.heft))}<small>${j.auflage.toLocaleString('de-DE')} Expl.</small></span>
        <span class="kart ${art}">${art==='auslage'?'Auslage':'Bericht'}</span>
        ${datesHtml(iss,'kdate')}
        <span class="kthema">${hl(thema,q)}</span>
      </div>`;
    }).join('');
    return`<section class="kgroup"><h3 class="kname"><span class="kn-txt">${hl(kastenName(name,arr),q)}</span><span class="kcount">${hefte} Ausgabe${hefte!==1?'n':''}</span></h3>${zeilen}</section>`;
  }).join('');
  return{html,anzahl:namen.length,eintraege:[...gruppen.values()].reduce((s,a)=>s+a.length,0)};
}

// ─── Export: Dokumentkopf, Seitenformat, Dateiname ─────────────────────────
function jahrgang(){
  if(KOPIE) return KOPIE.jahr;   // in der Kopie gibt es kein Auswahlfeld mehr
  return jahr || String(new Date().getFullYear());
}

function heute(iso){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return iso ? `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`
             : `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// Der Stand der Heftplanung ist frei beschreibbar. Diese Funktion ist die
// einzige Quelle fuer Stempel, PDF-Kopf und Excel-Vorspann – so koennen die drei
// nicht auseinanderlaufen. Leeres Feld faellt auf den Startwert zurueck.
function standText(){
  const f=document.getElementById('standFeld');
  // Startwert kommt jetzt vom Jahrgang, nicht mehr aus einer festen Zeile.
  const t=f ? f.textContent.replace(/\s+/g,' ').trim() : '';
  return t || standStart();
}

// Ist der gezeigte Ausschnitt kleiner als der volle Jahrgang?
function eingeschraenkt(q){
  return !!q || modus.size>0 || activeJ.size>0 || ohneVerstrichene;
}

// Die getroffene Auswahl im Klartext – nur die Beschreibung, ohne Zahlen.
function auswahlTeile(q){
  const t=[];
  if(q) t.push(`Suchbegriff &raquo;${esc(q)}&laquo;`);
  if(modus.size) t.push('Inhalt: ' +
    ['auslage','bericht','thema','rubrik'].filter(k=>modus.has(k)).map(k=>MODUS_TEXT[k]).join(' und '));
  if(ohneVerstrichene) t.push('Ohne verstrichene Anzeigenschlüsse');
  if(activeJ.size) t.push('Titel: '+JOURNALS.filter(j=>activeJ.has(j.id)).map(j=>esc(j.short)).join(', '));
  return t;
}

// Steht in jedem Export, damit ein Auszug beim Empfaenger nie mit dem
// vollstaendigen Jahrgang verwechselt wird. In einer Kopie gilt dieselbe Regel:
// sie enthaelt den ganzen Jahrgang und meldet jede Eingrenzung, die der
// Empfaenger selbst vornimmt.
function kopfZeile(q,zahlen){
  const t = eingeschraenkt(q) ? auswahlTeile(q) : ['Vollständiger Jahrgang'];
  if(zahlen) t.push(zahlen);
  return t.join(' &middot; ');
}

function setzeExportKopf(q,zahlen){
  coverLeiste();
  const kopf=document.getElementById('exporttext');
  if(kopf) kopf.innerHTML =
    `<div class="eh-titel">Jahresvorschau <span>${esc(fachKopf())}</span> ${jahrgang()}</div>`+
    `<div class="eh-auswahl">${kopfZeile(q,zahlen)}</div>`+
    `<div class="eh-stand">Stand der Heftplanung ${esc(standText())} &middot; `+
    `Ansicht: ${VIEW_TEXT[view]}</div>`;
  setzePageStyle();
}

// Empfehlung der aktuellen Ansicht.
function empfohlenesFormat(){ return QUERFORMAT.has(view) ? 'landscape' : 'portrait'; }

// Hoch- oder Querformat richtet sich nach der Ansicht, damit im Druckdialog
// nichts umgestellt werden muss. Eine im Zwischenschritt getroffene Wahl geht
// vor. Die Abfrage steht hier und nicht nur beim Drucken, weil diese Zeile bei
// jedem Neuzeichnen neu gesetzt wird und die Wahl sonst verlorenginge.
function setzePageStyle(){
  const ps=document.getElementById('pagestyle');
  if(ps) ps.textContent =
    `@page{size:A4 ${druckFormat || empfohlenesFormat()};margin:12mm 11mm}`;
}

// "voll" setzt der HTML-Export: er gibt immer den ganzen Jahrgang aus, der
// Zusatz _Auszug waere dort irrefuehrend.
function exportName(q,voll){
  return `Jahresvorschau_${dateiFach()}Print_${jahrgang()}`
       + ((!voll && eingeschraenkt(q))?'_Auszug':'') + '_' + heute(true);
}

// "Als PDF" fuehrt zunaechst auf die zweite Ebene des Menues: dort wird die
// Ausrichtung gewaehlt. Vorausgewaehlt ist die Empfehlung der Ansicht.
function exportPdf(){
  const emp=empfohlenesFormat();
  ['portrait','landscape'].forEach(f=>{
    const b=document.getElementById(f==='portrait'?'exfPortrait':'exfLandscape');
    if(!b)return;
    b.classList.toggle('emp', f===emp);
    b.querySelector('.exf-grund').textContent = (f===emp) ? FORMAT_GRUND[f] : '';
  });
  const m=document.getElementById('exportMenu');
  if(m) m.classList.add('format');
}

function zurueckZumExport(){
  const m=document.getElementById('exportMenu');
  if(m) m.classList.remove('format');
}

// Chrome uebernimmt den Seitentitel als Dateinamen-Vorschlag beim Sichern
// als PDF – deshalb wird er kurz gesetzt und danach zurueckgestellt.
async function druckeMit(fmt){
  // Gedruckt wird eine der fuenf Druckvorlagen, nie der Arbeitsschirm: steht
  // er offen, wird er vorher geschlossen und die gewaehlte Ansicht aufgebaut.
  if(bearbOffen){
    if(!await bearbBeenden()) return;
    render();
  }
  druckFormat = fmt;
  setzePageStyle();
  schliesseExport();
  const q   = document.getElementById('q').value.trim();
  const alt = document.title;
  const zurueck = ()=>{
    document.title=alt;
    // Die Ausrichtung gilt nur fuer diesen Druck.
    druckFormat=null; setzePageStyle();
    window.removeEventListener('afterprint',zurueck);
  };
  document.title = exportName(q);
  window.addEventListener('afterprint',zurueck);
  setTimeout(()=>{ window.print(); setTimeout(zurueck,2000); },70);
}

// ─── Export: bedienbare HTML-Kopie ─────────────────────────────────────────
// Die Kopie umfasst immer den vollstaendigen Jahrgang und oeffnet neutral: ohne
// Suchbegriff, mit allen Titeln und allen Inhalten. Mit uebernommen wird nur die
// beim Export gewaehlte Ansicht. Fest steht allein der Jahrgang – dessen
// Auswahlfeld wird deshalb entfernt. Ein eigenes Exportmenue traegt sie nicht.

// JSON so einbetten, dass ein schliessendes Script-Tag im Text die Kopie nicht
// zerreisst. Achtung: Diese Zeichenfolge darf hier nirgends ausgeschrieben
// stehen – auch nicht im Kommentar –, sonst endet der Skriptbereich hier.
function sicheresJson(x){
  return JSON.stringify(x)
    .replace(/</g,'\\u003c')
    .replace(/\u2028/g,'\\u2028')
    .replace(/\u2029/g,'\\u2029');
}

// Gemeinsame Grundlage von "Als HTML" und "Werkzeug sichern": ein Abzug des
// Dokuments, der beim Oeffnen neutral startet. Der geklonte Baum traegt sonst
// noch die Markierungen der Auswahl vom Zeitpunkt der Erstellung und wuerde
// eine Einschraenkung anzeigen, die dort gar nicht mehr gilt.
function neutralerKlon(){
  const klon = document.documentElement.cloneNode(true);
  klon.querySelectorAll('.chip').forEach(c=>
    c.classList.toggle('active', c.dataset.j==='0'));
  klon.querySelectorAll('.mode-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.mode==='all'));
  // Auch die Ansicht faellt auf den Startwert zurueck: das Skript im Klon
  // beginnt bei view='cards', die geklonte Hervorhebung stand aber noch auf
  // der zuletzt gewaehlten Ansicht – die gesicherte Arbeitsdatei zeigte dann
  // Kacheln und markierte die Jahresmatrix. Die Kopie ist davon unberuehrt,
  // sie setzt ihre Ansicht beim Oeffnen ohnehin selbst (setView im Startskript).
  klon.querySelectorAll('.view-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.view==='cards'));
  // Stand die Arbeitsansicht beim Erzeugen offen, traegt der Klon noch deren
  // Koerperklasse - in der Kopie waere die Legende sonst bis zum ersten
  // Neuzeichnen ausgeblendet.
  const kb = klon.querySelector('body');
  if(kb) kb.classList.remove('bearbmodus');
  // Ebenso die Sperren der Kopfbedienung, die dort mitgeklont wuerden.
  klon.querySelectorAll('.mode-btn,.view-btn,#clearBtn,#q')
    .forEach(e=>e.removeAttribute('disabled'));
  klon.querySelectorAll('.chip').forEach(c=>{
    c.setAttribute('aria-disabled','false');
    c.setAttribute('tabindex','0');
  });
  const feld = klon.querySelector('#q');
  if(feld) feld.removeAttribute('value');
  const loeschen = klon.querySelector('#clearBtn');
  if(loeschen) loeschen.style.display='none';
  const schalter = klon.querySelector('#asSwitch');
  if(schalter) schalter.removeAttribute('checked');
  klon.querySelectorAll('.export-menu').forEach(m=>m.classList.remove('open','format'));
  // Die gerade angezeigten Ergebnisse muessen nicht mitwandern – sie werden
  // beim Oeffnen neu aufgebaut. Spart rund die Haelfte der Dateigroesse.
  // Geleert wird nur der Textteil des Dokumentkopfes, damit der Logo-Behaelter
  // erhalten bleibt.
  ['results','exporttext','stats'].forEach(id=>{
    const e=klon.querySelector('#'+id); if(e) e.innerHTML='';
  });
  return klon;
}

// Der Datenblock wird im Ganzen ersetzt. Ueber sicheresJson, damit ein
// schliessendes Script-Tag in einem Kongressnamen die Datei nicht zerreisst.
function schreibeDaten(klon,obj){
  const s=klon.querySelector('#daten');
  if(s) s.textContent =
    `\nlet DATEN = ${sicheresJson(obj)};\nlet OHNE_DATENBANK = true;\n`;
}

function baueKopie(){
  const klon = neutralerKlon();
  // Bedienelemente, die nur zur Arbeitsdatei gehoeren, fallen in der Kopie weg.
  // Der Menuepunkt "Bearbeiten" liegt in .daten-wrap und faellt damit mit weg.
  // .hero-konto traegt die angemeldete Adresse - die hat in einer Kopie, die
  // weitergereicht wird, nichts zu suchen.
  // querySelectorAll, nicht querySelector: seit die Rueckfragen eigene Blaetter
  // mit derselben Klasse anlegen, kann es mehr als ein .daten-dialog geben.
  // .bm-etikett ist ausserhalb der Arbeitsansicht ohnehin unsichtbar, gehoert
  // aber ebenso allein zur Arbeitsdatei.
  ['.export-wrap','.daten-wrap','.daten-dialog','.hero-konto','.bm-etikett','#anmeldung','#netzhinweis','#sichernBtn','#sicherStand','#sicherOffen']
    .forEach(sel=>{ klon.querySelectorAll(sel).forEach(w=>w.remove()); });
  // Die Zugangsdatei liegt neben der Arbeitsfassung, nicht neben der Kopie.
  // Ihr Skript-Verweis wuerde dort ins Leere zeigen.
  klon.querySelectorAll('script[src="konfiguration.js"]').forEach(s=>s.remove());

  // Der Jahrgang steht in der Kopie fest: das Auswahlfeld weicht einem
  // unveraenderlichen Text an derselben Stelle. Mitgegeben wird auch nur
  // dieser eine Jahrgang – ein anderer, womoeglich unfertiger, hat in einer
  // Kopie nichts zu suchen.
  const sel = klon.querySelector('#yearSel');
  if(sel){
    const fest = document.createElement('span');
    fest.className = 'jahr-fest';
    fest.textContent = jahrgang();
    sel.replaceWith(fest);
  }
  // Ohne Zeilenkennungen: sie zeigen auf eine Datenbank, die die Kopie nie
  // erreicht, und blaehen die Datei nur auf.
  const ohneKennung = JOURNALS.map(j=>({...j, issues: j.issues.map(iss=>{
    const {id, reihenfolge, ...rest} = iss; return rest;
  })}));
  // Die Kongresssaetze gehoeren mit in die Kopie: die Ausgaben fuehren nur noch
  // deren Kennung. Sie fallen dabei kaum ins Gewicht - 41 Saetze gegenueber
  // 169 wortgleich wiederholten Zeilen zuvor.
  const kongresse = (DATEN[jahrgang()] && DATEN[jahrgang()].kongresse) || [];
  schreibeDaten(klon,{[jahrgang()]:
    {stand:standText(), kongresse:kongresse, titel:ohneKennung}});

  const cl = klon.querySelector('#coverLeiste');
  if(cl){ cl.innerHTML = ''; cl.removeAttribute('style'); cl.className = 'cover-leiste'; }
  // Die Kopie zeigt den Kontakt immer in der Leseform, auch aus der Arbeitsansicht.
  const hk = klon.querySelector('#heroKontakt');
  if(hk) hk.innerHTML = kontaktHtml(kontaktJetzt(), true);
  const tb = klon.querySelector('#tabellen');
  if(tb) tb.textContent = '\nlet BEREICHE = ' + sicheresJson([{name:FACHBEREICH, kontakt:kontaktJetzt(), tabellen:null}]) + ';\nlet AKTIV = 0;\n';
  // Die Kopie zeigt einen Fachbereich: der Name steht dort als fester Text.
  const fw = klon.querySelector('.fach-wrap');
  if(fw){
    const fest = document.createElement('span');
    fest.className = 'accent'; fest.id = 'fachKopf';
    fest.textContent = fachKopf();
    fw.replaceWith(fest);
  }

  // Der Stand wandert als Text mit, ist in der Kopie aber nicht mehr aenderbar.
  // Ohne die Klasse faellt auch die Beschreibbar-Optik weg (helleres Weiss,
  // gepunktete Unterlinie) – in der Kopie ist es schlichter Text wie zuvor.
  const stand = klon.querySelector('#standFeld');
  if(stand){
    stand.textContent = standText();
    stand.setAttribute('contenteditable','false');
    stand.removeAttribute('title');
    stand.removeAttribute('class');
  }

  const t = klon.querySelector('title');
  if(t) t.textContent = `Jahresvorschau ${fachKopf()} ${jahrgang()}`;

  const start = document.createElement('script');
  start.textContent =
    `\nKOPIE=${sicheresJson({jahr:jahrgang()})};\n`+
    `setView(${sicheresJson(view)});\n`;
  klon.querySelector('body').appendChild(start);

  return '<!DOCTYPE html>\n'+klon.outerHTML;
}

function exportHtml(){
  schliesseExport();
  const q    = document.getElementById('q').value.trim();
  const html = baueKopie();
  const url = URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const a   = document.createElement('a');
  a.href=url; a.download=exportName(q,true)+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

// ─── Export: echtes .xlsx ──────────────────────────────────────────────────
// Eine Excel-Datei ist ein ZIP-Paket aus XML-Dateien. Es wird hier ohne fremde
// Programmbibliothek gebaut: die Teile werden unkomprimiert abgelegt ("store"),
// was ein gueltiges ZIP ergibt und von Excel ohne Warnung geoeffnet wird.
const CRC_TAB = (function(){
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1);
    t[n]=c>>>0; }
  return t;
})();

function crc32(b){
  let c=0xFFFFFFFF;
  for(let i=0;i<b.length;i++) c = CRC_TAB[(c^b[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}

function zipBauen(dateien){
  const enc=new TextEncoder(), teile=[], zentral=[];
  const d=new Date();
  const zeit=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const datum=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  let versatz=0;

  dateien.forEach(f=>{
    const name=enc.encode(f.name), inhalt=f.bytes, crc=crc32(inhalt), len=inhalt.length;
    const lh=new Uint8Array(30+name.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x0800,true);
    v.setUint16(8,0,true); v.setUint16(10,zeit,true); v.setUint16(12,datum,true);
    v.setUint32(14,crc,true); v.setUint32(18,len,true); v.setUint32(22,len,true);
    v.setUint16(26,name.length,true); v.setUint16(28,0,true);
    lh.set(name,30);
    teile.push(lh,inhalt);

    const ch=new Uint8Array(46+name.length), w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true);
    w.setUint16(8,0x0800,true); w.setUint16(10,0,true);
    w.setUint16(12,zeit,true); w.setUint16(14,datum,true);
    w.setUint32(16,crc,true); w.setUint32(20,len,true); w.setUint32(24,len,true);
    w.setUint16(28,name.length,true); w.setUint32(42,versatz,true);
    ch.set(name,46);
    zentral.push(ch);
    versatz += lh.length + len;
  });

  const zGroesse=zentral.reduce((s,c)=>s+c.length,0);
  const ende=new Uint8Array(22), e=new DataView(ende.buffer);
  e.setUint32(0,0x06054b50,true);
  e.setUint16(8,dateien.length,true); e.setUint16(10,dateien.length,true);
  e.setUint32(12,zGroesse,true); e.setUint32(16,versatz,true);

  const alle=teile.concat(zentral,[ende]);
  const gesamt=alle.reduce((s,a)=>s+a.length,0);
  const raus=new Uint8Array(gesamt);
  let p=0; alle.forEach(a=>{ raus.set(a,p); p+=a.length; });
  return raus;
}

/* ═══ Daten laden und sichern ══════════════════════════════════════════════
   Gelesen wird genau das Blatt, das dieses Werkzeug selbst schreibt: "Ausgaben"
   mit einer Zeile je Heft. Damit gibt es kein zweites Datenformat, das
   gepflegt werden muesste – der Weg lautet ausgeben, in Excel aendern, laden,
   sichern. Entpackt wird ohne fremde Programmbibliothek: eine Excel-Datei ist
   ein ZIP-Paket, und das Auspacken beherrscht der Browser selbst. Anders als
   beim Angebotsplaner wird also nichts aus dem Netz nachgeladen; die Datei
   arbeitet auch ohne Internetverbindung.
*/

// ── ZIP lesen: Gegenstueck zu zipBauen ──
function zipLesen(puffer){
  const dv=new DataView(puffer), u8=new Uint8Array(puffer);
  let ende=-1;
  for(let i=u8.length-22; i>=0 && i>u8.length-70000; i--){
    if(dv.getUint32(i,true)===0x06054b50){ ende=i; break; }
  }
  if(ende<0) throw new Error('Die Datei ist kein lesbares Excel-Paket.');
  const anzahl=dv.getUint16(ende+10,true);
  let pos=dv.getUint32(ende+16,true);
  const dateien={}, dec=new TextDecoder('utf-8');
  for(let n=0; n<anzahl; n++){
    if(dv.getUint32(pos,true)!==0x02014b50) break;
    const verfahren=dv.getUint16(pos+10,true);
    const gepackt  =dv.getUint32(pos+20,true);
    const nl=dv.getUint16(pos+28,true), el=dv.getUint16(pos+30,true), kl=dv.getUint16(pos+32,true);
    const lokal=dv.getUint32(pos+42,true);
    const name=dec.decode(u8.subarray(pos+46,pos+46+nl));
    // Die Groessenangaben stammen aus dem zentralen Verzeichnis: im lokalen
    // Kopf duerfen sie bei manchen Schreibern fehlen.
    const lnl=dv.getUint16(lokal+26,true), lel=dv.getUint16(lokal+28,true);
    const start=lokal+30+lnl+lel;
    dateien[name]={verfahren,bytes:u8.subarray(start,start+gepackt)};
    pos+=46+nl+el+kl;
  }
  return dateien;
}

async function teilText(dateien,name){
  const e=dateien[name];
  if(!e) return '';
  if(e.verfahren===0) return new TextDecoder('utf-8').decode(e.bytes);
  if(typeof DecompressionStream!=='function')
    throw new Error('Dieser Browser kann gepackte Excel-Dateien nicht öffnen. '
      +'Die Datei bitte in Chrome, Edge oder Safari 16.4 (oder neuer) laden.');
  const strom=new Blob([e.bytes]).stream()
    .pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder('utf-8').decode(await new Response(strom).arrayBuffer());
}

function xmlKlartext(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
    .replace(/&#x([0-9a-fA-F]+);/g,(m,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/&amp;/g,'&');
}

function attribut(tag,name){
  const m=new RegExp(name.replace(':','\\:')+'="([^"]*)"').exec(tag);
  return m ? xmlKlartext(m[1]) : '';
}

// Excel legt wiederkehrende Texte in einer gemeinsamen Liste ab.
function gemeinsameTexte(xml){
  if(!xml) return [];
  return [...xml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>
    [...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t=>xmlKlartext(t[1])).join(''));
}

// Blatt -> Map(Zeilennummer -> Map(Spaltenbuchstabe -> Text))
function blattTabelle(xml,texte){
  const tab=new Map();
  for(const zeile of xml.matchAll(/<row\b([^>]*)>([\s\S]*?)<\/row>/g)){
    const nr=Number(attribut(zeile[1]+' ','r'))||tab.size+1;
    const zellen=new Map();
    for(const z of zeile[2].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const kopf=z[1], rumpf=z[2]||'';
      const sp=(attribut(kopf+' ','r')||'').replace(/\d+/g,'');
      const art=attribut(kopf+' ','t');
      let wert='';
      if(art==='s'){
        const v=/<v>([\s\S]*?)<\/v>/.exec(rumpf);
        wert = v ? (texte[Number(v[1])]||'') : '';
      } else if(art==='inlineStr'){
        wert=[...rumpf.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t=>xmlKlartext(t[1])).join('');
      } else {
        const v=/<v>([\s\S]*?)<\/v>/.exec(rumpf);
        wert = v ? xmlKlartext(v[1]) : '';
      }
      if(sp) zellen.set(sp,wert);
    }
    tab.set(nr,zellen);
  }
  return tab;
}

// ── Rueckuebersetzung einzelner Felder ──
const zz=n=>String(n).padStart(2,'0');

// Excel liefert ein Datum als Zahl (Tage seit dem 30.12.1899) oder als Text.
function ausExcelDatum(w){
  const t=String(w==null?'':w).trim();
  if(!t) return '';
  if(/^\d+([.,]\d+)?$/.test(t)){
    const d=new Date(Date.UTC(1899,11,30)+Math.round(parseFloat(t.replace(',','.')))*86400000);
    return `${d.getUTCFullYear()}-${zz(d.getUTCMonth()+1)}-${zz(d.getUTCDate())}`;
  }
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(t);
  if(m) return `${m[3]}-${zz(m[2])}-${zz(m[1])}`;
  const i=/^(\d{4})-(\d{2})-(\d{2})/.exec(t);
  return i ? `${i[1]}-${i[2]}-${i[3]}` : '';
}

// Die Spalte "Themenschwerpunkte" fuehrt einen Eintrag je Zeile. Aeltere
// Ausgaben dieses Werkzeugs schrieben das zweite Thema mit dem Vorsatz
// "Top-Thema:" – eine solche Zeile wird entkleidet und ans Ende gestellt,
// damit eine bisher geschriebene Datei unveraendert richtig laedt.
// Mehr als zwei Zeilen kann die Datenbank nicht halten; ueberzaehlige werden
// deshalb an den zweiten Eintrag angehaengt, statt verlorenzugehen.
function ausThemaZelle(w){
  const zeilen=String(w==null?'':w).split(/\r?\n/).map(z=>z.trim()).filter(Boolean);
  const vorne=[], hinten=[];
  zeilen.forEach(z=>{
    const m=/^Top-?Thema:\s*(.*)$/i.exec(z);
    if(m) hinten.push(m[1].trim()); else vorne.push(z);
  });
  const alle=vorne.concat(hinten).filter(Boolean);
  return alle.length<=2 ? alle : [alle[0], alle.slice(1).join(' ')];
}

function ausListenZelle(w){
  return String(w==null?'':w).split(/\r?\n/).map(z=>z.trim()).filter(Boolean);
}

// Farbe, Langname und Kennnummer eines Titels bleiben im Werkzeug: sie aendern
// sich nicht von Jahrgang zu Jahrgang und haetten in einer Terminliste nichts
// verloren. Erkannt wird ein Titel an seinem Namen.
function titelStamm(kurz){
  for(const y of jahrgaenge()){
    const t=(DATEN[y].titel||[]).find(j=>j.short===kurz);
    if(t) return {id:t.id,short:t.short,full:t.full,color:t.color,hex:t.hex,
                  rubriken:(t.rubriken||[]).map(r=>({id:r.id,name:r.name}))};
  }
  return null;
}
function naechsteTitelId(){
  let max=0;
  jahrgaenge().forEach(y=>(DATEN[y].titel||[]).forEach(j=>{ if(j.id>max) max=j.id; }));
  return max+1;
}

// ── Blatt auswerten ──
const PFLICHTSPALTEN=['Jahrgang','Titel','Heft','Erscheinungstermin (ET)',
  'Anzeigenschluss (AS)','Druckunterlagen (DU)',
  'Ein-/Durchhefter und Beilagen (EH)','Auflage','Themenschwerpunkte',
  'Kongresse'];

function werteBlattAus(tab){
  // Kopfzeile ueber die Ueberschriften finden, nicht ueber die Zeilennummer.
  let kopfR=0, spalte={};
  for(const [nr,zellen] of tab){
    let treffer=false;
    zellen.forEach(w=>{ if(String(w).trim()==='Jahrgang') treffer=true; });
    if(treffer){
      kopfR=nr;
      zellen.forEach((w,sp)=>{ const t=String(w).trim(); if(t) spalte[t]=sp; });
      break;
    }
  }
  if(!kopfR) throw new Error('In der Datei wurde keine Kopfzeile mit der Spalte '
    +'»Jahrgang« gefunden.\n\nErwartet wird das Blatt »Ausgaben«, das dieses '
    +'Werkzeug unter »Export → Als Excel« schreibt.');

  // Bis September 2026 hiess die Themenspalte "Schwerpunkt". Wer eine damals
  // geschriebene Datei laedt, soll sie nicht neu benennen muessen.
  if(spalte['Schwerpunkt']!==undefined && spalte['Themenschwerpunkte']===undefined)
    spalte['Themenschwerpunkte']=spalte['Schwerpunkt'];
  // Bis Print 2 standen Auslagen und Berichte in zwei Spalten.
  if(spalte['Kongresse']===undefined && spalte['Kongressauslagen']!==undefined)
    spalte['Kongresse']=spalte['Kongressauslagen'];

  const fehlend=PFLICHTSPALTEN.filter(s=>!spalte[s]);
  if(fehlend.length) throw new Error('In der Tabelle fehlen Spalten:\n\n'
    +fehlend.map(s=>'• '+s).join('\n')
    +'\n\nFehlen die Kongressspalten, wurde die Excel-Datei mit einem '
    +'Inhaltsfilter erzeugt. Für das Laden wird eine Ausgabe ohne Filter '
    +'benötigt – sonst gingen die gefilterten Angaben verloren.');

  // Der Vorspann meldet, ob die Ausgabe den ganzen Jahrgang umfasst. Ein Auszug
  // wird nicht geladen: er wuerde alles ueberschreiben, was er nicht enthaelt.
  let vollstaendig=false, standZeile='';
  for(const [nr,zellen] of tab){
    if(nr>=kopfR) break;
    zellen.forEach(w=>{
      const t=String(w);
      if(t.includes('Vollständiger Jahrgang')) vollstaendig=true;
      const m=/^Stand der Heftplanung\s+(.*)$/.exec(t.trim());
      if(m) standZeile=m[1].trim();
    });
  }
  if(!vollstaendig) throw new Error('Diese Excel-Datei ist ein Auszug.\n\n'
    +'Geladen werden kann nur eine Ausgabe des vollständigen Jahrgangs: '
    +'Suchfeld leeren, Inhaltsfilter auf »Alle Inhalte«, alle Titel und den '
    +'Schalter für verstrichene Anzeigenschlüsse aus – dann »Export → '
    +'Als Excel«.');

  const jahre={}, unbekannt=new Set(), krummeJahre=new Set();
  const ohneEt=[], doppelte=[], gesehen=new Set();
  for(const [nr,zellen] of tab){
    if(nr<=kopfR) continue;
    const g=n=>String(zellen.get(spalte[n])==null?'':zellen.get(spalte[n]));
    const y=g('Jahrgang').trim(), kurz=g('Titel').trim(), heft=g('Heft').trim();
    if(!y||!kurz||!heft) continue;
    // Ein Vertipper in dieser einen Spalte legt sonst einen Jahrgang an, der
    // gar nicht gemeint war – und Jahrgaenge entstehen leichter, als sie
    // wieder verschwinden. Deshalb hier eine enge Pruefung.
    if(!/^\d{4}$/.test(y) || +y<2000 || +y>2100){ krummeJahre.add(y); continue; }
    const themen=ausThemaZelle(g('Themenschwerpunkte'));
    const iss={heft,
      et:ausExcelDatum(g('Erscheinungstermin (ET)')),
      as:ausExcelDatum(g('Anzeigenschluss (AS)')),
      du:ausExcelDatum(g('Druckunterlagen (DU)')),
      eh:ausExcelDatum(g('Ein-/Durchhefter und Beilagen (EH)')),
      a:kongresseZusammen(ausListenZelle(g('Kongresse')),
        spalte['Kongressberichte']!==undefined ? ausListenZelle(g('Kongressberichte')) : []),
      b:[]};
    iss.t=themen;

    // Der Erscheinungstermin ist das einzige wirklich unentbehrliche Datum:
    // danach wird sortiert, nach seinem Monat gruppiert und die Spalte in der
    // Jahresmatrix bestimmt. Fehlt er, entstuende eine Monatsgruppe ohne Namen
    // und die Ausgabe fiele aus der Matrix – lieber gleich abbrechen.
    if(!iss.et) ohneEt.push(`${y} · ${kurz}, ${heftText(heft)}`);
    // Eine kopierte Zeile mit vergessener Heftnummer wuerde dieselbe Ausgabe
    // zweimal anlegen; in der Matrix teilten sich beide sogar ein Feld.
    const schluessel=y+'|'+kurz+'|'+heft;
    if(gesehen.has(schluessel)) doppelte.push(`${y} · ${kurz}, ${heftText(heft)}`);
    gesehen.add(schluessel);

    if(!jahre[y]) jahre[y]={stand:standZeile,titel:[],nachName:{}};
    const J=jahre[y];
    if(!J.nachName[kurz]){
      const stamm=titelStamm(kurz);
      if(!stamm) unbekannt.add(kurz);
      const neueId=naechsteTitelId()+unbekannt.size-1;
      const t=stamm || {id:neueId,short:kurz,full:kurz,
                        color:'var(--muted)',hex:farbeFuer(neueId),rubriken:[]};
      J.nachName[kurz]=Object.assign({},t,{auflage:0,issues:[]});
      J.titel.push(J.nachName[kurz]);
    }
    const T=J.nachName[kurz];
    const aufl=parseInt(String(g('Auflage')).replace(/[^\d]/g,''),10);
    if(!T.auflage && aufl>0) T.auflage=aufl;
    T.issues.push(iss);
    if(spalte['Weitere Rubriken']!==undefined){
      iss.r={};
      ausListenZelle(g('Weitere Rubriken')).forEach(z=>{
        const m=/^([^:]+):\s*(.*)$/.exec(z);
        if(!m || !m[2].trim()) return;
        const name=m[1].trim();
        if(!T.rubriken) T.rubriken=[];
        let r=T.rubriken.find(x=>x.name===name);
        if(!r){ r={id:neueRubrikId(), name}; T.rubriken.push(r); }
        iss.r[r.id]=m[2].trim();
      });
    }
  }

  Object.keys(jahre).forEach(y=>{
    jahre[y].titel.sort((a,b)=>a.id-b.id);
    jahre[y].titel.forEach(t=>{
      delete t.nachName;
      t.issues.sort((a,b)=>(a.et||'9999').localeCompare(b.et||'9999'));
    });
    delete jahre[y].nachName;
  });
  if(ohneEt.length) throw new Error('Diesen Ausgaben fehlt der Erscheinungstermin:\n\n'
    +ohneEt.slice(0,8).map(z=>'• '+z).join('\n')
    +(ohneEt.length>8?`\n• … und ${ohneEt.length-8} weitere`:'')
    +'\n\nOhne Erscheinungstermin lässt sich eine Ausgabe weder einsortieren noch '
    +'in der Jahresmatrix anzeigen. Die übrigen Termine dürfen fehlen, dieser nicht.');
  if(krummeJahre.size) throw new Error('In der Spalte »Jahrgang« stehen unbrauchbare '
    +'Angaben:\n\n'+[...krummeJahre].map(j=>'• »'+j+'«').join('\n')
    +'\n\nErwartet wird eine vierstellige Jahreszahl zwischen 2000 und 2100. '
    +'Ein Vertipper würde sonst einen Jahrgang anlegen, der gar nicht gemeint ist.');
  if(!Object.keys(jahre).length)
    throw new Error('In der Tabelle wurden keine Datenzeilen gefunden.');
  return {jahre,unbekannt:[...unbekannt],doppelte};
}

// Wie viele Kongresskaesten haetten mehr als eine Schreibweise? Dieselbe
// Pruefung, die bei der Datenpflege von Hand gemacht wurde.
function schreibweisenKollisionen(titel){
  const gruppen=new Map();
  titel.forEach(j=>j.issues.forEach(iss=>[...(iss.a||[]),...(iss.b||[])].forEach(n=>{
    const k=kongName(n);
    if(!gruppen.has(k)) gruppen.set(k,new Set());
    gruppen.get(k).add(n);
  })));
  return [...gruppen.entries()].filter(([k,s])=>s.size>1).map(([k])=>k);
}

// Der Dialog trägt seine Handlung selbst: laden, entfernen oder nur melden.
let dialogAktion=null;
let dialogWegAktion=null;

// "weg" ist die dritte, zerstoerende Handlung: {text, aktion}. Sie fehlt bei
// fast allen Dialogen - der Knopf wird darum bei jedem Aufruf wieder
// ausgeblendet, sonst bliebe er vom vorigen Dialog stehen.
function dialogZeigen(titel,html,okText,aktion,warnend,weg){
  document.getElementById('ladeKopf').textContent=titel;
  document.getElementById('ladeInhalt').innerHTML=html;
  dialogAktion=aktion||null;
  const ok=document.getElementById('ladeOk');
  ok.style.display=aktion?'':'none';
  ok.textContent=okText||'Übernehmen';
  ok.classList.toggle('dlg-warnung',!!warnend);
  document.getElementById('ladeAbbruch').textContent=aktion?'Abbrechen':'Schließen';
  const wegKnopf=document.getElementById('ladeWeg');
  dialogWegAktion=(weg && weg.aktion)||null;
  wegKnopf.hidden=!dialogWegAktion;
  wegKnopf.textContent=(weg && weg.text)||'Entfernen';
  ladeStand(''); ladeKnoepfe(false);
  document.getElementById('ladeDialog').classList.add('offen');
}

function dialogWegAusfuehren(){ if(dialogWegAktion) dialogWegAktion(); }

}

// Was ginge beim Übernehmen verloren? Der Import ersetzt den Jahrgang im
// Ganzen – nur so lassen sich gestrichene Hefte und entfallene Kongresse
// überhaupt entfernen. Eine gelöschte Excel-Zeile wirkt damit als Löschung,
// und das darf nicht in einer Zahlenspalte untergehen.
function verlust(y,neu){
  const alt=DATEN[y];
  if(!alt) return null;
  const hefte =t=>t.reduce((s,j)=>s+j.issues.length,0);
  const eintr =t=>t.reduce((s,j)=>s+j.issues.reduce((n,i)=>n+i.a.length+i.b.length,0),0);
  const neuNamen=new Set(neu.titel.map(j=>j.short));
  const wegTitel=alt.titel.filter(j=>!neuNamen.has(j.short)).map(j=>j.short);
  const wegHefte=[];
  alt.titel.forEach(j=>{
    const n=neu.titel.find(x=>x.short===j.short);
    if(!n) return;                       // ganzer Titel entfällt, oben schon genannt
    const da=new Set(n.issues.map(i=>i.heft));
    const fehlt=j.issues.filter(i=>!da.has(i.heft)).map(i=>i.heft);
    if(fehlt.length) wegHefte.push(`${j.short}: Heft ${fehlt.join(', ')}`);
  });
  const dA=hefte(alt.titel)-hefte(neu.titel);
  const dE=eintr(alt.titel)-eintr(neu.titel);
  if(!wegTitel.length && !wegHefte.length && dA<=0 && dE<=0) return null;
  const teile=[];
  if(wegTitel.length) teile.push(`<b>${wegTitel.length===1?'Ein Titel entfällt':wegTitel.length+' Titel entfallen'} vollständig:</b> `
    +wegTitel.map(esc).join(' · '));
  if(wegHefte.length) teile.push(`<b>Entfallende Hefte:</b> ${wegHefte.map(esc).join(' · ')}`);
  if(dA>0) teile.push(`${dA} Ausgabe${dA===1?'':'n'} weniger als bisher`);
  if(dE>0) teile.push(`${dE} Kongresseintr${dE===1?'ag':'äge'} weniger als bisher`);
  return teile.join('<br>');
}
function dialogSchliessen(){
  document.getElementById('ladeDialog').classList.remove('offen');
  ladeErgebnis=null; dialogAktion=null; dialogWegAktion=null;
  ladeStand(''); ladeKnoepfe(false);
}

async function datenDateiGewaehlt(ev){
  const datei=ev.target.files[0];
  ev.target.value='';
  if(!datei) return;
  try{
    const teile=zipLesen(await datei.arrayBuffer());
    const wb   =await teilText(teile,'xl/workbook.xml');
    if(!wb) throw new Error('Die Datei enthält keine Excel-Arbeitsmappe.');
    const rels =await teilText(teile,'xl/_rels/workbook.xml.rels');
    const blaetter=[...wb.matchAll(/<sheet\b([^>]*?)\/?>/g)].map(m=>
      ({name:attribut(m[1]+' ','name'), rid:attribut(m[1]+' ','r:id')}));
    const gesucht=blaetter.find(b=>b.name==='Ausgaben')||blaetter[0];
    if(!gesucht) throw new Error('Die Arbeitsmappe enthält kein Tabellenblatt.');
    // Der Blattname zeigt nur auf eine Kennung; wo die Datei wirklich liegt,
    // steht in der Beziehungsliste der Arbeitsmappe.
    const rel=new RegExp('<Relationship\\b[^>]*Id="'+gesucht.rid+'"[^>]*>').exec(rels);
    let ziel=rel?attribut(rel[0],'Target'):'worksheets/sheet1.xml';
    ziel=ziel.replace(/^\//,'');
    if(!ziel.startsWith('xl/')) ziel='xl/'+ziel;
    const blattXmlText=await teilText(teile,ziel);
    if(!blattXmlText) throw new Error('Das Tabellenblatt konnte nicht gelesen werden.');
    const texte=gemeinsameTexte(await teilText(teile,'xl/sharedStrings.xml'));
    const erg=werteBlattAus(blattTabelle(blattXmlText,texte));

    const zeilen=[]; let schrumpft=false;
    Object.keys(erg.jahre).sort().forEach(y=>{
      const t=erg.jahre[y].titel;
      const ausgaben=t.reduce((s,j)=>s+j.issues.length,0);
      const eintr=t.reduce((s,j)=>s+j.issues.reduce((n,i)=>n+i.a.length+i.b.length,0),0);
      const ohneAs=t.reduce((s,j)=>s+j.issues.filter(i=>!i.as).length,0);
      const koll=schreibweisenKollisionen(t);
      const vorher=(DATEN[y] && DATEN[y].titel.some(j=>j.issues.length))
        ? `ersetzt den vorhandenen Jahrgang mit ${DATEN[y].titel.reduce((s,j)=>s+j.issues.length,0)} Ausgaben`
        : 'neuer Jahrgang';
      const fehlt=verlust(y,erg.jahre[y]);
      if(fehlt) schrumpft=true;
      zeilen.push(`<div class="pr-jahr"><b>${y}</b> <span>${vorher}</span></div>`
        +(fehlt?`<div class="pr-warn"><div class="pr-warn-kopf">Beim Übernehmen gehen Angaben verloren</div>${fehlt}<br>Der bisherige Stand bleibt als Sicherungspunkt »Vor dem Laden aus Excel« erhalten.</div>`:'')
        +`<table class="pr-tab"><tbody>`
        +`<tr><td>Titel</td><td>${t.length}</td></tr>`
        +`<tr><td>Ausgaben</td><td>${ausgaben}</td></tr>`
        +`<tr><td>Kongresseinträge</td><td>${eintr}</td></tr>`
        +`<tr${ohneAs?' class="pr-merk"':''}><td>Ausgaben ohne Anzeigenschluss</td><td>${ohneAs}</td></tr>`
        +`<tr${koll.length?' class="pr-merk"':''}><td>Kongresse mit mehr als einer Schreibweise</td><td>${koll.length}</td></tr>`
        +`</tbody></table>`
        +(koll.length?`<div class="pr-hinw">Uneinheitlich geschrieben: ${koll.map(esc).join(' · ')}</div>`:'')
        +`<div class="pr-stand">Stand der Heftplanung: ${esc(erg.jahre[y].stand||'ohne Angabe')}</div>`);
    });
    if(erg.unbekannt.length)
      zeilen.push(`<div class="pr-hinw">Unbekannte Titel, die neu angelegt würden: `
        +`${erg.unbekannt.map(esc).join(' · ')}. Die Kennfarbe lässt sich danach unter »Bearbeiten« setzen.</div>`);

    // Doppelte Hefte sind fast immer eine kopierte Zeile mit vergessener
    // Nummer. Übernehmen lässt sich das trotzdem – gemeldet wird es deutlich.
    if(erg.doppelte.length){
      schrumpft=true;   // faerbt die Schaltflaeche und macht sie zur Entscheidung
      zeilen.push(`<div class="pr-warn"><div class="pr-warn-kopf">Diese Hefte stehen mehrfach in der Tabelle</div>`
        +erg.doppelte.slice(0,8).map(esc).join('<br>')
        +(erg.doppelte.length>8?`<br>… und ${erg.doppelte.length-8} weitere`:'')
        +`<br>Sie würden doppelt angelegt.</div>`);
    }

    ladeErgebnis=erg.jahre;
    // Bei Verlusten heisst die Schaltflaeche anders: die Übernahme soll dann
    // eine bewusste Entscheidung sein, kein Durchklicken.
    dialogZeigen('Geprüft: '+datei.name, zeilen.join(''),
      schrumpft ? 'Trotzdem übernehmen' : 'Übernehmen', ladenUebernehmen, schrumpft);
  }catch(e){
    ladeErgebnis=null;
    dialogZeigen('Die Datei wurde nicht geladen',
      '<div class="pr-fehler">'+esc(String(e.message||e)).replace(/\n/g,'<br>')+'</div>');
  }
}

async function ladenUebernehmen(){
  if(!ladeErgebnis) return dialogSchliessen();
  const jahre=Object.keys(ladeErgebnis).sort();
  ladeKnoepfe(true);
  try{
    for(const y of jahre){
      // Der Import ersetzt den Jahrgang im Ganzen. Ein Weg zurueck soll ohne
      // Zutun bereitliegen, deshalb entsteht vorher ein Sicherungspunkt - aber
      // nur, wenn es ueberhaupt etwas zu sichern gibt.
      if(DATEN[y]){
        ladeStand(`Jahrgang ${y}: Sicherungspunkt wird angelegt …`);
        await sicherungSchreiben(y,'Vor dem Laden aus Excel');
      }
      ladeStand(`Jahrgang ${y} wird übernommen …`);
      await jahrgangSchreiben(y, ladeErgebnis[y].stand||'', ladeErgebnis[y].titel);
    }
    // Danach wird der Bestand frisch geholt: erst damit stehen die von der
    // Datenbank vergebenen Zeilenkennungen bereit, ohne die sich eine Ausgabe
    // nicht bearbeiten liesse.
    ladeStand('Der Bestand wird neu geladen …');
    DATEN = await datenHolen();
    // Erst jetzt stehen die Zeilenkennungen der neuen Ausgaben bereit, ohne die
    // sich keine Zuordnung schreiben laesst.
    if(KONG_TABELLEN)
      for(const y of jahre){
        ladeStand(`Jahrgang ${y}: Kongresse werden übernommen …`);
        await kongresseUebernehmen(y);
      }
    dialogSchliessen();
    waehleJahrgang(jahre.includes(jahr) ? jahr : jahre[0]);
    sicherungenHolen();
  }catch(fehler){
    ladeStand(fehlertext(fehler), true);
    ladeKnoepfe(false);
  }
}

// Einen ganzen Jahrgang schreiben: aus Excel, aus einem Sicherungspunkt - der
// Weg ist derselbe. Die Titel zu loeschen nimmt ueber die Fremdschluessel die
// Ausgaben mit; nur so verschwinden gestrichene Hefte wirklich.
async function jahrgangSchreiben(y, stand, titel){
  const da = await dbAnfrage('/rest/v1/jahrgang?select=jahr&jahr=eq.'+encodeURIComponent(y));
  if(da && da.length)
    await dbAnfrage('/rest/v1/jahrgang?jahr=eq.'+encodeURIComponent(y),
      {method:'PATCH', headers:{Prefer:'return=minimal'},
       body: JSON.stringify({stand: stand||''})});
  else
    await dbAnfrage('/rest/v1/jahrgang',
      {method:'POST', headers:{Prefer:'return=minimal'},
       body: JSON.stringify({jahr:y, stand: stand||''})});

  // Excel und Sicherungspunkte fuehren kein Cover: das bisherige bleibt.
  const coverVorher = new Map((await dbAnfrage('/rest/v1/titel?jahr=eq.'+encodeURIComponent(y)))
    .map(t=>[String(t.id), t.cover || '']));
  await dbAnfrage('/rest/v1/titel?jahr=eq.'+encodeURIComponent(y),
    {method:'DELETE', headers:{Prefer:'return=minimal'}});
  await dbAnfrage('/rest/v1/titel',
    {method:'POST', headers:{Prefer:'return=minimal'},
     body: JSON.stringify(titel.map(t=>({jahr:y, id:t.id, kurz:t.short, voll:t.full,
       auflage:t.auflage||0, hex:t.hex||'#00285a', rubriken:t.rubriken||[],
       cover: t.cover!==undefined ? (t.cover||'') : (coverVorher.get(String(t.id)) || '')})))});

  const zeilen=[];
  titel.forEach(t=>t.issues.forEach((iss,n)=>zeilen.push({
    jahr:y, titel_id:t.id, reihenfolge:n+1, heft:iss.heft,
    erscheinung:iss.et||null, anzeigenschluss:iss.as||null,
    druckunterlagen:iss.du||null, anlieferung:iss.eh||null,
    sonderthema:iss.t[0]||'', thema:iss.t[1]||'',
    auslagen:iss.a||[], berichte:iss.b||[], inhalte:iss.r||{}})));
  if(zeilen.length)
    await dbAnfrage('/rest/v1/ausgabe',
      {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(zeilen)});

  // Die Zuordnungen hingen an den eben geloeschten Ausgaben und sind mit
  // gefallen; die Kongresssaetze haengen dagegen am Jahrgang und stuenden noch
  // da - ohne eine einzige Zuordnung. Der Jahrgang saehe dann aus, als fuehre
  // er keine Kongresse mehr. Deshalb kommen auch sie weg: es gelten wieder die
  // Spalten an der Ausgabe, und kongresseUebernehmen baut danach neu auf.
  if(KONG_TABELLEN)
    try{
      await dbAnfrage('/rest/v1/kongress?jahr=eq.' + encodeURIComponent(y),
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
    }catch(fehler){ /* Schema noch nicht eingespielt */ }
}

// ── Jahrgang entfernen ──
// Der Gegenweg zum Laden: ein Jahrgang entsteht beim Import von selbst, ohne
// diesen Punkt gäbe es keinen Weg zurück – weder für einen abgelaufenen noch
// für einen versehentlich angelegten.
// ── Jahrgang anlegen ──
// Der zweite Weg neben "Aus Excel laden": ein Jahr ohne Hefte, das von Hand
// gefuellt wird. Die Titel kommen auf Wunsch aus dem gezeigten Jahrgang -
// Nummer, voller Name und Kennfarbe stehen nicht in der Excel-Tabelle und
// muessten sonst abgetippt werden.
async function jahrgangAnlegen(){
  schliesseDaten();
  if(!await bearbFrei()) return;
  const da = jahrgaenge();
  const vorlage = DATEN[jahr] ? jahr : da[da.length-1];
  const zahlen = da.map(Number).filter(n=>!isNaN(n));
  const vorschlag = String((zahlen.length ? Math.max(...zahlen) : new Date().getFullYear()) + 1);
  const anzahl = (DATEN[vorlage] ? DATEN[vorlage].titel.length : 0);
  const kAnzahl = 0;   // Print: Kongresse stehen als Text an den Heften
  dialogZeigen('Jahrgang anlegen',
    `<label class="dlg-feld">Jahr
       <input type="text" id="njJahr" inputmode="numeric" maxlength="4"
              value="${escA(vorschlag)}"></label>
     <label class="dlg-feld">Stand
       <input type="text" id="njStand" placeholder="Bleibt frei, wenn nichts eingetragen wird"></label>`
    +(anzahl
      ? `<label class="dlg-haken"><input type="checkbox" id="njTitel" checked>
           <span>Die ${anzahl} Titel aus Jahrgang ${escA(vorlage)} übernehmen –
           mit Nummer, vollem Namen, Kennfarbe und Auflage</span></label>
         <div class="pr-hinw">Die Auflagen sind zunächst die des Jahrgangs
           ${escA(vorlage)} und wollen geprüft werden; sie unterscheiden sich
           von Jahr zu Jahr. Geändert werden sie über den farbigen Titelkopf
           in der Bearbeiten-Ansicht.</div>`
      : `<div class="pr-hinw">Der gezeigte Jahrgang führt keine Titel, die zu
           übernehmen wären.</div>`)
    +(kAnzahl
      ? `<label class="dlg-haken"><input type="checkbox" id="njKongresse" checked>
           <span>Die ${kAnzahl} Kongresse aus Jahrgang ${escA(vorlage)} übernehmen –
           ohne Termin und ohne Heftzuordnung</span></label>
         <div class="pr-hinw">Name und Ort kommen mit; Zeitraum und Anlage in ein
           Heft bleiben offen und wollen recherchiert werden. Welcher Titel den
           Kongress zuletzt führte, steht in der Kongressmatrix als Hinweis, bis
           eine Ausgabe dafür gewählt ist.</div>`
      : '')
    +`<div class="pr-stand">Hefte werden nicht übernommen: der Jahrgang
        entsteht leer und wird über »+ Ausgabe« gefüllt. Ein vollständiger
        Jahrgang ist über »Aus Excel-Vorlage laden« schneller angelegt.</div>`,
    'Anlegen', ()=>jahrgangAnlegenAusfuehren(vorlage));
}

async function jahrgangAnlegenAusfuehren(vorlage){
  const feld = document.getElementById('njJahr');
  const y = feld ? feld.value.trim() : '';
  const standFeld = document.getElementById('njStand');
  const haken = document.getElementById('njTitel');
  if(!/^\d{4}$/.test(y))
    return ladeStand('Das Jahr wird vierstellig erwartet, etwa 2028.', true);
  if(DATEN[y])
    return ladeStand(`Jahrgang ${y} ist bereits angelegt.`, true);
  ladeKnoepfe(true);
  ladeStand(`Jahrgang ${y} wird angelegt …`);
  try{
    await dbAnfrage('/rest/v1/jahrgang', {method:'POST',
      headers:{Prefer:'return=minimal'},
      body: JSON.stringify({jahr:y, stand: standFeld ? standFeld.value.trim() : ''})});
    const titel = (haken && haken.checked && DATEN[vorlage]) ? DATEN[vorlage].titel : [];
    if(titel.length){
      // Scheitert der zweite Schritt, bliebe sonst ein Jahrgang ohne Titel
      // zurueck und ein neuer Versuch liefe auf den Primaerschluessel.
      try{
        await dbAnfrage('/rest/v1/titel', {method:'POST',
          headers:{Prefer:'return=minimal'},
          body: JSON.stringify(titel.map(t=>({jahr:y, id:t.id, kurz:t.short,
            voll:t.full, auflage:t.auflage||0, hex:t.hex||'#00285a', rubriken:t.rubriken||[]})))});
      }catch(fehler){
        try{
          await dbAnfrage('/rest/v1/jahrgang?jahr=eq.'+encodeURIComponent(y),
            {method:'DELETE', headers:{Prefer:'return=minimal'}});
        }catch(e2){}
        throw fehler;
      }
    }
    const kHaken = document.getElementById('njKongresse');
    if(KONG_TABELLEN && kHaken && kHaken.checked && DATEN[vorlage]){
      ladeStand(`Jahrgang ${y}: Kongresse werden übernommen …`);
      await kongresseAusVorjahrUebernehmen(y, vorlage);
    }
    DATEN = await datenHolen();
    dialogSchliessen();
    waehleJahrgang(y);
    // Der neue Jahrgang ist leer; gearbeitet wird jetzt in der Arbeitsansicht.
    bearbOffen = true;
    render();
    sicherungenHolen();
  }catch(fehler){ ladeStand(fehlertext(fehler), true); ladeKnoepfe(false); }
}

// ── Kongresse umstellen ─────────────────────────────────────────────────────
// Einmal je Jahrgang. Der Bericht zeigt vorher, was auffaellt, und bereinigt
// nichts von selbst: zwei Schreibweisen desselben Kongresses zusammenzufuehren
// ist eine Entscheidung, keine Rechnung.

function kongressBefunde(y){
  const j = DATEN[y] || {titel:[]};
  const saetze = j.kongresse || [];
  const zaehl = new Map();
  j.titel.forEach(t=>t.issues.forEach(iss=>
    [...(iss.a||[]), ...(iss.b||[])].forEach(id=>zaehl.set(id,(zaehl.get(id)||0)+1))));

  // Aehnliche Schreibweisen: gleicher Zeitraum und gleicher Ort, aber zwei
  // Saetze. Genau so steht der AEK-Kongress 2027 zweimal da.
  const nachTermin = new Map();
  saetze.forEach(k=>{
    const schl = (k.von||k.unscharf||'') + '|' + (k.ort||'');
    if(!schl.replace('|','')) return;
    if(!nachTermin.has(schl)) nachTermin.set(schl, []);
    nachTermin.get(schl).push(k);
  });
  const doppelt = [...nachTermin.values()].filter(g=>g.length>1);

  // Zuordnungen, die zeitlich nicht aufgehen. Geprueft wird gegen das Heft, an
  // dem der Eintrag haengt, nicht gegen den Jahrgang: ein Bericht ueber einen
  // Kongress des Vorjahres ist richtig und haeufig, ein Bericht ueber einen
  // Kongress von vor dreizehn Monaten nicht.
  //
  // Nachgemessen am Jahrgang 2027: zwischen Kongressende und Anzeigenschluss
  // des berichtenden Hefts liegen ueblicherweise 3 bis 70 Tage (Median 30),
  // zwischen Erscheinen und Kongressbeginn beim Ausliegen 11 bis 99 (Median 33).
  // Die Schwelle von 180 Tagen liegt weit ueber beidem und trifft im Bestand
  // genau zwei Stellen - beide sind echte Fehler: der MDS-Eintrag mit dem
  // Termin aus 2026 und der Anzeigenschluss "25.10.2927" bei Im Fokus Heft 11.
  const SCHWELLE = 180;
  const tage = (a,b) => Math.round((new Date(a) - new Date(b)) / 864e5);
  const fremd = [];
  j.titel.forEach(t=>t.issues.forEach(iss=>{
    const pruefe = (id, art) => {
      const k = saetze.find(x=>x.id===id);
      if(!k || !k.von) return;                      // ohne Termin nichts zu pruefen
      const d = art==='bericht'
        ? (iss.as ? tage(iss.as, k.bis || k.von) : null)   // Kongress, dann Redaktion
        : (iss.et ? tage(k.von, iss.et)          : null);  // Heft, dann Kongress
      if(d === null || (d >= 0 && d <= SCHWELLE)) return;
      fremd.push({k, art, titel:t.short, heft:iss.heft, tage:d});
    };
    (iss.a||[]).forEach(id=>pruefe(id,'auslage'));
    (iss.b||[]).forEach(id=>pruefe(id,'bericht'));
  }));

  const ohneTermin = saetze.filter(k=>!k.von && !k.unscharf);
  return {saetze, zaehl, doppelt, fremd, ohneTermin,
          zuordnungen: [...zaehl.values()].reduce((n,x)=>n+x,0)};
}

async function kongresseUmstellen(){
  schliesseDaten();
  const y = jahrgang();
  const b = kongressBefunde(y);
  const zeile = (t,w) => `<tr><td>${t}</td><td>${w}</td></tr>`;
  let html = `<div class="pr-jahr"><b>${esc(y)}</b> <span>`
    + (DATEN[y] && DATEN[y].umgestellt ? 'bereits umgestellt, wird neu aufgebaut'
                                       : 'wird umgestellt') + `</span></div>`
    + `<table class="pr-tab"><tbody>`
    + zeile('Kongresse', b.saetze.length)
    + zeile('Zuordnungen zu Ausgaben', b.zuordnungen)
    + `<tr${b.ohneTermin.length?' class="pr-merk"':''}><td>ohne Zeitraum</td><td>${b.ohneTermin.length}</td></tr>`
    + `</tbody></table>`;
  if(b.doppelt.length)
    html += `<div class="pr-warn"><div class="pr-warn-kopf">Gleicher Zeitraum, gleicher Ort &ndash; zwei Schreibweisen</div>`
      + b.doppelt.map(g=>g.map(k=>esc(k.lang)).join('<br>')).join('<hr>')
      + `<br>Sie bleiben zwei Kong&shy;resse. Zusammengef&uuml;hrt wird von Hand.</div>`;
  if(b.fremd.length)
    html += `<div class="pr-warn"><div class="pr-warn-kopf">Zeitlich nicht schl&uuml;ssig</div>`
      + b.fremd.map(f=>esc(f.k.lang) + ' &middot; ' + esc(kongressZeitraum(f.k))
          + '<br><span class="pr-klein">' + esc(f.titel) + ' Heft ' + esc(f.heft)
          + ' &middot; ' + (f.art==='bericht'
              ? (f.tage<0 ? 'Anzeigenschluss ' + Math.abs(f.tage) + ' Tage vor Kongressende'
                          : 'Bericht ' + f.tage + ' Tage nach dem Kongress')
              : (f.tage<0 ? 'Heft erscheint ' + Math.abs(f.tage) + ' Tage nach Kongressbeginn'
                          : 'Auslage ' + f.tage + ' Tage nach Erscheinen'))
          + '</span>').join('<br>') + `</div>`;
  html += `<div class="pr-stand">Die beiden Spalten an der Ausgabe bleiben stehen und werden weiter mitgeschrieben.</div>`;

  dialogZeigen('Kongresse umstellen', html, 'Übernehmen',
    () => kongresseUmstellenAusfuehren(y), b.doppelt.length>0 || b.fremd.length>0);
}

  if(jahrgaenge().length<2) return;      // der letzte bleibt
  if(!await bearbFrei()) return;
  const y=jahr, d=DATEN[y];
  const ausgaben=d.titel.reduce((s,j)=>s+j.issues.length,0);
  const eintr=d.titel.reduce((s,j)=>s+j.issues.reduce((n,i)=>n+i.a.length+i.b.length,0),0);
  const sicher=sicherungen.length;
  dialogZeigen(`Jahrgang ${y} entfernen`,
    `<div class="pr-warn"><div class="pr-warn-kopf">Dieser Jahrgang wird aus der Datei entfernt</div>`
    +`<b>${d.titel.length} Titel</b> · <b>${ausgaben} Ausgabe${ausgaben===1?'':'n'}</b> · `
    +`<b>${eintr} Kongresseintr${eintr===1?'ag':'äge'}</b><br>`
    +`Die Sicherungspunkte dieses Jahrgangs gehen mit. Ein Weg zurück bleibt danach nicht.</div>`
    +`<div class="pr-stand">Danach bleiben: ${jahrgaenge().filter(x=>x!==y).join(' · ')}. `
    +`Bereits versendete Kopien und Ausdrucke bleiben unberührt.</div>`,

}

async function jahrgangEntfernenAusfuehren(y){
  ladeKnoepfe(true);
  ladeStand(`Jahrgang ${y} wird entfernt …`);
  try{
    // Die Sicherungspunkte haengen nicht am Fremdschluessel und muessen eigens
    // weg - sonst blieben Schnappschuesse eines Jahrgangs zurueck, den es
    // nicht mehr gibt.
    await dbAnfrage('/rest/v1/sicherung?jahr=eq.'+encodeURIComponent(y),
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    // Den Jahrgang zu loeschen nimmt Titel und Ausgaben mit.
    await dbAnfrage('/rest/v1/jahrgang?jahr=eq.'+encodeURIComponent(y),
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    delete DATEN[y];
    dialogSchliessen();
    waehleJahrgang(jahrgaenge()[0]);
    sicherungenHolen();
  }catch(fehler){
    ladeStand(fehlertext(fehler), true);
    ladeKnoepfe(false);
  }
}

function xmlText(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
}

// HTML-Entitaeten aus dem Dokumentkopf in reinen Text wandeln
function nurText(s){
  return String(s).replace(/&middot;/g,'·').replace(/&raquo;/g,'»')
    .replace(/&laquo;/g,'«').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&amp;/g,'&');
}

// Excel rechnet Datumsangaben als Tage seit dem 30.12.1899. Ein fehlender
// Termin bleibt eine leere Zelle und faellt nicht auf dieses Grunddatum.
function excelDatum(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000);
}

function spaltenName(i){
  let s=''; i++;
  while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); }
  return s;
}

function zelle(ref,wert,art,stil){
  const s = stil ? ` s="${stil}"` : '';
  if(wert===null||wert===undefined||wert==='') return `<c r="${ref}"${s}/>`;
  if(art==='n') return `<c r="${ref}"${s}><v>${wert}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlText(wert)}</t></is></c>`;
}

function blattXml(breiten,vorspann,kopf,zeilen){
  let r=1; const aus=[];
  vorspann.forEach(v=>{ aus.push(`<row r="${r}">`+zelle('A'+r,v[0],'s',v[1])+`</row>`); r++; });
  aus.push(`<row r="${r}"/>`); r++;
  const kopfR=r;
  aus.push(`<row r="${r}" ht="28" customHeight="1">`+
    kopf.map((t,i)=>zelle(spaltenName(i)+r,t,'s',1)).join('')+`</row>`); r++;
  zeilen.forEach(z=>{
    aus.push(`<row r="${r}">`+z.map((c,i)=>zelle(spaltenName(i)+r,c.w,c.t||'s',c.s)).join('')+`</row>`);
    r++;
  });
  const letzte=Math.max(r-1,kopfR);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`+
    `<sheetViews><sheetView workbookViewId="0">`+
    `<pane ySplit="${kopfR}" topLeftCell="A${kopfR+1}" activePane="bottomLeft" state="frozen"/>`+
    `</sheetView></sheetViews>`+
    `<cols>`+breiten.map((b,i)=>`<col min="${i+1}" max="${i+1}" width="${b}" customWidth="1"/>`).join('')+`</cols>`+
    `<sheetData>`+aus.join('')+`</sheetData>`+
    `<autoFilter ref="A${kopfR}:${spaltenName(kopf.length-1)}${letzte}"/>`+
    `</worksheet>`;
}
