// ── Anfragen ────────────────────────────────────────────────────────────────

// Die Datenbank prueft den Ausstellungszeitpunkt der Sitzung gegen ihre
// eigene Uhr. Gehen die Uhren der beiden Supabase-Dienste ein paar Sekunden
// auseinander, gilt eine eben ausgestellte Sitzung als "in der Zukunft
// ausgestellt" und die Anfrage wird abgewiesen (PGRST303) - ohne dass sie
// ausgefuehrt wurde. Nach wenigen Sekunden ist der Zeitpunkt erreicht und
// dieselbe Sitzung gilt. Ein zweiter Versuch ist deshalb gefahrlos, auch bei
// schreibenden Anfragen, und erspart das Anmelden von Hand.
const ZU_FRUEH = /PGRST303|issued at future/i;

// Zuletzt gemessener Versatz in Sekunden: so lange braucht die Datenbank noch,
// bis sie die vorliegende Sitzung annimmt. Aus ihm ergibt sich die Wartezeit
// vor dem naechsten Versuch und der Wortlaut der Meldung.
let uhrVersatz = 0;

// Der Ausstellungszeitpunkt steht im Mittelteil der Sitzungskennung.
function sitzungIat(marke){
  try{
    const teil = String(marke).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(teil)).iat || 0;
  }catch(e){ return 0; }
}

async function dbAnfrageNetz(pfad, einstellungen = {}, mitSitzung = true){
  // Die Sitzung wird hier aufgefrischt, an der einen Stelle, durch die jede
  // Anfrage laeuft. Frueher stand die Zeile in dreizehn aufrufenden Funktionen
  // einzeln - beim Holen der Sicherungspunkte fehlte sie, und nach langer
  // Standzeit scheiterte allein dieser Weg an der abgelaufenen Sitzung.
  // Kein Rueckschlag in sich selbst: sitzungAuffrischen() ruft mit
  // mitSitzung = false.
  if(mitSitzung && !await sitzungAuffrischen())
    throw new Error('Die Sitzung ist abgelaufen.');
  for(let versuch = 0; ; versuch++){
    const kopf = {
      apikey: SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      ...(einstellungen.headers || {})
    };
    if(mitSitzung && sitzung && sitzung.access_token)
      kopf.Authorization = 'Bearer ' + sitzung.access_token;

    const antwort = await fetch(SUPABASE_URL + pfad, { ...einstellungen, headers: kopf });
    if(antwort.ok){
      // Auf "Prefer: return=minimal" antwortet die Datenbank je nach Verfahren
      // mit 204 ohne Rumpf oder mit 201 und leerem Rumpf. Ein leerer Rumpf ist
      // hier kein Fehler, sondern die Bestaetigung selbst - er darf nicht als
      // JSON gelesen werden.
      if(antwort.status === 204 || antwort.status === 205) return null;
      const rumpf = await antwort.text();
      return rumpf ? JSON.parse(rumpf) : null;
    }

    let text = '';
    try { text = await antwort.text(); } catch(e){}
    if(ZU_FRUEH.test(text) && versuch < 3){
      // Die Antwort traegt die Uhrzeit der Datenbank. Zusammen mit dem
      // Ausstellungszeitpunkt der Sitzung ergibt sich, wie lange sie noch
      // wartet - genauer als jede feste Staffel, die bei groesserem Versatz
      // zu frueh aufgibt. Fehlt die Kopfzeile, bleibt es bei 2 und 4 Sekunden.
      // Nach oben gedeckelt, damit das Werkzeug nicht minutenlang stillsteht;
      // reicht es nicht, nennt die Meldung den gemessenen Versatz. Der Kopf
      // traegt die Uhr des vorgelagerten Dienstes - liegt der Versatz weiter
      // hinten, misst sich hier 0 und es bleibt bei der Staffel.
      const datum = antwort.headers.get('Date');
      const marke = kopf.Authorization ? kopf.Authorization.slice(7) : '';
      const iat = sitzungIat(marke);
      let warten = [3000, 8000, 15000][versuch];
      if(datum && iat){
        const dbJetzt = Date.parse(datum) / 1000;
        if(dbJetzt) uhrVersatz = Math.max(0, Math.ceil(iat - dbJetzt));
        if(uhrVersatz) warten = Math.min(15000, (uhrVersatz + 1) * 1000);
      }
      await new Promise(w=>setTimeout(w, warten));
      continue;
    }
    const fehler = new Error(text || ('Antwort ' + antwort.status));
    fehler.status = antwort.status;
    throw fehler;
  }
}

// Die Sitzung laeuft nach einer Stunde ab. Vor jedem Laden wird sie
// aufgefrischt, wenn weniger als zwei Minuten bleiben – sonst bricht ein
// Ladevorgang mitten im Arbeiten ab.
async function sitzungAuffrischen(){
  if(!sitzung || !sitzung.refresh_token) return false;
  const rest = (sitzung.expires_at || 0) * 1000 - Date.now();
  if(rest > 120000) return true;
  try {
    const neu = await dbAnfrage('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', body: JSON.stringify({ refresh_token: sitzung.refresh_token }) }, false);
    sitzungSchreiben(neu);
    return true;
  } catch(e){
    sitzungSchreiben(null);
    return false;
  }
}

// ── Bestand holen und in die Form des Werkzeugs bringen ─────────────────────
// DATEN behaelt genau den Aufbau, den die Ansichten seit jeher erwarten:
//   DATEN[Jahrgang] = { stand, titel:[ {id,short,full,auflage,color,hex,issues} ] }
// Deshalb bleiben Ansichten, Suche, Druck und Excel-Ausgabe unberuehrt.

function inDatenForm(jahrgaenge, titel, ausgaben, kongresse, zuordnungen){
  const ergebnis = {};
  for(const j of jahrgaenge) ergebnis[j.jahr] = { stand: j.stand || '', titel: [] };

  const nachTitel = new Map();
  for(const t of [...titel].sort((a,b)=> a.jahr===b.jahr ? a.id-b.id : (a.jahr<b.jahr?-1:1))){
    if(!ergebnis[t.jahr]) continue;
    const eintrag = {
      id: t.id, short: t.kurz, full: t.voll, auflage: t.auflage,
      color: 'var(--j' + t.id + ')', hex: t.hex, issues: [],
      cover: t.cover || '',
      rubriken: (t.rubriken || []).map(r=>({id:r.id, name:r.name}))
    };
    ergebnis[t.jahr].titel.push(eintrag);
    nachTitel.set(t.jahr + '/' + t.id, eintrag);
  }

  for(const a of [...ausgaben].sort((x,y)=> x.reihenfolge - y.reihenfolge)){
    const t = nachTitel.get(a.jahr + '/' + a.titel_id);
    if(!t) continue;
    t.issues.push({
      id: a.id,                      // Zeilenkennung, nur zum Speichern
      reihenfolge: a.reihenfolge,    // Platz im Titel, ebenfalls nur intern
      heft: a.heft,
      et: a.erscheinung || '', as: a.anzeigenschluss || '',
      du: a.druckunterlagen || '', eh: a.anlieferung || '',
      a: kongresseZusammen(a.auslagen, a.berichte), b: [],
      // Ein Feld, hoechstens zwei Eintraege: die beiden Spalten sind Platz
      // eins und zwei derselben Liste. sonderthema fuehrt, weil es der
      // Eintrag ist, den jeder Titel hat.
      t: [a.sonderthema, a.thema].map(w=>(w||'').trim()).filter(Boolean),
      r: Object.assign({}, a.inhalte || {})   // Rubrik-Kennung -> Text
    });
  }
  // Umgestellte Jahrgaenge fuehren ihre Kongresse in eigenen Tabellen. Steht
  // dort noch keine Zeile, gelten weiter die beiden Spalten an der Ausgabe -
  // so laesst sich Jahrgang fuer Jahrgang umstellen, ohne dass das Werkzeug
  // zwischendurch eine unvollstaendige Anzeige liefert.
  const nachJahr = new Map();
  (kongresse||[]).forEach(k=>{
    if(!ergebnis[k.jahr]) return;
    if(!nachJahr.has(k.jahr)) nachJahr.set(k.jahr, []);
    nachJahr.get(k.jahr).push({id:k.id, lang:k.lang, kurz:k.kurz||'',
      von:k.von||null, bis:k.bis||null, unscharf:k.unscharf||'', ort:k.ort||'',
      dach:k.dach !== false, erwartet:k.erwartet||[]});
  });
  if(nachJahr.size){
    const jeAusgabe = new Map();
    (zuordnungen||[]).forEach(z=>{
      if(!jeAusgabe.has(z.ausgabe_id)) jeAusgabe.set(z.ausgabe_id, {a:[], b:[]});
      jeAusgabe.get(z.ausgabe_id)[z.art==='bericht'?'b':'a'].push(z.kongress_id);
    });
    // Die Reihenfolge innerhalb einer Ausgabe richtet sich nach dem Zeitraum
    // des Kongresses: die Zuordnungstabelle kennt keine.
    for(const [y, liste] of nachJahr){
      const rang = new Map(liste.map(k=>[k.id, kongSchluessel(k, y)]));
      const ordnen = ids => ids.sort((x,z)=>
        kongVergleich(rang.get(x), rang.get(z)));
      ergebnis[y].kongresse = liste;
      ergebnis[y].umgestellt = true;
      ergebnis[y].titel.forEach(t=>t.issues.forEach(iss=>{
        const z = jeAusgabe.get(iss.id) || {a:[], b:[]};
        iss.a = ordnen(z.a); iss.b = ordnen(z.b);
      }));
    }
  }
  // Ein Jahrgang ohne eine einzige Kongresszeile galt bisher als nicht
  // umgestellt - auch der eben angelegte, noch leere. Die Kongressansicht
  // verwies dort auf eine Umstellung, die es gar nicht zu machen gibt, und
  // ohne einen Weg zum ersten Kongress waere das Ausgabenformular eine
  // Sackgasse. Erreichbare Tabellen und kein Alttext an den Ausgaben genuegen
  // deshalb ebenso; ein Jahrgang ohne Ausgaben erfuellt das von selbst. Traegt
  // dagegen noch eine Ausgabe ihre Kongresse als Text - ein Excel-Eingang, bei
  // dem die Uebernahme scheiterte -, bleibt es beim Freitextweg.
  if(KONG_TABELLEN)
    Object.keys(ergebnis).forEach(y=>{
      const j = ergebnis[y];
      if(j.umgestellt) return;
      if(j.titel.some(t=>t.issues.some(iss=>
        (iss.a||[]).length || (iss.b||[]).length))) return;
      j.kongresse = [];
      j.umgestellt = true;
    });
  // Die uebrigen Jahrgaenge: Zeichenketten je Ausgabe, wie bisher.
  Object.keys(ergebnis).forEach(y=>kongressAufloesen(ergebnis[y]));
  return ergebnis;
}

// Die beiden Kongresstabellen duerfen fehlen: solange das Schema nicht
// eingespielt ist, antwortet die Schnittstelle mit einem Fehler, und der
// Jahrgang gilt schlicht als noch nicht umgestellt.
let KONG_TABELLEN = false;

async function datenHolen(){
  const [jahrgaenge, titel, ausgaben, kongresse, zuordnungen] = await Promise.all([
    dbAnfrage('/rest/v1/jahrgang?select=jahr,stand&order=jahr'),
    dbAnfrage('/rest/v1/titel?select=jahr,id,kurz,voll,auflage,hex&order=jahr,id'),
    dbAnfrage('/rest/v1/ausgabe?select=id,jahr,titel_id,reihenfolge,heft,erscheinung,'

             + '&order=jahr,von&limit=5000'),

  ]);
  return inDatenForm(jahrgaenge, titel, ausgaben, kongresse, zuordnungen);
}


// ── Kongresse in die Datenbank ──────────────────────────────────────────────
// Geschrieben wird aus dem Stand im Speicher heraus, im Ganzen und wiederholbar.
// Damit taugt dieselbe Funktion fuer die einmalige Umstellung eines Jahrgangs
// und fuer jeden Weg, der einen Jahrgang ersetzt (Excel-Eingang,
// Sicherungspunkt). Ein Abgleich Zeile fuer Zeile waere feiner, aber auch die
// Stelle, an der die beiden Bestaende auseinanderlaufen koennten - und genau das
// soll hier aufhoeren.

function istDbKennung(id){
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(id));
}

// Beim Anlegen eines neuen Jahrgangs: die Kongresse des Vorlage-Jahrgangs als
// leere Saetze anlegen (Name, Kurzname, Ort; kein Termin), dazu die
// Titelverteilung des Vorjahres als Hinweis "erwartet" - ohne Heft, denn der
// neue Jahrgang hat noch keine Ausgaben. Die Matrix markiert damit ein Feld
// als offene Arbeit, bis eine echte Zuordnung es abloest.
async function kongresseAusVorjahrUebernehmen(y, vorlageJahr){
  const alt = DATEN[vorlageJahr];
  if(!alt || !alt.kongresse || !alt.kongresse.length) return {saetze:0};

  const verteilung = new Map();   // Kongress-Kennung (Vorjahr) -> Set("titelId|art")
  alt.titel.forEach(t=>t.issues.forEach(iss=>{
    (iss.a||[]).forEach(kid=>{
      if(!verteilung.has(kid)) verteilung.set(kid,new Set());
      verteilung.get(kid).add(t.id+'|auslage');
    });
    (iss.b||[]).forEach(kid=>{
      if(!verteilung.has(kid)) verteilung.set(kid,new Set());
      verteilung.get(kid).add(t.id+'|bericht');
    });
  }));

  const zeilen = alt.kongresse.map(k=>({
    jahr:y, lang:k.lang, kurz:k.kurz||'', von:null, bis:null, unscharf:'', ort:k.ort||'',
    dach:k.dach !== false,
    erwartet: [...(verteilung.get(k.id)||[])].map(p=>{
      const [titel_id,art] = p.split('|');
      return {titel_id:Number(titel_id), art};
    })
  }));
  await dbAnfrage('/rest/v1/kongress',
    {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(zeilen)});
  return {saetze: zeilen.length};
}

async function kongresseUebernehmen(y){
  const j = DATEN[y];
  if(!j) throw new Error('Der Jahrgang ' + y + ' ist nicht geladen.');
  const saetze = j.kongresse || [];

  // Alles Alte weg: die Zuordnungen haengen an den Kongressen und gehen mit.
  await dbAnfrage('/rest/v1/kongress?jahr=eq.' + encodeURIComponent(y),
    {method:'DELETE', headers:{Prefer:'return=minimal'}});

  if(!saetze.length){ j.umgestellt = true; return {saetze:0, zuordnungen:0}; }

  const angelegt = await dbAnfrage('/rest/v1/kongress',
    {method:'POST', headers:{Prefer:'return=representation'},
     body: JSON.stringify(saetze.map(k=>({jahr:y, lang:k.lang, kurz:k.kurz||'',
       von:k.von||null, bis:k.bis||null, unscharf:k.unscharf||'', ort:k.ort||''})))});

  // Zugeordnet wird ueber den zusammengesetzten Wortlaut, nicht ueber die
  // Reihenfolge der Antwort: derselbe Wortlaut ist derselbe Kongress, und
  // zweimal derselbe kann es nicht geben - kongressAufloesen fasst sie zusammen.
  const nachText = new Map();
  (angelegt||[]).forEach(k=>nachText.set(kongressAus(k), k.id));
  const alteKennung = new Map();
  saetze.forEach(k=>{
    const neu = nachText.get(kongressAus(k));
    if(neu){ alteKennung.set(k.id, neu); k.id = neu; }
  });
  setzeKongresse(j);

  const zeilen = [];
  j.titel.forEach(t=>t.issues.forEach(iss=>{
    iss.a = (iss.a||[]).map(id=>alteKennung.get(id)||id);
    iss.b = (iss.b||[]).map(id=>alteKennung.get(id)||id);
    if(!iss.id) return;                       // Ausgabe ohne Zeilenkennung
    iss.a.forEach(id=>zeilen.push({kongress_id:id, ausgabe_id:iss.id, art:'auslage'}));
    iss.b.forEach(id=>zeilen.push({kongress_id:id, ausgabe_id:iss.id, art:'bericht'}));
  }));
  if(zeilen.length)
    await dbAnfrage('/rest/v1/kongress_ausgabe',
      {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(zeilen)});

  j.umgestellt = true;
  return {saetze:saetze.length, zuordnungen:zeilen.length};
}

// Eine einzelne Ausgabe. Neu entstandene Saetze bekommen zuerst ihre Kennung
// aus der Datenbank, danach werden die Zuordnungen dieser Ausgabe ersetzt.
async function zuordnungSchreiben(iss){
  const j = DATEN[jahr];
  if(!j || !j.umgestellt || !iss.id) return;

  const neue = [...new Set([...iss.a, ...iss.b])].filter(id=>!istDbKennung(id));
  if(neue.length){
    const saetze = neue.map(id=>KONG.get(id)).filter(Boolean);
    const angelegt = await dbAnfrage('/rest/v1/kongress',
      {method:'POST', headers:{Prefer:'return=representation'},
       body: JSON.stringify(saetze.map(k=>({jahr:jahr, lang:k.lang, kurz:k.kurz||'',
         von:k.von||null, bis:k.bis||null, unscharf:k.unscharf||'', ort:k.ort||'',
         dach:k.dach !== false})))});
    const nachText = new Map();
    (angelegt||[]).forEach(k=>nachText.set(kongressAus(k), k.id));
    saetze.forEach(k=>{
      const neuId = nachText.get(kongressAus(k));
      if(!neuId) return;
      const alt = k.id; k.id = neuId;
      KONG.delete(alt); KONG.set(neuId, k);
      iss.a = iss.a.map(x=>x===alt?neuId:x);
      iss.b = iss.b.map(x=>x===alt?neuId:x);
    });
  }

  await dbAnfrage('/rest/v1/kongress_ausgabe?ausgabe_id=eq.' + encodeURIComponent(iss.id),
    {method:'DELETE', headers:{Prefer:'return=minimal'}});
  const zeilen = [];
  iss.a.forEach(id=>zeilen.push({kongress_id:id, ausgabe_id:iss.id, art:'auslage'}));
  iss.b.forEach(id=>zeilen.push({kongress_id:id, ausgabe_id:iss.id, art:'bericht'}));
  if(zeilen.length)
    await dbAnfrage('/rest/v1/kongress_ausgabe',
      {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(zeilen)});
}

async function bestandLadenUndZeigen(){
  anmeldeMeldung('Die Heftplanung wird geladen …', true);
  const neu = await datenHolen();
  if(!Object.keys(neu).length)
    throw new Error('Die Datenbank enthält noch keinen Jahrgang.');
  DATEN = neu;
  starteAnsicht();
  document.getElementById('anmeldung').hidden = true;
  kontoAnzeige();
  netzhinweis('');
  anmeldeMeldung('');
}

async function anmeldenAbsenden(ereignis){
  ereignis.preventDefault();
  const knopf = document.getElementById('anmeldeKnopf');
  const mail  = document.getElementById('anmeldeMail').value.trim();
  const wort  = document.getElementById('anmeldeWort').value;
  knopf.disabled = true;
  anmeldeMeldung('Anmeldung läuft …', true);
  try {
    const neu = await dbAnfrage('/auth/v1/token?grant_type=password',
      { method:'POST', body: JSON.stringify({ email: mail, password: wort }) }, false);
    sitzungSchreiben(neu);
    document.getElementById('anmeldeWort').value = '';
    await bestandLadenUndZeigen();
  } catch(fehler){
    sitzungSchreiben(null);
    anmeldeMeldung(fehlertext(fehler));
  } finally {
    knopf.disabled = false;
  }
}

// Die Meldungen der Schnittstelle sind englisch und technisch. Die haeufigen
// Faelle bekommen deshalb einen eigenen, sachlichen Wortlaut.
function fehlertext(fehler){
  const roh = String(fehler && fehler.message || fehler);
  if(fehler && fehler.status === 400 && /credential/i.test(roh))
    return 'E-Mail oder Kennwort stimmen nicht.';
  if(fehler && fehler.status === 400 && /not confirmed/i.test(roh))
    return 'Das Konto ist noch nicht bestätigt.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(roh))
    return 'Die Datenbank ist nicht erreichbar. Besteht eine Netzverbindung?';
  if(ZU_FRUEH.test(roh))
    return 'Die Uhren von Anmeldung und Datenbank gehen '
         + (uhrVersatz ? 'etwa ' + uhrVersatz + ' Sekunden' : 'einige Sekunden')
         + ' auseinander; die Sitzung gilt der Datenbank noch als zu früh '
         + 'ausgestellt. In '
         + (uhrVersatz ? 'etwa ' + uhrVersatz + ' Sekunden' : 'einer knappen Minute')
         + ' kann der Abruf erneut versucht werden, verlässlich hilft ein '
         + 'Neuladen der Seite. Eine neue Anmeldung ändert nichts – sie stellt '
         + 'die Sitzung nur noch einmal aus.';
  return roh;
}

function abmelden(){
  schliesseDaten();
  sitzungSchreiben(null);
  kontoAnzeige();
  DATEN = {};
  document.getElementById('anmeldung').hidden = false;
  const w = document.getElementById('anmeldeWort'); if(w) w.value = '';
  anmeldeMeldung('');
}

// Beim Oeffnen: liegt eine gueltige Sitzung vor, wird ohne Zutun geladen.
async function starteArbeitsfassung(){
  sitzung = sitzungLesen();
  if(!sitzung){ anmeldeMeldung(''); return; }
  if(!await sitzungAuffrischen()){
    anmeldeMeldung('Die Sitzung ist abgelaufen. Eine erneute Anmeldung ist erforderlich.');
    return;
  }
  try {
    await bestandLadenUndZeigen();
  } catch(fehler){
    anmeldeMeldung(fehlertext(fehler));
  }
}
