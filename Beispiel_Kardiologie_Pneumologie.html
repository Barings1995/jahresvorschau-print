// ─── Kongressmatrix ─────────────────────────────────────────────────────────
// Vom Kongress her statt von der Ausgabe her: eine Zeile je Kongress, eine
// Spalte je Titel. Kein Vorschlag - das Feld zeigt nur, was schon zugeordnet
// ist; verteilt wird von Hand ueber die Heftwahl.

// ── Deutschsprachiger Raum ─────────────────────────────────────────────────
// Ein Merkmal am Kongresssatz, gesetzt im Dialog "Kongress bearbeiten". Zuvor
// las diese Stelle das Ortsfeld gegen zwei Ortslisten - das ging an drei
// Stellen daneben: bei leerem Ortsfeld (im Jahrgang 2026 fuenfundzwanzig von
// einundvierzig Saetzen), bei einem Ort, den keine Liste fuehrt, und bei einem
// Anhang am Namen ("New York City", "Orlando (FL)"). Wer den Kongress anlegt,
// weiss es dagegen sicher.
//
// Fehlt das Merkmal - eine Sicherung von vor dieser Spalte, eine aeltere Kopie
// im Dokument -, gilt der Kongress als deutschsprachig und bleibt stehen.
// Ausgeblendet wird allein, was ausdruecklich anders gekennzeichnet ist.
function kongDach(k){ return !k || k.dach !== false; }

// Wie mxArtSetzen: die offene Heftleiste faellt weg, denn sie kann zu einer
// Zeile gehoeren, die der Schalter im selben Zug wegnimmt.
function mxDachSetzen(b){
  if(mxNurDach===!!b) return;
  mxNurDach = !!b;
  mxAuswahl = null;
  bearbStandText=''; bearbStandArt='';
  mxRollZurueck = true;
  mxSchalterHalten = true;
  render();
  mxSchalterGleiten();
}

// Der Schalter entsteht mit dem Zeichnen neu und stuende ohne Zutun sofort in
// der Endstellung. Die Klasse "zurueck" haelt sein Bild am Ausgangspunkt fest;
// wird sie genommen, laeuft der Knebel hinueber.
//
// Dass die Klasse schon im Markup steht (mxSchalterHalten) und nicht erst hier
// gesetzt wird, ist der Kern der Sache: das Zeichnen passt am Ende die Hoehe
// der Rollfelder an und misst dafuer die Seite. Beim Messen bestimmt der
// Browser den Stil des frischen Schalters - und zwar in der Endstellung, wenn
// die Klasse da noch fehlt. Ein erster Stand, der erst danach gesetzt wird,
// taugt nicht mehr als Ausgangspunkt: der Knebel zuckte ein wenig zurueck und
// gleich wieder vor, statt zu gleiten.
//
// Genommen wird die Klasse zwei Bildlagen spaeter. Eine einzelne genuegt
// nicht - bei Rechnern, die zwischendurch nicht zeichnen, faenden Entstehen
// und Loesen sonst in derselben Lage statt.
function mxSchalterGleiten(){
  const s = document.querySelector('.mx-kopf .switch.zurueck');
  if(!s) return;
  const loesen = ()=>s.classList.remove('zurueck');
  if(typeof requestAnimationFrame !== 'function') return loesen();
  requestAnimationFrame(()=>requestAnimationFrame(loesen));
  // Ruht das Zeichnen - ein Fenster im Hintergrund -, laufen keine Bildlagen,
  // und der Schalter bliebe in der alten Stellung stehen. Nach einem
  // Wimpernschlag faellt die Klasse deshalb auf jeden Fall. Zu sehen ist davon
  // nichts: laeuft das Zeichnen, sind die beiden Lagen laengst durch.
  setTimeout(loesen, 400);
}

function mxZeilen(){
  const j = DATEN[jahr];
  const alle = (j && j.kongresse) || [];
  const gezeigt = mxNurDach ? alle.filter(kongDach) : alle;
  const mit  = gezeigt.filter(k=>k.von).sort((a,b)=>
    a.von===b.von ? (a.bis||'').localeCompare(b.bis||'') : a.von.localeCompare(b.von));
  const ohne = gezeigt.filter(k=>!k.von).sort((a,b)=>
    (a.unscharf||a.lang).localeCompare(b.unscharf||b.lang,'de'));
  return {ohne, mit, gesamt: alle.length, weg: alle.length - gezeigt.length};
}

// Alle (Heft, Art)-Paare eines Titels zu einem Kongress - bewusst ueber beide
// Arten hinweg, obwohl die Matrix nur eine zeigt. Ausgewertet wird das naemlich
// auch von der Loeschsperre in mxKongDialog: filterte diese Funktion nach
// mxArt, liesse sich ein Kongress, der nur Berichte traegt, aus der
// Auslagenansicht heraus entfernen - samt seiner Berichte. Gefiltert wird
// deshalb erst dort, wo tatsaechlich gezeichnet wird.
function mxZelle(k, t){
  const treffer = [];
  t.issues.forEach(iss=>{
    if((iss.a||[]).includes(k.id)) treffer.push({heft:iss.heft, art:'auslage'});
    if((iss.b||[]).includes(k.id)) treffer.push({heft:iss.heft, art:'bericht'});
  });
  return treffer;
}

const MX_AUSLAGE = '<svg width="7" height="7" viewBox="0 0 10 10" aria-hidden="true"><polygon points="0,0 10,5 0,10" fill="var(--accent)"/></svg>';
const MX_BERICHT = '<svg width="6" height="6" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="1" fill="var(--navy)"/></svg>';
// Hohle Fassung derselben Zeichen: die vom Vorjahr erwartete Titelverteilung,
// solange noch kein Heft dafuer steht.
const MX_AUSLAGE_OFFEN = '<svg width="7" height="7" viewBox="0 0 10 10" aria-hidden="true"><polygon points="0.8,1.2 9,5 0.8,8.8" fill="none" stroke="var(--muted)" stroke-width="1.3"/></svg>';
const MX_BERICHT_OFFEN = '<svg width="6" height="6" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.8" y="0.8" width="8.4" height="8.4" rx="1" fill="none" stroke="var(--muted)" stroke-width="1.3"/></svg>';

// Welche vom Vorjahr erwarteten (Titel, Art)-Paare dieses Kongresses noch
// kein Heft tragen. Nur diese - nicht jedes leere Feld - gelten als offene
// Arbeit; ein leeres Feld ohne Erwartung ist schlicht nicht vorgesehen.
function mxErwartetOffen(k, t){
  const erwartet = (k.erwartet||[])
    .filter(e=>e.titel_id===t.id && e.art===mxArt).map(e=>e.art);
  if(!erwartet.length) return [];
  const belegt = new Set(mxZelle(k,t).map(x=>x.art));
  return [...new Set(erwartet)].filter(art=>!belegt.has(art));
}

function mxZeitraum(k){ return kongressZeitraum(k); }

// Die Titelfarbe als schwacher Flaechenton: dieselbe Farbe mit acht Prozent
// Deckung. Traegt ein Titel etwas anderes als sechs Hexziffern - von Hand
// gepflegt oder aus einer aelteren Zeile -, bleibt die Spalte lieber farblos
// als dass eine unfertige Farbangabe die ganze Regel verwirft.
function mxTon(hex){
  return /^#[0-9a-f]{6}$/i.test(hex||'') ? hex+'14' : 'transparent';
}

function mxZeileHtml(k, offen){
  const zellen = JOURNALS.map(t=>{
    // Gezeichnet wird ueber die Hefte statt ueber mxZelle: das Feld nennt
    // neben dem Heft auch dessen Termin, und den fuehrt allein die Ausgabe.
    const chips = t.issues.filter(iss=>
        ((mxArt==='auslage' ? iss.a : iss.b)||[]).includes(k.id))
      .map(iss=>{
        const termin = mxHeftTermin(iss);
        return `<span class="kmx-chip zwei" title="${escA(
          (mxArt==='auslage'?'ET ':'AS ')+fmt(termin))}"><span class="kz1">${
          mxArt==='auslage'?MX_AUSLAGE:MX_BERICHT}${esc(iss.heft)}</span><span class="kz2">${
          esc(mxKurzTermin(termin))}</span></span>`;
      }).join('');
    const erw = mxErwartetOffen(k,t).map(art=>
      `<span class="mx-erwartet" title="${art==='auslage'?'Auslage':'Bericht'} vom Vorjahr erwartet, noch kein Heft">${
        art==='auslage'?MX_AUSLAGE_OFFEN:MX_BERICHT_OFFEN}</span>`).join('');
    const on = offen && offen.kongressId===k.id && offen.titelId===t.id;
    return `<td style="text-align:center"><div class="mx-zelle${on?' offen':''}" role="button" tabindex="0"
      onclick="mxOeffnen('${k.id}',${t.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
      title="${escA(t.short+' \u00b7 '+k.lang)}"
      aria-label="${escA(t.short)}, ${escA(k.lang)}">${chips}${erw}</div></td>`;
  }).join('');
  const hauptzeile = `<tr><td class="mx-lbl"><div class="mx-lblklick" role="button" tabindex="0"
      onclick="mxOeffnenKongress('${k.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
      title="Name, Zeitraum und Ort dieses Kongresses bearbeiten">
      <div class="mx-name">${esc(k.lang)}</div>
      <div class="mx-info">${esc(mxZeitraum(k))}${k.ort?' · '+esc(k.ort):''}</div>
    </div></td>${zellen}</tr>`;
  // Die Heftwahl klappt direkt unter dieser Zeile auf statt in einem
  // gemeinsamen Panel ganz unten - bei vielen Kongressen sonst weit weg vom
  // Klick. Nur eine Zeile ist je Kongress offen (mxAuswahl ist ein Singleton).
  const auf = offen && offen.kongressId===k.id ? JOURNALS.find(x=>x.id===offen.titelId) : null;
  const inline = auf ? `<tr id="mxInline"><td colspan="${JOURNALS.length+1}" class="mx-inline-zelle">
      ${mxHeftwahlHtml(k, auf)}
    </td></tr>` : '';
  return hauptzeile + inline;
}

// Der Ansichtsumschalter wird hereingereicht und steht in derselben Zeile wie
// Zaehlung, Art-Umschalter und "+ Neuer Kongress". Stuende er wie in der
// Ausgabenansicht als eigener Block darueber, bliebe links davon eine leere
// Bank, und die Tabelle saesse 55 statt 14 Pixel unter dem Umschalter.
// Hoehe des Rollfelds der Kongressmatrix: genau bis zum Fensterrand, damit die
// Seite selbst nicht mitrollt und nicht zwei Rollbalken nebeneinander stehen.
// Gemessen statt als fester Abzug im Stylesheet, weil die Hoehe darueber nicht
// feststeht: die Kopfleiste bricht bei schmalerem Fenster in zwei Zeilen um,
// die Webschriften kommen erst nach dem ersten Zeichnen, und die Notiz nach
// dem Speichern steht nur einen Durchgang lang da. Der feste Abzug in .mx-scroll
// traf das nur bei einer Breite und liess die Seite sonst 8 bis 50 px mitrollen.
// Unter dem Feld zaehlt, was bis zum Ende von main folgt (dessen Innenabstand);
// das haengt, anders als die Seitenhoehe, nicht davon ab, wie hoch das Feld
// gerade ist. Die Mindesthoehe bleibt: im sehr flachen Fenster rollt die Seite.
function mxHoeheAnpassen(){
  const mx = document.querySelector('.mx-scroll');
  if(!mx) return;
  const main = document.querySelector('main');
  const r = mx.getBoundingClientRect();
  const unten = main.getBoundingClientRect().bottom - r.bottom;
  const hoehe = Math.floor(innerHeight - (r.top + scrollY) - unten);
  mx.style.maxHeight = Math.max(340, hoehe) + 'px';
  // Fuellt die Tabelle das Feld, liegt die Linie ihrer letzten Zeile (ganz
  // nach unten gerollt) direkt auf dem Rahmen - zwei Striche uebereinander.
  // Dann entfaellt sie; den Abschluss zeichnet der Rahmen. Bleibt darunter
  // Platz (wenige Kongresse, Mindesthoehe), schliesst sie die Tabelle ab und
  // bleibt stehen. Erst ohne Kennzeichen messen, sonst zaehlte die schon
  // weggenommene Linie mit.
  mx.classList.remove('mx-voll');
  const tab = mx.querySelector('.mx-tab');
  if(tab && tab.offsetHeight >= mx.clientHeight) mx.classList.add('mx-voll');
}
// Dasselbe fuer die Ausgabenliste links in der Ausgabenansicht. Die feste
// Hoehe von 74vh liess mit Kopfleiste, Umschalter und dem Knopf "+ Neuen Titel
// anlegen" darunter die Seite 100 bis 200 px mitrollen. Unter der Liste zaehlt
// hier nur, was in ihrer eigenen Spalte folgt (der Knopf), und der Innenabstand
// von main - nicht das Ende von main: das richtet sich nach der rechten Spalte,
// und ein langes Formular dort liesse die Liste sonst auf die Mindesthoehe
// schrumpfen.
function listeHoeheAnpassen(){
  const liste = document.querySelector('.bearb-liste');
  if(!liste) return;
  const spalte = liste.closest('.bearb-spalte');
  const r = liste.getBoundingClientRect();
  const unten = spalte.getBoundingClientRect().bottom - r.bottom
    + parseFloat(getComputedStyle(document.querySelector('main')).paddingBottom);
  const hoehe = Math.floor(innerHeight - (r.top + scrollY) - unten);
  liste.style.maxHeight = Math.max(300, hoehe) + 'px';
}
// Die rechte Spalte endet auf derselben Linie wie die linke: am Fensterrand,
// abzueglich des Innenabstands von main. Im sehr flachen Fenster, wo die Liste
// auf ihrer Mindesthoehe steht, richtet sie sich nach der linken Spalte, damit
// beide Unterkanten weiter auf einer Linie liegen. Laeuft deshalb nach
// listeHoeheAnpassen().
function rechtsHoeheAnpassen(){
  const rechts = document.querySelector('.bearb-rechts');
  if(!rechts) return;
  const spalte = document.querySelector('.bearb-spalte');
  const r = rechts.getBoundingClientRect();
  const unten = parseFloat(getComputedStyle(document.querySelector('main')).paddingBottom);
  const hoehe = Math.floor(innerHeight - (r.top + scrollY) - unten);
  const links = spalte ? Math.ceil(spalte.getBoundingClientRect().height) : 340;
  rechts.style.maxHeight = Math.max(links, hoehe) + 'px';
}
function rollfelderAnpassen(){ mxHoeheAnpassen(); listeHoeheAnpassen(); rechtsHoeheAnpassen(); }
window.addEventListener('resize', rollfelderAnpassen);
if(document.fonts) document.fonts.ready.then(rollfelderAnpassen);

function renderKongressmatrix(umschalter){
  const kopfZeile = rechts =>
    `<div class="mx-kopf">${umschalter}<div class="mx-kopf-re">${rechts}</div></div>`;
  const j = DATEN[jahr];
  if(!j || !j.umgestellt)
    return kopfZeile('') + `<div class="bearb-leerhinweis" style="padding:20px 0">Dieser Jahrgang ist noch nicht auf eigene Kongresssätze umgestellt.
      Über <b>Daten &rarr; Kongresse umstellen</b> lässt sich das nachholen.</div>`;
  const {ohne, mit, gesamt, weg} = mxZeilen();
  const neuKnopf = `<button type="button" class="bearb-zu" onclick="mxKongNeu()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Neuer Kongress</button>`;
  // Der Schalter steht im Aufbau der Legendenzeile - dieselbe Sache, dieselbe
  // Form. Der Titel nennt beides: was wegfaellt und was bewusst stehen bleibt.
  // Kommt das Zeichnen vom Schalter selbst, entsteht er in seiner alten
  // Stellung und laeuft erst danach hinueber - siehe mxSchalterGleiten.
  const halten = mxSchalterHalten; mxSchalterHalten = false;
  const dachSchalter = `<label class="switch${halten?' zurueck':''}" title="Blendet die Kongresse aus, bei denen im Dialog »Kongress bearbeiten« das Häkchen für Deutschland, Österreich und die Schweiz nicht gesetzt ist"><input type="checkbox"${
    mxNurDach?' checked':''} onchange="mxDachSetzen(this.checked)"><span class="sw-track"><span class="sw-knob"></span></span>Nur deutschsprachiger Raum</label>`;
  // Bleibt nach dem Schalten nichts uebrig, muss er trotzdem in der Zeile
  // stehen - sonst liesse er sich nicht mehr loesen.
  if(!ohne.length && !mit.length)
    return kopfZeile(`${weg?dachSchalter:''}${neuKnopf}`) + `<div class="bearb-leerhinweis" style="padding:20px 0">${
      weg ? `Kein Kongress des Jahrgangs liegt im deutschsprachigen Raum \u2014 der Schalter oben nimmt ${
             weg===1?'den einen':`alle ${weg}`} aus der Tabelle.`
          : 'Der Jahrgang führt noch keine Kongresse.'}</div>`;

  // Gezaehlt wird nur, was die Ansicht auch zeigt - eine Zahl, die zur Haelfte
  // unsichtbare Felder mitfuehrt, orientiert nicht, sie verwirrt. Das gilt seit
  // dem Schalter auch fuer die weggeblendeten Zeilen: gezaehlt werden allein
  // die Felder der Kongresse, die in der Tabelle stehen.
  const sichtbar = new Set([...ohne, ...mit].map(k=>k.id));
  const belegt = JOURNALS.reduce((s,t)=>s+t.issues.reduce((n,iss)=>
    n + ((mxArt==='auslage' ? iss.a : iss.b)||[]).filter(id=>sichtbar.has(id)).length, 0), 0);
  // Zaehlung fuer den Kopf: nur Felder mit einer noch offenen Erwartung aus
  // dem Vorjahr - erscheint erst, sobald es sie gibt.
  let offeneFelder = 0;
  [...ohne, ...mit].forEach(k=>JOURNALS.forEach(t=>{
    if(mxErwartetOffen(k,t).length) offeneFelder++;
  }));
  // Der farbige Strich als Innenschatten, nicht als Rand: die Kopfzeile klebt,
  // und ein Rand bliebe bei border-collapse an seinem Platz stehen.
  const kopf = `<tr><th class="mx-lbl">Kongress</th>${JOURNALS.map((t,i)=>
    `<th style="box-shadow:inset 0 -2px 0 ${escA(t.hex)}${
      i ? ',inset 1px 0 0 var(--mxlinie)' : ''}">${
      esc(t.short)}</th>`).join('')}</tr>`;
  // Jede Titelspalte traegt ihren Ton bis nach unten durch. Ueber die
  // Spaltengruppe statt ueber jede Zelle: eine Zeile je Spalte statt sechs
  // Angaben je Kongresszeile, und die Breiten bleiben unberuehrt. Der Ton ist
  // bewusst schwach - er hilft beim Zielen, tragen muss ihn die Kopfzeile.
  // Zwei der sechs Farben liegen ohnehin dicht beieinander.
  const spaltenTon = `<colgroup><col>${JOURNALS.map(t=>
    `<col style="background:${escA(mxTon(t.hex))}">`).join('')}</colgroup>`;

  let zeilen = '';
  if(ohne.length){
    zeilen += `<tr><td colspan="${JOURNALS.length+1}" class="mx-gruppe">
      <span class="mx-warn">Termin fehlt — noch zu recherchieren</span></td></tr>`;
    zeilen += ohne.map(k=>mxZeileHtml(k, mxAuswahl)).join('');
  }
  if(mit.length){
    if(ohne.length) zeilen += `<tr><td colspan="${JOURNALS.length+1}" class="mx-gruppe">Nach Zeitraum sortiert</td></tr>`;
    zeilen += mit.map(k=>mxZeileHtml(k, mxAuswahl)).join('');
  }

  // Der Jahrgang steht hier nicht noch einmal: der Titel im Kopf fuehrt ihn
  // bereits, daneben das Etikett "Bearbeiten".
  // Die Notiz gilt fuer einen Durchgang: sie erklaert die eben gespeicherte
  // Zeile, die der Schalter im selben Zug weggenommen hat, und ist danach fort.
  const notiz = mxNotiz ? `<div class="mx-notiz">${esc(mxNotiz)}</div>` : '';
  mxNotiz = '';
  return kopfZeile(`<div class="mx-zahl">${
          weg ? `${ohne.length+mit.length} von ${gesamt} Kongressen`
              : `${ohne.length+mit.length} Kongresse`} &middot; ${belegt} ${
          mxArt==='auslage'?'Auslagen':'Berichte'}${
          offeneFelder ? ` &middot; ${offeneFelder} aus dem Vorjahr offen` : ''}</div>
        ${dachSchalter}
        ${mxArtUmschalterHtml()}
        ${neuKnopf}`) + notiz +
    `<div class="mx-scroll"><table class="mx-tab">
      ${spaltenTon}<thead>${kopf}</thead><tbody>${zeilen}</tbody>
    </table></div>`;
}

// ── Heftwahl ────────────────────────────────────────────────────────────────
function mxOeffnen(kongressId, titelId){
  mxAuswahl = (mxAuswahl && mxAuswahl.kongressId===kongressId && mxAuswahl.titelId===titelId)
    ? null : {kongressId, titelId};
  render();
  if(mxAuswahl){
    const z=document.getElementById('mxInline');
    if(z) z.scrollIntoView({block:'nearest'});
  }
}

function mxSchliessen(){ mxAuswahl = null; render(); }

function mxTage(a,b){ return Math.round((new Date(a) - new Date(b)) / 864e5); }

// Der Termin, auf den es in dieser Ansicht ankommt: eine Auslage muss
// erscheinen, ehe der Kongress beginnt - dafuer zaehlt der Erscheinungstermin;
// ein Bericht muss nach dessen Ende noch in die Ausgabe kommen - dafuer der
// Anzeigenschluss. Es ist derselbe Termin, nach dem die Heftleiste teilt.
function mxHeftTermin(iss){ return mxArt==='auslage' ? iss.et : iss.as; }

// TT.MM. - im Feld und in der Leiste ist das Jahr der Jahrgang, es steht oben.
function mxKurzDatum(iso){ return iso ? `${iso.slice(8)}.${iso.slice(5,7)}.` : '–'; }

// Dasselbe mit dem Kuerzel davor: in der Leiste steht an jedem Heft, um
// welchen der beiden Termine es sich handelt. Welcher gemeint ist, sagt sonst
// nur die Ansicht - und die steht weit oben.
function mxKurzTermin(iso){ return `${mxArt==='auslage'?'ET':'AS'} ${mxKurzDatum(iso)}`; }

// Abstand zum Kongress in Tagen. Die Richtung steht im Wort: die Auslage misst
// gegen den Beginn, der Bericht gegen das Ende. Frueher blieb der Abstand beim
// Bericht vor dem Ende leer, weil "nach Ende" dort eine negative Zahl ergeben
// haette - die Zahl war nie das Problem, die Beschriftung war es.
function mxHeftAbstand(k, iss){
  const ende = k.bis || k.von;
  // Ein einzelner Tag ist ein Tag - die Zahl steht oft genug auf 1, als dass
  // "1 Tage" auffiele.
  const tage = n => `${n} ${n===1 ? 'Tag' : 'Tage'}`;
  if(mxArt==='auslage'){
    if(!k.von || !iss.et) return '';
    const d = mxTage(k.von, iss.et);
    return d>=0 ? `${tage(d)} vor Beginn` : `${tage(-d)} nach Beginn`;
  }
  if(!ende || !iss.as) return '';
  const d = mxTage(iss.as, ende);
  return d>=0 ? `${tage(d)} nach Ende` : `${tage(-d)} vor Ende`;
}

// Nur noch die Heftwahl - die Kongress-Metadaten haben ein eigenes
// Dialogfenster (siehe mxKongDialog), unabhaengig vom Render-Takt der Matrix.
function mxHeftwahlHtml(k, t){
  const erwOffen = mxErwartetOffen(k,t);
  const ende = k.bis || k.von;
  const kein = !k.von ? `<div class="mx-hinweis">Kein Tagesdatum hinterlegt — es wird kein Abstand gerechnet.</div>` : '';
  const erwHinweis = erwOffen.length
    ? `<div class="mx-hinweis">Vom Vorjahr erwartet: ${erwOffen.map(a=>a==='auslage'?'Auslage':'Bericht').join(', ')}
        &ndash; noch kein Heft gewählt.</div>` : '';
  let vor='', nach='';
  t.issues.forEach(iss=>{
    // Nur die Art, die gerade geplant wird: sonst waere ausgerechnet an der
    // Stelle, an der geklickt wird, die Verwechslung wieder moeglich, die die
    // getrennten Ansichten vermeiden sollen. Der Chip ist zugleich der
    // Schalter - ein eigener Knopf daneben sagte in jeder Zeile dasselbe.
    const istDrin = ((mxArt==='auslage' ? iss.a : iss.b)||[]).includes(k.id);
    const wort = mxArt==='auslage' ? 'Auslage' : 'Bericht';
    const termin = mxHeftTermin(iss);
    const ab = mxHeftAbstand(k, iss);
    const chip = `<button type="button" class="mx-hl-chip ${mxArt}${istDrin?' an':''}"
      onclick="mxToggle('${k.id}',${t.id},'${esc(iss.heft)}','${mxArt}')"
      title="${escA(`${heftText(iss.heft)} · ${mxArt==='auslage'?'ET':'AS'} ${fmt(termin)}${
        ab?' · '+ab:''} — ${wort}${istDrin?' entfernen':' zuordnen'}`)}"><span class="mx-hl-nr">${
      esc(iss.heft)}</span><span class="mx-hl-dat">${esc(mxKurzTermin(termin))}</span><span class="mx-hl-ab">${
      esc(ab)}</span></button>`;
    // Die Schwelle ist je Art eine andere: die Auslage muss vor Beginn
    // erscheinen, ueber den Kongress berichten laesst sich erst, wenn der
    // Anzeigenschluss nach seinem Ende liegt.
    if(mxArt==='auslage'
        ? (k.von && iss.et && iss.et < k.von)
        : (ende && iss.as && iss.as < ende)) vor += chip; else nach += chip;
  });
  const strich = (vor && nach)
    ? `<span class="mx-hl-strich"><i></i><b>${
        mxArt==='auslage'?'Beginn':'Ende'}</b><i></i></span>` : '';

  return `<div class="mx-panel-kopf">
      <div><div class="mx-panel-titel">${esc(t.short)} &middot; ${
        mxArt==='auslage'?'Auslage':'Bericht'}</div>
        <div class="mx-panel-unter">${esc(k.lang)} &middot; ${esc(mxZeitraum(k))}${k.ort?' &middot; '+esc(k.ort):''}</div></div>
      <button type="button" class="mx-panel-zu" onclick="mxSchliessen()" aria-label="Schließen"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    ${kein}${erwHinweis}
    <div class="mx-hl">${vor}${strich}${nach}</div>
    <p class="bearb-stand" id="bearbStand"></p>`;
}

async function mxToggle(kongressId, titelId, heft, art){
  const t = JOURNALS.find(x=>x.id===titelId);
  const iss = t && t.issues.find(x=>x.heft===heft);
  if(!iss) return;
  if(!iss.a) iss.a=[]; if(!iss.b) iss.b=[];
  const arr = art==='auslage' ? iss.a : iss.b;
  const war = arr.includes(kongressId);
  if(war){ arr.splice(arr.indexOf(kongressId),1); } else { arr.push(kongressId); }
  render();
  bearbStand('Wird gespeichert …', '');
  try{
    await zuordnungSchreiben(iss);
    bearbStand('Gespeichert', 'gut');
  }catch(fehler){
    // Fehlgeschlagen: die Zuordnung wieder zuruecknehmen, damit die Anzeige
    // nicht etwas zeigt, das in der Datenbank nicht steht.
    if(war) arr.push(kongressId); else arr.splice(arr.indexOf(kongressId),1);
    render();
    bearbStand(fehlertext(fehler), 'schlecht');
  }
}
// ── Kongress-Metadaten bearbeiten ───────────────────────────────────────────
// Ohne dies gaebe es keinen Weg, einem uebernommenen Kongress ohne Termin
// (siehe "Termin fehlt") Zeitraum und Ort nachzutragen: die Ausgabenseite
// haette bei jeder Aenderung des Wortlauts einen zweiten Kongress angelegt,
// statt den vorhandenen zu aendern. Ein Klick auf die Kongresszeile selbst
// (nicht auf ein Titelfeld) oeffnet ein Dialogfenster - dasselbe Muster wie
// "Jahrgang anlegen": ein einmaliger, mehrfeldriger Vorgang, im Unterschied
// zur Heftwahl oben, die oft in schneller Folge in derselben Zeile passiert
// und deshalb inline dort bleibt statt in einem Dialog aufzupoppen.
// Wie oft haengt der Kongress noch an Heften - getrennt nach Art gezaehlt,
// weil die Matrix immer nur eine zeigt: eine Zeile, die in der Auslagenansicht
// leer aussieht, kann in der Berichteansicht fuenf Hefte tragen. Ohne diese
// Aufschluesselung waere nicht zu sehen, wo das Uebersehene steht.
function mxZuordnungZahl(k){
  let a=0, b=0; const titel=new Set();
  JOURNALS.forEach(t=>mxZelle(k,t).forEach(x=>{
    if(x.art==='auslage') a++; else b++;
    titel.add(t.id);
  }));
  return {a, b, gesamt:a+b, titel:titel.size};
}

function mxZuordnungText(z){
  const teile=[];
  if(z.a) teile.push(z.a + (z.a===1 ? ' Auslage' : ' Auslagen'));
  if(z.b) teile.push(z.b + (z.b===1 ? ' Bericht' : ' Berichte'));
  return teile.join(' und ') + (z.titel===1 ? ' in einem Titel' : ` in ${z.titel} Titeln`);
}

function mxOeffnenKongress(kongressId){
  const k = (DATEN[jahr].kongresse||[]).find(x=>x.id===kongressId);
  if(!k) return;
  mxKongDialog(k);
}

function mxKongNeu(){ mxKongDialog(null); }

// k=null fuer einen neuen Kongress, sonst der zu bearbeitende Satz. Gelesen
// werden die Felder erst beim Klick auf Speichern/Anlegen (wie bei
// "Jahrgang anlegen"), nicht bei jedem Zeichen - das erspart eine eigene
// Entwurfs-Verwaltung, die jetzt ohnehin nur der Dialog selbst braucht.
function mxKongDialog(k){
  const neu = !k;
  // Entfernen steht auch bei bestehenden Zuordnungen - der haeufige Anlass ist
  // ja gerade, dass der Kongress im Jahrgang nicht stattfindet oder doppelt
  // geschrieben wurde; dann sollen die Zuordnungen mit weg. Was das kostet,
  // sagt allein die Rueckfrage; der Dialog selbst zeigt nur die Felder.
  const html = `<p class="dlg-erklaerung">Gilt nur für den Jahrgang ${esc(jahr)}</p>
    <label class="bearb-feld">Name
      <input type="text" id="mkLang" value="${neu?'':escA(k.lang)}"></label>
    <label class="bearb-feld">Kurzname
      <input type="text" id="mkKurz" value="${neu?'':escA(k.kurz||'')}">
      <span class="hinweis">Für die Ausgabe an die Datenpflege der Angebotswerkzeuge</span></label>
    <div class="bearb-reihe zwei">
      <label class="bearb-feld">Beginn
        <input type="date" id="mkVon" value="${neu?'':escA(k.von||'')}"></label>
      <label class="bearb-feld">Ende
        <input type="date" id="mkBis" value="${neu?'':escA(k.bis||'')}"></label>
    </div>
    <label class="bearb-feld">Ungefährer Zeitraum, wenn kein Tag feststeht
      <input type="text" id="mkUnscharf" value="${neu?'':escA(k.unscharf||'')}"
             placeholder="etwa »September 2027«">
      <span class="hinweis">Nur wenn Beginn und Ende leer bleiben – sonst gilt der genaue Zeitraum</span></label>
    <label class="bearb-feld">Ort
      <input type="text" id="mkOrt" value="${neu?'':escA(k.ort||'')}"></label>
    <label class="bearb-haken"><input type="checkbox" id="mkDach"${
      neu || kongDach(k) ? ' checked' : ''}>
      Findet in Deutschland, Österreich oder der Schweiz statt</label>
    <span class="bearb-hakenhinweis">Steuert allein den Schalter »Nur deutschsprachiger
      Raum« in der Kongressansicht. Bei einem neuen Kongress ist das Häkchen gesetzt;
      wegzunehmen ist es bei einem Kongress im Ausland</span>`;
  dialogZeigen(neu ? 'Neuer Kongress' : 'Kongress bearbeiten', html,
    neu ? 'Anlegen' : 'Speichern', () => mxKongDialogAusfuehren(neu ? null : k.id),
    false, neu ? null : {text:'Entfernen', aktion:() => mxKongDialogEntfernen(k.id)});
}

async function mxKongDialogAusfuehren(kongressId){
  const neu = kongressId===null;
  const k = neu ? null : (DATEN[jahr].kongresse||[]).find(x=>x.id===kongressId);
  if(!neu && !k) return dialogSchliessen();
  const lang = (document.getElementById('mkLang').value||'').trim();
  if(!lang) return ladeStand('Der Name darf nicht leer bleiben.', true);
  const von = document.getElementById('mkVon').value || null;
  const bis = von ? (document.getElementById('mkBis').value || null) : null;
  const unscharf = von ? '' : (document.getElementById('mkUnscharf').value||'').trim();
  const patch = {lang, kurz:(document.getElementById('mkKurz').value||'').trim(), von, bis,
    unscharf, ort:(document.getElementById('mkOrt').value||'').trim(),
    dach: !!document.getElementById('mkDach').checked};
  ladeKnoepfe(true);
  ladeStand(neu ? 'Wird angelegt …' : 'Wird gespeichert …');
  try{
    if(neu){
      // Ohne Ausgabe, deshalb ueber dieselbe Tabelle wie jede andere Neuanlage,
      // aber ohne den Umweg ueber eine Heftzuordnung (zuordnungSchreiben).
      const angelegt = await dbAnfrage('/rest/v1/kongress',
        {method:'POST', headers:{Prefer:'return=representation'},
         body: JSON.stringify([Object.assign({jahr}, patch)])});
      const roh = Array.isArray(angelegt) ? angelegt[0] : angelegt;
      if(!roh || !roh.id) throw new Error('Der Kongress wurde nicht angelegt.');
      const satz = Object.assign({kurz:'', dach:true}, roh);
      if(!DATEN[jahr].kongresse) DATEN[jahr].kongresse = [];
      DATEN[jahr].kongresse.push(satz);
      KONG.set(satz.id, satz);
    } else {
      await dbAnfrage('/rest/v1/kongress?id=eq.'+encodeURIComponent(k.id),
        {method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify(patch)});
      Object.assign(k, patch);
    }
    dialogSchliessen();
    // Bei gesetztem Schalter kann der eben gespeicherte Kongress ausserhalb des
    // deutschsprachigen Raums liegen; seine Zeile waere dann nicht zu sehen.
    // Das sagt die Notiz, statt die Zeile kommentarlos fehlen zu lassen.
    if(mxNurDach && !patch.dach)
      mxNotiz = `»${patch.lang}« liegt außerhalb des deutschsprachigen Raums `
              + `und ist bei dieser Auswahl ausgeblendet.`;
    render();
  }catch(fehler){ ladeStand(fehlertext(fehler), true); ladeKnoepfe(false); }
}

// Die Rueckfrage legt ihr eigenes Blatt ueber das noch offene Dialogfenster
// (hoeherer z-Wert, siehe frage()) - dasselbe Zusammenspiel wie an anderer
// Stelle im Werkzeug, wo eine Rueckfrage aus einem offenen Dialog kommt.
async function mxKongDialogEntfernen(kongressId){
  const k = (DATEN[jahr].kongresse||[]).find(x=>x.id===kongressId);
  if(!k) return;
  const zahl = mxZuordnungZahl(k);
  if(!await frage('Kongress entfernen?',
    `<p>»${esc(k.lang)}« wird aus dem Jahrgang ${esc(jahr)} entfernt.</p>${
      zahl.gesamt ? `<p>Dabei ${zahl.gesamt===1?'geht':'gehen'} <b>${
        mxZuordnungText(zahl)}</b> mit verloren.</p>` : ''}`,
    'Entfernen')) return;
  ladeKnoepfe(true);
  ladeStand('Wird entfernt …');
  try{
    await dbAnfrage('/rest/v1/kongress?id=eq.'+encodeURIComponent(k.id),
      {method:'DELETE', headers:{Prefer:'return=minimal'}});
    DATEN[jahr].kongresse = (DATEN[jahr].kongresse||[]).filter(x=>x.id!==k.id);
    KONG.delete(k.id);
    // Die Datenbank raeumt die Zuordnungen selbst weg (on delete cascade), die
    // Arbeitskopie im Browser nicht. Bliebe die Kennung in iss.a/iss.b stehen,
    // setzte kongressText() sie im Druck als rohe Zeichenkette ein.
    JOURNALS.forEach(t=>t.issues.forEach(iss=>{
      if(iss.a) iss.a = iss.a.filter(x=>x!==k.id);
      if(iss.b) iss.b = iss.b.filter(x=>x!==k.id);
    }));
    dialogSchliessen();
    render();
  }catch(fehler){ ladeStand(fehlertext(fehler), true); ladeKnoepfe(false); }
}
function renderBearbeiten(){
  const umschalter = bearbUmschalterHtml();
  if(bearbAnsicht==='kongress') return renderKongressmatrix(umschalter);

  const gewaehltIst = (art, titelId, index) => !!bearbAuswahl
    && bearbAuswahl.art===art && !bearbAuswahl.neu
    && bearbAuswahl.titelId===titelId
    && (index===undefined || bearbAuswahl.index===index);
  const neuIst = (art, titelId) => !!bearbAuswahl && bearbAuswahl.art===art
    && !!bearbAuswahl.neu && bearbAuswahl.titelId===titelId;

  const liste = JOURNALS.map(t=>{
    const eintraege = t.issues.map((iss,i)=>
      `<button type="button" class="bearb-eintrag${gewaehltIst('ausgabe',t.id,i)?' gewaehlt':''}"
        onclick="bearbWaehle(${t.id},${i})">
        <span>${esc(heftText(iss.heft))}</span>
        <span class="bd">${fmt(iss.et)}</span></button>`).join('');
    const n = t.issues.length;
    // Der Titelkopf fuehrt zu seinen Stammdaten. Die Zahl daneben sagt, wie
    // viele Ausgaben daran haengen - das ist zugleich der Hinweis darauf, was
    // ein Entfernen mitnaehme.
    return `<div class="bearb-block">
      <button type="button" class="bearb-titel${helleFarbe(t.hex)?' hell':''}${
        gewaehltIst('titel',t.id)?' gewaehlt':''}"
        style="background-color:${escA(t.hex)}" title="Stammdaten des Titels bearbeiten"
        onclick="bearbWaehleTitel(${t.id})">
        <span>${esc(t.short)}</span>
        <span class="bt-zahl">${n} Heft${n===1?'':'e'}</span></button>
      ${eintraege}
      <button type="button" class="bearb-eintrag bearb-neu${neuIst('ausgabe',t.id)?' gewaehlt':''}"
        onclick="bearbNeueAusgabe(${t.id})">
        <span class="bearb-neu-text"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Ausgabe</span></button>
    </div>`;
  }).join('');

  const titelNeu = !!bearbAuswahl && bearbAuswahl.art==='titel' && !!bearbAuswahl.neu;
  // Der Knopf fuer einen neuen Titel steht ausserhalb der Liste: in ihr haette
  // er hinter allen Heften gestanden und waere erst nach langem Blaettern zu
  // sehen gewesen.
  return umschalter + `<div class="bearb">
    <div class="bearb-spalte">
      <div class="bearb-liste">${liste}</div>
      <button type="button" class="bearb-titelknopf${titelNeu?' gewaehlt':''}"

// ─── Datenschicht der Print-Fassung ─────────────────────────────────────────
// Statt einer Datenbank stehen die Tabellen im Block <script id="tabellen">
// dieser Datei. dbAnfrage() versteht dieselben Pfade, die das Werkzeug an die
// Datenbank richtete (/rest/v1/<tabelle>?spalte=eq.wert&order=…&limit=…),
// samt Vorgabewerten, Schluesseln, Bezuegen und dem Loeschen abhaengiger
// Zeilen. Der uebrige Code bleibt dadurch wortgleich mit der Web-Fassung.
const TAB_REGELN = {
  jahrgang:         { schluessel:['jahr'], vorgabe:()=>({stand:''}) },
  titel:            { schluessel:['jahr','id'],
                      vorgabe:()=>({auflage:0, hex:'#00285a', rubriken:[], cover:''}),
                      braucht:[['jahrgang',{jahr:'jahr'}]] },
  ausgabe:          { schluessel:['id'], kennung:true,
                      vorgabe:()=>({erscheinung:null, anzeigenschluss:null,
                        druckunterlagen:null, anlieferung:null, thema:'',
                        sonderthema:'', auslagen:[], berichte:[], inhalte:{}}),
                      braucht:[['titel',{jahr:'jahr', id:'titel_id'}]] },
  kongress:         { schluessel:['id'], kennung:true,
                      vorgabe:()=>({kurz:'', von:null, bis:null, unscharf:'',
                        ort:'', erwartet:[], dach:true}),
                      braucht:[['jahrgang',{jahr:'jahr'}]] },
  kongress_ausgabe: { schluessel:['kongress_id','ausgabe_id','art'], vorgabe:()=>({}),
                      braucht:[['kongress',{id:'kongress_id'}],['ausgabe',{id:'ausgabe_id'}]] },
  sicherung:        { schluessel:['id'], kennung:true,
                      vorgabe:()=>({bezeichnung:'', erstellt_am:new Date().toISOString()}) }
};
// Was beim Loeschen mitgeht: [abhaengige Tabelle, {Spalte dort: Spalte hier}]
const TAB_KASKADE = {
  jahrgang: [['titel',{jahr:'jahr'}], ['kongress',{jahr:'jahr'}]],
  titel:    [['ausgabe',{jahr:'jahr', titel_id:'id'}]],
  ausgabe:  [['kongress_ausgabe',{ausgabe_id:'id'}]],
  kongress: [['kongress_ausgabe',{kongress_id:'id'}]]
};
function tabKopie(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
function neueKennung(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'
    .replace(/x/g, ()=>(Math.random()*16|0).toString(16));
}
function tabFilter(params){
  const f = [];
  for(const [k,v] of params){
    if(k==='select' || k==='order' || k==='limit') continue;
    if(!v.startsWith('eq.')) throw new Error('Nicht unterstützte Abfrage: ' + k + '=' + v);
    f.push([k, v.slice(3)]);
  }
  return z => f.every(([k,w]) => String(z[k]) === w);
}
function tabOrdnen(zeilen, order){
  if(!order) return zeilen;
  const teile = order.split(',').map(t=>{ const [sp,r] = t.split('.'); return [sp, r==='desc'?-1:1]; });
  return zeilen.sort((a,b)=>{
    for(const [sp,r] of teile){
      const x=a[sp], y=b[sp];
      if(x===y) continue;
      if(x==null) return 1;
      if(y==null) return -1;
      return (x<y ? -1 : 1) * r;
    }
    return 0;
  });
}
function tabLoeschen(name, treffer){
  const tab = TABELLEN[name];
  treffer.forEach(z=>{ const i = tab.indexOf(z); if(i>=0) tab.splice(i,1); });
  (TAB_KASKADE[name]||[]).forEach(([kind, bez])=>{
    const mit = (TABELLEN[kind]||[]).filter(k=>treffer.some(p=>
      Object.entries(bez).every(([kc,pc])=>String(k[kc])===String(p[pc]))));
    if(mit.length) tabLoeschen(kind, mit);
  });
}
async function dbAnfrage(pfad, einstellungen = {}){
  const m = /^\/rest\/v1\/([a-z_]+)(?:\?(.*))?$/.exec(pfad);
  if(!m || !TAB_REGELN[m[1]]) throw new Error('Diese Fassung arbeitet ohne Datenbank.');
  // Eine leere Datei, die ohne den Begruessungsdialog gleich aus Excel
  // befuellt wird, bekommt hier ihren ersten (noch namenlosen) Fachbereich.
  if(!TABELLEN && !OHNE_DATENBANK && !BEREICHE.length){
    BEREICHE.push({name:'', tabellen:leereTabellen()});
    bereichSetzen(0);
  }
  if(!TABELLEN) throw new Error('Diese Kopie enthält nur die Anzeige.');
  const name = m[1], regel = TAB_REGELN[name];
  const tab = TABELLEN[name] || (TABELLEN[name] = []);
  const params = new URLSearchParams(m[2] || '');
  const methode = (einstellungen.method || 'GET').toUpperCase();
  const passt = tabFilter(params);
  const zurueck = /return=representation/.test(
    (einstellungen.headers && einstellungen.headers.Prefer) || '');

  if(methode==='GET'){
    let z = tabOrdnen(tab.filter(passt).map(tabKopie), params.get('order'));
    const grenze = parseInt(params.get('limit'), 10);
    if(grenze > 0) z = z.slice(0, grenze);
    return z;
  }
  const koerper = einstellungen.body ? JSON.parse(einstellungen.body) : null;
  if(methode==='POST'){
    const neu = (Array.isArray(koerper) ? koerper : [koerper]).map(z=>{
      const zeile = Object.assign(regel.vorgabe(), tabKopie(z));
      if(regel.kennung && !zeile.id) zeile.id = neueKennung();
      return zeile;
    });
    // Erst alles pruefen, dann schreiben: eine Anfrage gilt ganz oder gar nicht.
    const schl = z => regel.schluessel.map(k=>String(z[k])).join('|');
    const da = new Set(tab.map(schl));
    neu.forEach(z=>{
      const k = schl(z);
      if(da.has(k)) throw new Error('Diesen Eintrag gibt es bereits (' + name + ' ' + k + ').');
      da.add(k);
      (regel.braucht||[]).forEach(([el, bez])=>{
        if(!(TABELLEN[el]||[]).some(p=>Object.entries(bez).every(([pc,kc])=>String(p[pc])===String(z[kc]))))
          throw new Error('Der Bezug fehlt (' + name + ' → ' + el + ').');
      });
    });
    tab.push(...neu);
    dateiGeaendert();
    return zurueck ? neu.map(tabKopie) : null;
  }
  if(methode==='PATCH'){
    const treffer = tab.filter(passt);
    treffer.forEach(z=>Object.assign(z, tabKopie(koerper)));
    if(treffer.length) dateiGeaendert();
    return zurueck ? treffer.map(tabKopie) : null;
  }
  if(methode==='DELETE'){
    const treffer = tab.filter(passt);
    if(treffer.length){ tabLoeschen(name, treffer); dateiGeaendert(); }
    return null;
  }
  throw new Error('Nicht unterstützte Anfrage: ' + methode);
}

// ── Sichern ──
// In Chrome und Edge wird beim ersten Sichern die Datei gewaehlt; danach
// schreibt jede Aenderung von selbst in dieselbe Datei. Andere Browser kennen
// diesen Weg nicht - dort entsteht bei jedem Sichern eine neue Datei im
// Download-Ordner. Ungesichertes meldet der Knopf "Sichern" und das Verlassen
// der Seite; schreibt die Datei von selbst, steht dort "Automatisch gesichert".
let dateiHandle = null, ungesichert = false, aenderungen = 0,
    schreibZeit = null, schreibFehler = false, downloadErklaert = false;

function dateiGeaendert(){
  ungesichert = true;
  aenderungen++;
  if(dateiHandle && !schreibFehler){
    clearTimeout(schreibZeit);
    schreibZeit = setTimeout(()=>dateiSchreiben().catch(()=>{}), 400);
  }
  sichernAnzeigen();
}
function sichernAnzeigen(){
  const b = document.getElementById('sichernBtn');
  if(!b) return;
  const selbst = !!dateiHandle && !schreibFehler;
  b.hidden = !ungesichert || selbst;
  const o = document.getElementById('sicherOffen');
  if(o) o.hidden = b.hidden;
  const h = document.getElementById('sicherStand');
  if(!h) return;
  h.hidden = !selbst;
  h.textContent = ungesichert ? 'Wird gesichert …' : 'Automatisch gesichert';
  h.classList.toggle('laeuft', ungesichert);
}
function dateiName(){
  try{
    const n = decodeURIComponent(location.pathname.split('/').pop() || '');
    if(/\.html?$/i.test(n)) return n;
  }catch(e){}
  return 'Jahresvorschau_Print.html';
}
// Ein Abzug des Dokuments wie bei der HTML-Kopie, aber mit allen Bedienteilen
// und den Tabellen aller Jahrgaenge.
function dateiInhalt(){
  const klon = neutralerKlon();
  const tb = klon.querySelector('#tabellen');
  tb.textContent = '\n// Die Heftplanung dieser Datei, je Fachbereich ein Satz Tabellen. '
    + '"Sichern" schreibt diesen Block im Ganzen neu.\n'
    + 'let BEREICHE = ' + sicheresJson(BEREICHE) + ';\n'
    + 'let AKTIV = ' + AKTIV + ';\n';
  const fm = klon.querySelector('#fachMenu');
  if(fm) fm.innerHTML = '';
  ['#fachWahl','#jahrWahl'].forEach(k=>{
    const w = klon.querySelector(k);
    if(w) w.setAttribute('aria-expanded','false');
  });
  const jm = klon.querySelector('#jahrMenu');
  if(jm) jm.innerHTML = '';
  const sb = klon.querySelector('#sichernBtn');
  if(sb) sb.setAttribute('hidden','');
  ['#sicherStand','#sicherOffen'].forEach(k=>{
    const e = klon.querySelector(k);
    if(e) e.setAttribute('hidden','');
  });
  klon.querySelectorAll('.daten-dialog').forEach(d=>{ if(d.id!=='ladeDialog') d.remove(); });
  const ld = klon.querySelector('#ladeDialog');
  if(ld) ld.classList.remove('offen');
  // Was nur die gerade offene Ansicht betrifft, beginnt beim Oeffnen neu.
  const ps = klon.querySelector('#pagestyle');
  if(ps) ps.textContent = '';
  const rs = klon.querySelector('#results');
  if(rs) rs.className = 'grid';
  return '<!DOCTYPE html>\n' + klon.outerHTML;
}
async function dateiSchreiben(){
  const stand = aenderungen;
  const html = dateiInhalt();
  try{
    if(dateiHandle){
      const w = await dateiHandle.createWritable();
      await w.write(new Blob([html], {type:'text/html'}));
      await w.close();
    }else{
      const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
      const a = document.createElement('a');
      a.href = url; a.download = dateiName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      if(!downloadErklaert){
        downloadErklaert = true;
        dialogZeigen('Gesichert als neue Datei',
          '<p>Dieser Browser kann nicht in die geöffnete Datei zurückschreiben. '
          + 'Der Stand liegt deshalb als neue Datei »' + esc(dateiName()) + '« im '
          + 'Download-Ordner.</p><p>Weitergearbeitet wird mit dieser neuen Datei; '
          + 'die bisherige kann durch sie ersetzt werden. In Chrome und Edge entfällt '
          + 'dieser Umweg.</p>');
      }
    }
    schreibFehler = false;
    if(stand === aenderungen) ungesichert = false;
  }catch(fehler){
    schreibFehler = true;
    throw fehler;
  }finally{
    sichernAnzeigen();
  }
}
// Beim ersten Mal, dass die Datei von selbst weiterschreibt, sagt ein Fenster
// einmal, was das heisst. Gemerkt wird das im Browser; ohne ihn kommt es eben
// noch einmal.
const AUTOSICHERN_ERKLAERT = 'jahresvorschau.autosichern-erklaert';
function autoSichernErklaeren(){
  try{ if(localStorage.getItem(AUTOSICHERN_ERKLAERT)) return; }catch(e){}
  dialogZeigen('Automatisches Sichern aktiviert',
    '<p>Weitere Änderungen werden ab sofort automatisch in dieser Datei gespeichert. '
    + 'Ein erneutes Sichern ist nicht erforderlich; der aktuelle Status wird oben als '
    + '»Automatisch gesichert« angezeigt.</p>'
    + '<p>Dies gilt, solange die Datei geöffnet ist. Nach dem erneuten Öffnen ist bei der '
    + 'ersten Änderung einmalig »Sichern« zu wählen; anschließend erfolgt das Speichern '
    + 'wieder automatisch.</p>');
  try{ localStorage.setItem(AUTOSICHERN_ERKLAERT, '1'); }catch(e){}
}
async function dateiSichern(){
  if(OHNE_DATENBANK) return;
  try{
    const neuGewaehlt = !dateiHandle && !!window.showSaveFilePicker;
    if((!dateiHandle || schreibFehler) && window.showSaveFilePicker){
      dateiHandle = await window.showSaveFilePicker({
        suggestedName: dateiName(),
        types: [{description:'Jahresvorschau', accept:{'text/html':['.html']}}]
      });
      schreibFehler = false;
    }
    await dateiSchreiben();
    if(neuGewaehlt) autoSichernErklaeren();
  }catch(fehler){
    if(fehler && fehler.name==='AbortError') return;      // Auswahl abgebrochen
    dialogZeigen('Sichern nicht möglich', '<p>' + esc(fehlertext(fehler)) + '</p>');
  }
}
window.addEventListener('beforeunload', e=>{
  if(ungesichert && !OHNE_DATENBANK){ e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('keydown', e=>{
  if(OHNE_DATENBANK) return;
  if((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase()==='s'){
    e.preventDefault();
    dateiSichern();
  }
});

// ── Kennfarben ──
// Neue Titel bekommen der Reihe nach eine eigene Farbe; geaendert wird sie im
// Titelformular. Vorn die vier Farben des Brand Hubs, dahinter Ergaenzungen.
const TITELFARBEN = ['#00285a','#0176c3','#ee7d11','#25855a','#8a5a9e','#afca00','#c0600a','#4a6080'];
function farbeFuer(id){ return TITELFARBEN[(Math.max(1, id|0) - 1) % TITELFARBEN.length]; }

// ── Excel-Vorlage ──
// Eine leere Tabelle in genau der Form, die "Aus Excel laden" erwartet: Blatt
// "Ausgaben" mit Vorspann (darin "Vollstaendiger Jahrgang", sonst gilt die
// Datei als Auszug) und den Spaltenkoepfen der Excel-Ausgabe. Vorbelegt ist je
// vorhandenem Titel eine Zeile mit Jahrgang, Titel und Auflage - ohne Heft
// wird sie beim Laden uebergangen und stoert also nicht. Davor ein Blatt
// "Hinweise", das jede Spalte erklaert.
const VORLAGE_KOPF = ['Jahrgang','Titel','Heft','Erscheinungstermin (ET)','Anzeigenschluss (AS)',
  'Druckunterlagen (DU)','Ein-/Durchhefter und Beilagen (EH)','Auflage','Themenschwerpunkte',
  'Weitere Rubriken','Kongresse'];
function vorlageJahr(){
  if(jahr && DATEN[jahr]) return jahr;
  const d = new Date();
  return String(d.getFullYear() + (d.getMonth() >= 6 ? 1 : 0));
}
function vorlageHinweise(y){
  const F=(w,s)=>({w,s});
  return [
    F(`Vorlage für die Jahresvorschau ${fachKopf()} ${y}`,4),

    F('Ablauf',6),
    F('1. Im Blatt »Ausgaben« eine Zeile je Ausgabe eintragen.',0),

    F('Vor dem Übernehmen zeigt das Werkzeug, was es gefunden hat. Das Laden ersetzt den Jahrgang',0),
    F('im Ganzen; steht dort schon etwas, entsteht vorher ein Sicherungspunkt.',0),
    F('',0),
    F('Die drei Zeilen über den Spaltenköpfen und die Spaltenköpfe selbst bleiben unverändert –',5),
    F('an ihnen erkennt das Werkzeug die Vorlage. Die Reihenfolge der Spalten ist dagegen frei.',5),
    F('',0),
    F('Die Spalten',6),
    F('Jahrgang – vierstellig, etwa ' + y + '. Pflicht.',0),
    F('Titel – der Name des Titels, in jeder Zeile gleich geschrieben. Neue Titel entstehen beim Laden;',0),
    F('   die Kennfarbe wird danach in der Jahresvorschau unter »Bearbeiten« gesetzt.',0),
    F('Heft – eine Nummer, auch ein Doppelheft wie »1–2«, oder eine Bezeichnung wie »Sonderheft«. Pflicht.',0),
    F('   Zeilen ohne Titel oder ohne Heft werden übergangen.',0),
    F('Erscheinungstermin (ET) – Pflicht, als Datum, etwa 12.02.' + y + '.',0),
    F('Anzeigenschluss, Druckunterlagen, Ein-/Durchhefter und Beilagen – Datum wie oben.',0),
    F('Auflage – eine Zahl; einmal je Titel genügt.',0),
    F('Themenschwerpunkte – höchstens zwei, jeder in einer eigenen Zeile innerhalb der Zelle.',0),
    F('Weitere Rubriken – je Eintrag eine Zeile »Rubrik: Text«, etwa »CME-Beitrag: Kardiale Amyloidose',0),
    F('   erkennen«. Die Rubrik entsteht beim Laden am jeweiligen Titel. Die Spalte darf leer bleiben.',0),
    F('Kongresse – je Kongress eine Zeile innerhalb der Zelle.',0),
    F('',0),
    F('Mehrere Einträge in einer Zelle',6),
    F('Zeilenumbruch innerhalb einer Zelle: Alt+Eingabe unter Windows, Ctrl+Option+Eingabe auf dem Mac.',0),
    F('',0),

    F('in der Jahresvorschau unter »Daten → Bearbeiten« ändern.',5)
  ];
}
// zusatz: weitere Zeilen, nur fuer Pruefungen
function vorlageXlsx(zusatz){
  const y = vorlageJahr();
  const titel = (DATEN[y] && DATEN[y].titel) || [];
  const zeilen = titel.length
    ? titel.map(t=>[{w:y},{w:t.short},{w:''},{w:''},{w:''},{w:''},{w:''},{w:t.auflage||'',t:'n'}])
    : [[{w:y}]];
  (zusatz||[]).forEach(z=>zeilen.push(z));
  const vorspann = [
    [`Jahresvorschau ${fachKopf()} ${y} – Vorlage zum Befüllen`,4],
    ['Vollständiger Jahrgang · eine Zeile je Ausgabe · Erklärung im Blatt »Hinweise«',0],
    ['Die Zeilen bis einschließlich der Spaltenköpfe bleiben unverändert',5]
  ];
  // Die vier Terminspalten tragen das Datumsformat schon vorab: ein
  // eingetipptes Datum steht dann als 12.02.2027 da, nicht als Zahl.
  let blatt = blattXml([9,34,8,13,13,13,16,9,40,40,52], vorspann, VORLAGE_KOPF, zeilen);
  [4,5,6,7].forEach(i=>{
    blatt = blatt.replace(`<col min="${i}" max="${i}" width="`, `<col min="${i}" max="${i}" style="2" width="`);
  });
  const NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const teile=[
    {name:'[Content_Types].xml', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
      `<Default Extension="xml" ContentType="application/xml"/>`+
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`+
      `</Types>`},
    {name:'_rels/.rels', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${NS}/officeDocument" Target="xl/workbook.xml"/>`+
      `</Relationships>`},
    // "Hinweise" steht vorn, damit der Weg beim Oeffnen zuerst dasteht;
    // eingelesen wird das Blatt "Ausgaben" ueber seinen Namen.
    {name:'xl/workbook.xml', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${NS}">`+
      `<sheets><sheet name="Hinweise" sheetId="1" r:id="rId1"/>`+
      `<sheet name="Ausgaben" sheetId="2" r:id="rId2"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', text:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${NS}/worksheet" Target="worksheets/sheet1.xml"/>`+
      `<Relationship Id="rId2" Type="${NS}/worksheet" Target="worksheets/sheet2.xml"/>`+
      `<Relationship Id="rId9" Type="${NS}/styles" Target="styles.xml"/>`+
      `</Relationships>`},
    {name:'xl/styles.xml', text:XLSX_STYLES},
    {name:'xl/worksheets/sheet1.xml', text:hinweisBlattXml(vorlageHinweise(y))},
    {name:'xl/worksheets/sheet2.xml', text:blatt}
  ];
  const enc=new TextEncoder();
  return zipBauen(teile.map(t=>({name:t.name,bytes:enc.encode(t.text)})));
}
function excelVorlage(){
  schliesseDaten();
  const bytes = vorlageXlsx();
  const url = URL.createObjectURL(new Blob([bytes],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a');
  a.href = url; a.download = `Jahresvorschau_${dateiFach()}Print_${vorlageJahr()}_Vorlage.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// ── Fachbereiche ──
// Eine Datei kann mehrere Fachbereiche fuehren, jeder mit eigenem Satz
// Tabellen (Jahrgaenge, Titel, Ausgaben, Kongresse, Sicherungspunkte).
// TABELLEN und FACHBEREICH zeigen auf den gerade gewaehlten - dbAnfrage() und
// alles darueber wissen von den anderen nichts. PDF, Excel und HTML-Kopie
// gelten darum immer dem gezeigten Fachbereich.
let TABELLEN = null, FACHBEREICH = '';
function leereTabellen(){
  const t = {};
  Object.keys(TAB_REGELN).forEach(n=>{ t[n] = []; });
  return t;
}
function bereichSetzen(i){
  AKTIV = BEREICHE.length ? Math.min(Math.max(0, i|0), BEREICHE.length - 1) : 0;
  const b = BEREICHE[AKTIV];
  TABELLEN = b ? b.tabellen : null;
  FACHBEREICH = b ? b.name : '';
}
// Im Menue stehen die Fachbereiche nach dem Alphabet; der gewaehlte bleibt.
function bereicheOrdnen(){
  const b = BEREICHE[AKTIV];
  BEREICHE.sort((x,y)=>x.name.localeCompare(y.name, 'de'));
  if(b) bereichSetzen(BEREICHE.indexOf(b));
}
function nameGleich(a, b){
  return String(a).trim().toLocaleLowerCase('de') === String(b).trim().toLocaleLowerCase('de');
}
// ausser: der Fachbereich, der umbenannt wird; null beim Anlegen.
function bereichNamePruefen(name, ausser){
  const andere = BEREICHE.filter(b=>b!==ausser);
  if(!andere.length) return '';
  if(!name) return 'Bei mehreren Fachbereichen braucht jeder einen Namen.';
  if(!ausser && andere.some(b=>!b.name))
    return 'Der bisherige Fachbereich hat noch keinen Namen. Er wird zuerst unter '
      + '»Daten → Fachbereich umbenennen« benannt.';
  if(andere.some(b=>nameGleich(b.name, name)))
    return 'Einen Fachbereich »' + name + '« gibt es in dieser Datei schon.';
  return '';
}
function mehrzahl(n, ein, mehr){ return n + ' ' + (n===1 ? ein : mehr); }
function bereichUmfang(t){
  const jahre = t.jahrgang.map(j=>j.jahr).sort();
  const titel = new Set(t.titel.map(x=>x.kurz)).size;
  return mehrzahl(titel, 'Titel', 'Titel') + ' · '
    + (jahre.length===1 ? 'Jahrgang ' : 'Jahrgänge ') + jahre.join(', ');
}

// ── Aus aelterer Datei uebernehmen ──
// Eine neue Fassung dieser Datei kommt leer. Ihr Inhalt wird hier aus der
// bisherigen Datei geholt: der Block <script id="tabellen"> wird gelesen,
// nicht ausgefuehrt - die fremde Datei bleibt Text. Jeder Fachbereich dort
// ersetzt den gleichnamigen hier oder kommt neu dazu; so lassen sich auch
// mehrere Dateien zu einer zusammenfuehren. Felder, die eine aeltere Fassung
// noch nicht kannte, bekommen ihre Vorgabewerte (TAB_REGELN) - an dieser
// Stelle setzt jede kuenftige Umstellung des Datenaufbaus an. Gelesen wird
// auch die erste Fassung mit nur einem Fachbereich (TABELLEN/FACHBEREICH).
let altErgebnis = null;
async function altDatenKlick(){
  schliesseDaten();
  if(!await bearbFrei()) return;
  document.getElementById('altDatei').click();
}
// Inhaltsvergleich unabhaengig von der Reihenfolge der Felder
function kanon(x){
  if(Array.isArray(x)) return '[' + x.map(kanon).join(',') + ']';
  if(x && typeof x==='object')
    return '{' + Object.keys(x).sort().map(k=>JSON.stringify(k) + ':' + kanon(x[k])).join(',') + '}';
  return JSON.stringify(x);
}
function altDatenLesen(text){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const sk = doc.getElementById('tabellen');
  if(!sk) throw new Error('Diese Datei ist keine Jahresvorschau Print.\n\nErwartet wird eine '
    + 'Datei, die mit dieser Jahresvorschau gesichert wurde.');
  const mNeu = /let BEREICHE = ([\s\S]*?);\nlet AKTIV = /.exec(sk.textContent);
  const mAlt = /let TABELLEN = ([\s\S]*?);\nlet FACHBEREICH = ([\s\S]*?);\n/.exec(sk.textContent);
  let roh;
  if(mNeu) roh = JSON.parse(mNeu[1]);
  else if(mAlt) roh = [{name: JSON.parse(mAlt[2]), tabellen: JSON.parse(mAlt[1])}];
  if(!Array.isArray(roh)) throw new Error('Die Daten in dieser Datei sind nicht lesbar.');
  if(roh.some(b=>!b || !b.tabellen)) throw new Error('Diese Datei ist eine HTML-Kopie zum Ansehen.\n\n'
    + 'Sie enthält nur einen Jahrgang und keine bearbeitbaren Daten. Übernommen werden '
    + 'kann nur aus der Arbeitsdatei, mit der gearbeitet und gesichert wurde.');
  const bereiche = roh.map(b=>{
    const tabellen = {};
    Object.keys(TAB_REGELN).forEach(name=>{
      tabellen[name] = (Array.isArray(b.tabellen[name]) ? b.tabellen[name] : [])
        .map(z=>Object.assign(TAB_REGELN[name].vorgabe(), z));
    });
    return {name: String(b.name || '').trim(), kontakt: kontaktLesen(b.kontakt),
      tabellen: kongresseAlsText(tabellen)};
  }).filter(b=>b.tabellen.jahrgang.length);
  const fassung = doc.querySelector('meta[name="jahresvorschau-fassung"]');
  return { bereiche, fassung: fassung ? fassung.getAttribute('content') : '' };
}
async function altDateiGewaehlt(ev){
  const datei = ev.target.files[0];
  ev.target.value = '';
  if(!datei) return;
  try{
    const erg = altDatenLesen(await datei.text());
    if(!erg.bereiche.length) throw new Error('Die gewählte Datei enthält noch keinen Jahrgang.');
    const plan = erg.bereiche.map(q=>({q, ziel: BEREICHE.find(b=>nameGleich(b.name, q.name)) || null}));
    if(plan.every(p=>p.ziel && kanon(p.ziel.tabellen)===kanon(p.q.tabellen)) && plan.every(p=>p.ziel.name===p.q.name)
       && plan.every(p=>!kontaktDa(p.q.kontakt) || kanon(kontaktLesen(p.ziel.kontakt))===kanon(p.q.kontakt)))
      throw new Error('Die gewählte Datei enthält genau den Stand, der hier schon steht.');
    // Ein Fachbereich ohne einen einzigen Titel ist ein angefangener leerer
    // Start - er weicht dem Uebernommenen, statt leer daneben stehen zu bleiben.
    const leere = BEREICHE.filter(b=>!b.tabellen.titel.length && !plan.some(p=>p.ziel===b));
    const bleiben = BEREICHE.filter(b=>!leere.includes(b) && !plan.some(p=>p.ziel===b));
    plan.forEach(p=>{ p.gleich = !!p.ziel && kanon(p.ziel.tabellen)===kanon(p.q.tabellen); });
    const teile = plan.map(({q, ziel, gleich})=>{
      const t = q.tabellen;
      const zeilen = t.jahrgang.map(j=>j.jahr).sort().map(y=>{
        const n = tab => t[tab].filter(x=>x.jahr===y).length;
        return `<tr><td>${esc(y)}</td><td>${mehrzahl(n('titel'),'Titel','Titel')} · `
          + `${mehrzahl(n('ausgabe'),'Ausgabe','Ausgaben')} · `
          + `${mehrzahl(n('sicherung'),'Sicherungspunkt','Sicherungspunkte')}</td></tr>`;
      }).join('');
      const art = gleich ? 'steht hier schon genau so' : ziel ? 'ersetzt den vorhandenen' : 'kommt neu dazu';
      return `<div class="pr-jahr"><b>${esc(q.name || 'ohne Namen')}</b> – ${art}</div>`
        + `<table class="pr-tab"><tbody>${zeilen}</tbody></table>`;
    });
    const ersetzt = plan.filter(p=>p.ziel && !p.gleich && p.ziel.tabellen.ausgabe.length).map(p=>p.ziel);
    const warn = ersetzt.length
      ? `<div class="pr-warn"><div class="pr-warn-kopf">Vorhandener Inhalt wird ersetzt</div>`
        + ersetzt.map(b=>`»${esc(b.name || 'ohne Namen')}« mit ${mehrzahl(b.tabellen.ausgabe.length,'Ausgabe','Ausgaben')}`).join(', ')
        + '.' + (plan.some(({q, ziel, gleich})=>ziel && !gleich && ziel.tabellen.jahrgang.some(j=>q.tabellen.jahrgang.some(n=>n.jahr===j.jahr)))
          ? ` Der bisherige Stand bleibt als Sicherungspunkt »Vor dem Übernehmen« erhalten.` : '')
        + plan.filter(p=>p.ziel && !p.gleich).map(({q, ziel})=>{
            const da = new Set(q.tabellen.jahrgang.map(j=>j.jahr));
            const weg = ziel.tabellen.jahrgang.map(j=>j.jahr).filter(y=>!da.has(y)).sort();
            return weg.length ? ` Die gewählte Datei enthält für »${esc(ziel.name || 'ohne Namen')}« `
              + `${weg.length > 1 ? 'die Jahrgänge' : 'den Jahrgang'} ${weg.map(esc).join(', ')} nicht; `
              + `${weg.length > 1 ? 'sie entfallen' : 'er entfällt'}.` : '';
          }).join('') + `</div>` : '';
    const rest = (bleiben.length ? `<div class="pr-hinw">Unverändert bleiben: `
        + bleiben.map(b=>esc(b.name || 'ohne Namen')).join(', ') + '.</div>' : '')
      + (leere.length ? `<div class="pr-hinw">Entfällt, weil noch ohne Titel: `
        + leere.map(b=>b.name ? '»' + esc(b.name) + '«' : 'der angefangene Fachbereich ohne Namen').join(', ') + '.</div>' : '');
    const herkunft = erg.fassung ? `<div class="pr-hinw">Herkunft: ${esc(erg.fassung)}</div>` : '';
    altErgebnis = {plan, leere};
    dialogZeigen('Geprüft: ' + datei.name, warn + teile.join('') + rest + herkunft,
      ersetzt.length ? 'Trotzdem übernehmen' : 'Übernehmen', altUebernehmen, !!ersetzt.length);
  }catch(e){
    altErgebnis = null;
    dialogZeigen('Die Datei wurde nicht übernommen',
      '<div class="pr-fehler">' + esc(String(e.message||e)).replace(/\n/g,'<br>') + '</div>');
  }
}
async function altUebernehmen(){
  if(!altErgebnis) return dialogSchliessen();
  const {plan, leere} = altErgebnis;
  ladeKnoepfe(true);
  try{
    // Was ersetzt wird, bleibt im neuen Bestand als Sicherungspunkt
    // "Vor dem Übernehmen" erreichbar - je Jahrgang, den es dort weiter gibt.
    // Punkte von hier, die der neue Bestand nicht kennt, kommen mit.
    const vorher = [];
    for(const p of plan){
      if(!p.ziel || p.gleich) continue;
      const jahre = new Set(p.q.tabellen.jahrgang.map(j=>j.jahr));
      bereichSetzen(BEREICHE.indexOf(p.ziel));
      const daten = await datenHolen();
      vorher.push({ p,
        bloecke: Object.keys(daten).filter(y=>jahre.has(y) && daten[y].titel.length)
          .map(y=>[y, jahrgangAlsBlock(y, daten[y])]),
        alte: p.ziel.tabellen.sicherung.filter(s=>jahre.has(s.jahr)
          && !p.q.tabellen.sicherung.some(n=>n.id===s.id)) });
    }
    plan.forEach(({q, ziel})=>{
      if(ziel){
        ziel.tabellen = q.tabellen; ziel.name = q.name;
        // Ein Kontakt, den die andere Datei nicht fuehrt, bleibt stehen.
        if(kontaktDa(q.kontakt)) ziel.kontakt = q.kontakt;
      }
      else BEREICHE.push(q);
    });
    for(const {p, bloecke, alte} of vorher){
      p.q.tabellen.sicherung.push(...alte);
      bereichSetzen(BEREICHE.indexOf(p.ziel));
      for(const [y, block] of bloecke)
        await dbAnfrage('/rest/v1/sicherung', {
          method:'POST', headers:{ Prefer:'return=minimal' },
          body: JSON.stringify({ jahr: y, bezeichnung: 'Vor dem Übernehmen', inhalt: block })
        });
    }
    BEREICHE = BEREICHE.filter(b=>!leere.includes(b));
    // Gezeigt wird danach der erste uebernommene Fachbereich.
    bereichSetzen(BEREICHE.indexOf(plan[0].ziel || plan[0].q));
    bereicheOrdnen();
    bearbOffen = false;
    altErgebnis = null;
    dialogSchliessen();
    await bereichZeigen();
    dateiGeaendert();
    // Uebernommen ist erst, was in der Datei steht. Der Knopf ist ein Klick
    // des Benutzers - nur so darf der Browser nach dem Speicherort fragen.
    if(!dateiHandle)
      dialogZeigen('Übernommen', '<p>Der Inhalt wurde in diese Datei übernommen, ist jedoch '
        + 'noch nicht gesichert. Mit »Sichern« wird er dauerhaft gespeichert.</p><p>Anschließend '
        + 'wird ausschließlich mit dieser Datei weitergearbeitet; die ältere Datei wird nicht mehr '
        + 'benötigt.</p>', 'Sichern',
        ()=>{ dialogSchliessen(); dateiSichern(); });
  }catch(fehler){ ladeStand(fehlertext(fehler), true); ladeKnoepfe(false); }
}

// ── Name des Fachbereichs ──
function fachKopf(){ return FACHBEREICH ? FACHBEREICH + '/Print' : 'Print'; }
function dateiFach(){
  return FACHBEREICH ? FACHBEREICH.trim().replace(/[\\/:*?"<>|\s]+/g,'-') + '-' : '';
}
function kopfFachbereich(){

async function fachbereichAendern(){
  schliesseDaten();
  const b = BEREICHE[AKTIV];
  if(!b) return ersterStart();
  const neu = await eingabe('Fachbereich umbenennen',
    'Der Name steht im Kopf, im Druck, in Excel und im Dateinamen der Ausgaben.'
    + (BEREICHE.length < 2 ? ' Bleibt das Feld leer, heißt es nur »Jahresvorschau Print«.' : ''),

// ── Titelcover ──
// Die Leiste zeigt die gewaehlten Titel, soweit sie ein Cover haben. Das
// Raster richtet sich nach der Breite: am Schirm ab 1300 px wie quer, im
// Druck nach dem gewaehlten Format (beforeprint), sonst wie hoch.
let coverImDruck = false;
function coverLeiste(){
  const el = document.getElementById('coverLeiste');
  if(!el) return;
  const ts = JOURNALS.filter(j=>j.cover && (activeJ.size===0 || activeJ.has(j.id)));
  el.innerHTML = ts.map(j=>{
    const n = j.issues.length;
    const aufl = Number(j.auflage) ? '<span>' + Number(j.auflage).toLocaleString('de-DE') + ' Expl.</span>' : '';
    return `<div class="cl-feld"><img src="${escA(j.cover)}" alt=""><div class="cl-text">`
      + `<div class="cl-name">${esc(j.short)}</div>`
      + `<div class="cl-info">${aufl}<span>${n} Heft${n===1?'':'e'} ${esc(jahrgang())}</span></div></div></div>`;
  }).join('');
  coverRaster();
}
function coverRaster(){
  const el = document.getElementById('coverLeiste');
  const n = el ? el.children.length : 0;
  if(!n) return;
  const quer = coverImDruck ? (druckFormat || empfohlenesFormat())==='landscape'
                            : window.innerWidth >= 1300;
  const mx = quer ? 9 : 6;
  let c = Math.min(n, mx);
  if(n > mx){ const reihen = Math.ceil(n / mx); c = Math.ceil(n / reihen); }
  el.style.setProperty('--cl', c);
  el.classList.toggle('neben', c <= (quer ? 5 : 3));
}
window.addEventListener('resize', ()=>{ if(!coverImDruck) coverRaster(); });
window.addEventListener('beforeprint', ()=>{ coverImDruck = true; coverRaster(); });
window.addEventListener('afterprint', ()=>{ coverImDruck = false; coverRaster(); });
// Verkleinert auf hoechstens 300 x 400 px, als JPEG - so bleibt die Datei
// leicht, und fuer den Druck in Leistengroesse reicht es.
function coverWaehlen(){
  const ein = document.createElement('input');
  ein.type = 'file'; ein.accept = 'image/*';
  ein.onchange = ()=>{
    const datei = ein.files && ein.files[0];
    if(!datei) return;
    const leser = new FileReader();
    leser.onload = ()=>{
      const bild = new Image();
      bild.onload = ()=>{
        const f = Math.min(1, 300 / bild.naturalWidth, 400 / bild.naturalHeight);
        const w = Math.max(1, Math.round(bild.naturalWidth * f)), h = Math.max(1, Math.round(bild.naturalHeight * f));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
        x.drawImage(bild, 0, 0, w, h);
        if(!entwurf) return;
        entwurf.cover = c.toDataURL('image/jpeg', 0.85);
        bearbFormNeu();
        bearbStand('Nicht gespeichert', '');
      };
      bild.onerror = ()=> bearbStand('Das Bild lässt sich nicht lesen. Erwartet wird ein JPG oder PNG.', 'schlecht');
      bild.src = leser.result;
    };
    leser.readAsDataURL(datei);
  };
  ein.click();
}
function coverWeg(){
  if(!entwurf) return;
  entwurf.cover = '';
  bearbFormNeu();
  bearbStand('Nicht gespeichert', '');
}

// ── Kontakt des Fachbereichs ──
// Ein Kontakt gilt fuer den ganzen Fachbereich und liegt darum am Eintrag in
// BEREICHE, nicht in den Tabellen eines Jahrgangs. Er steht nicht neben den
// Inhalten, sondern im Kopf: am Bildschirm oben rechts ueber dem Stand, im PDF
// rechts unter dem Logo. Sind alle Felder leer, steht nichts da.
const KONTAKT_FELDER = ['name', 'funktion', 'tel', 'mail'];
function kontaktLesen(k){
  const r = {};
  KONTAKT_FELDER.forEach(f=>{ r[f] = String((k && k[f]) || '').trim(); });
  return r;
}
function kontaktDa(k){ return !!k && KONTAKT_FELDER.some(f=>String(k[f] || '').trim()); }
function kontaktJetzt(){ return kontaktLesen(BEREICHE[AKTIV] && BEREICHE[AKTIV].kontakt); }
function kontaktHtml(k, link){
  if(!kontaktDa(k)) return '';
  const z1 = [k.name ? '<b>' + esc(k.name) + '</b>' : '', esc(k.funktion)].filter(Boolean).join(', ');
  const mail = k.mail ? (link ? `<a href="mailto:${escA(k.mail)}">${esc(k.mail)}</a>` : esc(k.mail)) : '';
  const z2 = [k.tel ? 'Tel. ' + esc(k.tel) : '', mail].filter(Boolean).join(' · ');
  return 'Kontakt: ' + [z1, z2].filter(Boolean).join('<br>');
}

// zum Eintragen oeffnet - gepflegt wird er dort, wo er zu sehen ist; einen

    : kontaktHtml(k, true);

async function ersterStartAusfuehren(neu){
  const y = (document.getElementById('ersJahr').value || '').trim();

  if(!/^\d{4}$/.test(y))

    : bereichNamePruefen(name, anlegen ? null : b);

  const vorher = BEREICHE[AKTIV];
  ladeKnoepfe(true);
  try{
    if(anlegen){ BEREICHE.push(b); bereichSetzen(BEREICHE.length - 1); }
    else b.name = name;

// ── Kongresse als Text ──
// Seit Print 3 stehen die Kongresse einer Ausgabe nur noch als Textliste in
// ausgabe.auslagen, ein Eintrag je Zeile; ein Bericht traegt "(Bericht)" am
// Ende. Was eine aeltere Fassung als Bericht oder als eigenen Kongresssatz
// mit Zuordnung fuehrte, wird beim Oeffnen und beim Uebernehmen dahin
// umgeschrieben - verloren geht dabei nichts.
function kongresseZusammen(a, b){
  return (a||[]).map(t=>String(t).trim()).filter(Boolean).concat((b||[])
    .map(t=>String(t).trim()).filter(Boolean)
    .map(t=>/\(Bericht\)$/.test(t) ? t : t + ' (Bericht)'));
}
function kongresseAlsText(t){
  const kong = t.kongress || [], zu = t.kongress_ausgabe || [];
  const nachId = new Map(kong.map(k=>[k.id, k]));
  const umgestellt = new Set(kong.map(k=>String(k.jahr)));
  (t.ausgabe || []).forEach(a=>{
    if(umgestellt.has(String(a.jahr))){
      const eigene = zu.filter(z=>z.ausgabe_id===a.id)
        .map(z=>({k:nachId.get(z.kongress_id), art:z.art})).filter(x=>x.k)
        .sort((x,y)=>kongVergleich(kongSchluessel(x.k, a.jahr), kongSchluessel(y.k, a.jahr)));
      a.auslagen = eigene.filter(x=>x.art!=='bericht').map(x=>kongressAus(x.k));
      a.berichte = eigene.filter(x=>x.art==='bericht').map(x=>kongressAus(x.k));
    }
    a.auslagen = kongresseZusammen(a.auslagen, a.berichte);
    a.berichte = [];
  });
  t.kongress = []; t.kongress_ausgabe = [];
  return t;
}
BEREICHE.forEach(b=>{ if(b && b.tabellen) kongresseAlsText(b.tabellen); });
